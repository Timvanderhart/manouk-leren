{w:5,t:"Bestuursorgaan",q:"Een a-bestuursorgaan sluit een huurovereenkomst voor een kantoorpand. Is het daarbij een bestuursorgaan?",o:["Ja, een a-orgaan blijft bestuursorgaan, ook bij privaatrechtelijk handelen","Nee, alleen bij publiekrechtelijk handelen is het een bestuursorgaan","Alleen als de huurprijs met overheidsgeld wordt betaald"],a:0,e:"Bij a-organen staat de organisatorische positie centraal: het blijft bestuursorgaan bij publiekrechtelijk, privaatrechtelijk en feitelijk handelen. Wel gelden niet alle Awb-regels voor iedere handeling."},
{w:5,t:"Bestuursorgaan",q:"Een erkende APK-keurder, een privaat garagebedrijf, keurt een auto af. Wat is de keurder bij die beslissing?",o:["Een b-bestuursorgaan, want hij oefent wettelijk openbaar gezag uit","Een a-bestuursorgaan, want hij voert een publieke taak uit","Geen bestuursorgaan, want hij is een privaat bedrijf"],a:0,e:"Een privaat bedrijf kan b-orgaan zijn als het (wettelijk) openbaar gezag uitoefent: eenzijdig de rechtspositie van anderen bepalen. Dat is alleen zo voor zover het die bevoegdheid uitoefent."},
{w:5,t:"Bestuursorgaan",q:"Een stichting verdeelt sportsubsidies aan verenigingen. De gemeente betaalt 80% van het subsidiebudget, maar het stichtingsbestuur bepaalt zelf alle criteria. Is het bestuur van de stichting een b-orgaan?",o:["Nee, want het inhoudelijke vereiste is niet vervuld: a-organen bepalen de criteria niet in beslissende mate","Ja, want de verstrekking wordt in overwegende mate door een a-orgaan gefinancierd","Ja, want de stichting voert een publieke taak uit"],a:0,e:"Voor buitenwettelijk openbaar gezag moeten beide cumulatieve vereisten zijn vervuld: het inhoudelijke (a-organen bepalen de criteria) én het financiële (twee derde of meer). Alleen geld of een publieke taak is onvoldoende."},
{w:5,t:"Bestuursorgaan",q:"Wanneer kan een orgaan van een privaatrechtelijke rechtspersoon zonder wettelijke bevoegdheid toch b-orgaan zijn?",o:["Bij geldelijke uitkeringen of op geld waardeerbare voorzieningen, als a-organen de criteria bepalen én de verstrekkingen in overwegende mate financieren","Als het een publieke taak uitvoert in opdracht van de overheid","Als de overheid meer dan de helft van de organisatie financiert"],a:0,e:"Buitenwettelijk openbaar gezag: alleen voor uitkeringen en voorzieningen, met twee cumulatieve vereisten. Het gaat om de financiering van de verstrekkingen, niet om de algemene financiering van de organisatie."},
{w:5,t:"Decentralisatie",q:"Welke van onderstaande is een voorbeeld van functionele decentralisatie?",o:["De Nederlandse Orde van Advocaten","De provincie Utrecht","Het openbaar lichaam Bonaire"],a:0,e:"Functionele decentralisatie is gericht op bepaalde taken of beroepen, zoals een beroepsorganisatie. Provincies en de openbare lichamen (Bonaire, Sint Eustatius, Saba) zijn territoriaal."},
{w:5,t:"Decentralisatie",q:"Welke uitspraak over een zelfstandig bestuursorgaan (zbo) is juist?",o:["Een zbo is niet hiërarchisch ondergeschikt aan een minister","Een zbo is altijd een b-orgaan","Een zbo is geen bestuursorgaan in de zin van de Awb"],a:0,e:"Zbo is een andere indeling dan a- of b-orgaan. Een zbo kan a-orgaan of b-orgaan zijn; kenmerkend is dat het niet hiërarchisch onder een minister valt."},
{w:5,t:"Vertrouwensbeginsel",q:"Wat heeft de ABRvS in Amsterdams dakterras over het vertrouwensbeginsel geoordeeld?",o:["Gerechtvaardigde verwachtingen kunnen worden gehonoreerd als er geen zwaarder wegende belangen aan in de weg staan","Gerechtvaardigde verwachtingen kunnen alleen worden gehonoreerd bij een schriftelijke toezegging","Een toezegging van een onbevoegde ambtenaar kan nooit tot gerechtvaardigd vertrouwen leiden"],a:0,e:"Stap 3 van Dakterras: belangenafweging. Een mondelinge toezegging kan ook meetellen, en een toezegging van een ambtenaar kan onder omstandigheden aan het bevoegde orgaan worden toegerekend. Deze vraag stond zo op de eindtoets van 2025."},
{w:5,t:"Vertrouwensbeginsel",q:"Een baliemedewerker van de gemeente zegt tegen Ayla: ‘In het algemeen mag je een dakkapel aan de achterkant zonder vergunning bouwen.’ Ayla bouwt een dakkapel, maar haar situatie blijkt anders. Is er een toezegging in de zin van Dakterras?",o:["Waarschijnlijk niet: algemene informatie is meestal onvoldoende, het moet gaan om een bewust standpunt over haar concrete situatie","Ja, elke uitspraak van een gemeenteambtenaar is een toezegging","Ja, want een mondelinge uitspraak is altijd voldoende"],a:0,e:"Stap 1: kon de burger redelijkerwijs begrijpen dat het bestuur een bewust standpunt over haar concrete situatie innam? Algemene informatie is meestal te weinig."},
{w:5,t:"Vertrouwensbeginsel",q:"Een ambtenaar heeft na het bekijken van concrete bouwtekeningen schriftelijk toegezegd dat de gemeente niet zal handhaven. De buren lijden echter ernstige schade. Wat volgt uit Dakterras?",o:["Het bestuur moet belangen afwegen; zwaarder wegende belangen van derden kunnen honorering in de weg staan","Het bestuur moet de toezegging altijd nakomen","De toezegging telt niet, want de ambtenaar was niet zelf bevoegd"],a:0,e:"Stap 2 (toerekening) kan slagen ook als de ambtenaar niet zelf bevoegd was. In stap 3 worden belangen afgewogen. Kan het vertrouwen niet worden gehonoreerd, dan kan vergoeding van vertrouwensschade aan de orde zijn."},
{w:5,t:"Evenredigheid",q:"Volgens Harderwijk kan de evenredigheidstoets drie aspecten hebben. Welke?",o:["Geschiktheid, noodzakelijkheid en evenwichtigheid","Geschiktheid, noodzakelijkheid en redelijkheid","Legaliteit, legitiem doel en noodzakelijkheid"],a:0,e:"Harderwijk: geschiktheid, noodzakelijkheid, evenwichtigheid. Let op de term evenwichtigheid; ‘redelijkheid’ is fout (zo stond het in een afleider op de eindtoets). Optie 3 lijkt op het EVRM-schema."},
{w:5,t:"Evenredigheid",q:"Een burgemeester sluit een woning voor zes maanden na een drugsvondst. Het gezin met jonge kinderen moet eruit, hoewel de ouders van niets wisten. Bij welk aspect van de evenredigheidstoets weegt dit vooral mee?",o:["Evenwichtigheid","Geschiktheid","Noodzakelijkheid"],a:0,e:"Evenwichtigheid: zijn de gevolgen in deze concrete situatie niet onredelijk zwaar? Daar wegen de aanwezigheid van kinderen en de (geringe) verwijtbaarheid van de bewoners mee."},
{w:5,t:"Evenredigheid",q:"Een gemeente kan een overlastgevende hond laten aanlijnen of de hond in beslag nemen. Beide helpen even goed. Ze kiest inbeslagname. Welk aspect van evenredigheid is hier in het geding?",o:["Noodzakelijkheid","Geschiktheid","Evenwichtigheid"],a:0,e:"Noodzakelijkheid: kan hetzelfde doel worden bereikt met een minder belastende maatregel? Een maatregel kan geschikt zijn terwijl een minder ingrijpend alternatief ook werkt."},
{w:5,t:"Evenredigheid",st:true,q:"Lees de volgende stellingen.",s1:"Art. 3:4 lid 2 Awb bevat het evenredigheidsbeginsel.",s2:"Hoe ingrijpender de gevolgen van een besluit, hoe minder intensief de rechter toetst.",a:"JO",e:"Art. 3:4 lid 1 gaat over belangenafweging, lid 2 over evenredigheid. De intensiteit van de toetsing neemt juist toe naarmate de gevolgen ingrijpender en de belangen zwaarder zijn."},
{w:5,t:"Awb",q:"Een Awb-regel geldt alleen als een bijzondere wet haar van toepassing verklaart. Wat voor soort regel is dat?",o:["Facultatief recht","Aanvullend recht","Regelend recht"],a:0,e:"Facultatief: geldt pas als het van toepassing is verklaard. Aanvullend: geldt als de bijzondere regeling het onderwerp niet zelf regelt. Regelend: hoofdregel waarvan een wettelijk voorschrift afwijking kan toestaan."},
{w:5,t:"Abbb",st:true,q:"Lees de volgende stellingen.",s1:"Als een formeel beginsel van behoorlijk bestuur is geschonden, moet het bestuursorgaan vaak een nieuw besluit nemen en daarbij de juiste spelregels volgen.",s2:"Het zorgvuldigheidsbeginsel, het motiveringsbeginsel en het rechtszekerheidsbeginsel hebben allemaal een formele en een materiële kant.",a:"JJ",e:"Bij een formeel gebrek (procedure) kan het orgaan het besluit opnieuw nemen, met mogelijk dezelfde uitkomst. Zorgvuldigheid, motivering en rechtszekerheid kennen elk een formele en een materiële variant. Zo stond het op de eindtoets van 2025."},
{w:5,t:"Abbb",q:"Welke uitspraak over het vertrouwensbeginsel is juist?",o:["Het is een ongeschreven beginsel, maar wel juridisch bindend","Het staat in art. 3:4 lid 2 Awb","Het is niet bindend omdat het niet is gecodificeerd"],a:0,e:"Het vertrouwensbeginsel is ongeschreven. Ook ongeschreven beginselen zijn juridisch bindend. Art. 3:4 lid 2 Awb bevat het evenredigheidsbeginsel."},

// ---------- WEEK 6 ----------
{w:6,t:"Besluit",q:"Welke vier elementen bevat het besluitbegrip van art. 1:3 lid 1 Awb?",o:["Schriftelijke beslissing, bestuursorgaan, publiekrechtelijk, rechtshandeling","Schriftelijk, belanghebbende, algemene strekking, rechtsgevolg","Bestuursorgaan, bevoegdheid, motivering, bekendmaking"],a:0,e:"Een besluit is een schriftelijke beslissing van een bestuursorgaan, inhoudende een publiekrechtelijke rechtshandeling. Alle vier moeten aanwezig zijn."},
{w:6,t:"Besluit",q:"Een handhaver zegt ter plekke mondeling tegen een kroegbaas dat zijn terras vanaf morgen dicht moet. Is dit een besluit in de zin van art. 1:3 lid 1 Awb?",o:["Nee, want het is niet schriftelijk; maar het kan wel op rechtsgevolg gericht zijn","Ja, want het is gericht op rechtsgevolg","Nee, want het is een feitelijke handeling"],a:0,e:"Een mondelinge beslissing is geen besluit, omdat het element ‘schriftelijk’ ontbreekt. Dat maakt het niet automatisch een feitelijke handeling."},
{w:6,t:"Besluit",q:"De gemeente verkoopt een stuk grond aan een projectontwikkelaar. Wat voor handeling is dit?",o:["Een privaatrechtelijke rechtshandeling","Een publiekrechtelijke rechtshandeling","Een feitelijke handeling"],a:0,e:"De verkoop is gericht op rechtsgevolg, maar berust op het privaatrecht. Daarom is het geen besluit in de zin van de Awb."},
{w:6,t:"Besluit",q:"Het college wijst een specifiek pand aan de Oudegracht aan als gemeentelijk monument. Welk criterium maakt dit tot een beschikking?",o:["Het zaakscriterium","Het persoonscriterium","Het criterium van algemene strekking"],a:0,e:"Zaakscriterium: gericht op een specifiek object waarvan de bijzondere eigenschappen doorslaggevend zijn. Persoonscriterium: gericht tot een bepaalde persoon of gesloten groep."},
{w:6,t:"Besluit",q:"De gemeente wijst een aanvraag voor een parkeervergunning af. Is die afwijzing een beschikking?",o:["Ja, art. 1:3 lid 2 Awb rekent de afwijzing van een aanvraag uitdrukkelijk tot de beschikking","Nee, een afwijzing heeft geen rechtsgevolg","Nee, alleen een verleende vergunning is een beschikking"],a:0,e:"Art. 1:3 lid 2 Awb: een beschikking is een besluit dat niet van algemene strekking is, met inbegrip van de afwijzing van een aanvraag daarvan."},
{w:6,t:"Besluit",q:"Het college stelt vast hoe het in het algemeen omgaat met zijn bevoegdheid om handhavingsverzoeken te behandelen. Wat is dit?",o:["Een beleidsregel","Een algemeen verbindend voorschrift","Een beschikking"],a:0,e:"Een beleidsregel gaat over de manier waarop een orgaan een bevoegdheid gebruikt. Er is geen rechtstreeks beroep tegen mogelijk (art. 8:3 Awb)."},
{w:6,t:"Besluit",q:"Tegen welk besluit staat in beginsel rechtstreeks beroep bij de bestuursrechter open?",o:["Een besluit van algemene strekking dat geen AVV en geen beleidsregel is","Een algemeen verbindend voorschrift","Een beleidsregel"],a:0,e:"Art. 8:3 lid 1 sub a Awb sluit beroep tegen AVV's en beleidsregels uit. Tegen overige besluiten van algemene strekking staat in beginsel wel beroep open."},
{w:6,t:"Besluit",q:"Een burger vraagt het college om handhavend op te treden tegen een illegale schuur van de buren. Het college besluit te gedogen. Wat is juist?",o:["De beslissing op het handhavingsverzoek kan appellabel zijn, ook al is een gedoogbeslissing in beginsel geen besluit","Een gedoogbeslissing is altijd een besluit","Tegen gedogen staat nooit enige rechtsbescherming open"],a:0,e:"Gedoogbeslissingen zijn in beginsel geen besluit. Een belanghebbende derde kan wel om handhaving verzoeken; de beslissing daarop kan appellabel zijn."},
{w:6,t:"Besluit",q:"De gemeente laat in een brief weten hoe zij een bepaalde regel uitlegt, zonder iets voor de burger vast te stellen. Wat is dit meestal?",o:["Een bestuurlijk rechtsoordeel, meestal geen besluit","Een beschikking","Een algemeen verbindend voorschrift"],a:0,e:"Een bestuurlijk rechtsoordeel is uitleg van het bestuur. Er wordt geen rechtsgevolg beoogd, dus meestal is het geen besluit."},
{w:6,t:"Beschikkingen",q:"Een subsidie wordt verleend, en het bestuursorgaan had daarbij ruimte om belangen af te wegen. Welke typering past?",o:["Begunstigend en discretionair","Belastend en gebonden","Begunstigend en gebonden"],a:0,e:"Een subsidie verbetert de rechtspositie (begunstigend). Ruimte om af te wegen betekent discretionair. Het zijn verschillende indelingen die samen kunnen gaan."},
{w:6,t:"Beslissingsruimte",q:"‘De burgemeester kan voor een gevaarlijke hond een aanlijngebod opleggen.’ Wat is ‘gevaarlijke hond’ in deze bepaling?",o:["De normconditie","De beleidsruimte","Het rechtsgevolg"],a:0,e:"De normconditie is de wettelijke voorwaarde voordat de bevoegdheid mag worden gebruikt. ‘Kan opleggen’ wijst op beleidsruimte."},
{w:6,t:"Beslissingsruimte",st:true,q:"Lees de volgende stellingen.",s1:"Een vage term in een wettelijke voorwaarde betekent automatisch dat het bestuur beoordelingsruimte heeft.",s2:"Ook als het bestuur beslissingsruimte heeft, kan de rechter het besluit toetsen aan de algemene beginselen van behoorlijk bestuur.",a:"OJ",e:"Je moet onderzoeken of de wetgever echt ruimte heeft willen geven; een vage term is niet automatisch beoordelingsruimte. Beslissingsruimte is geen vrije macht: de rechter toetst onder meer aan de abbb."},
{w:6,t:"Beslissingsruimte",q:"Bij welke bepaling heeft het bestuursorgaan de meeste beslissingsruimte?",o:["‘Onze Minister kan ontheffing verlenen van het verbod, indien hij dat in het belang van de veiligheid aanvaardbaar acht.’","‘Het verlof wordt geweigerd indien de aanvrager jonger is dan 18 jaar.’","‘Het is verboden een wapen voorhanden te hebben.’"],a:0,e:"‘Kan’ wijst op beleidsruimte en ‘aanvaardbaar acht’ op beoordelingsruimte. Bij een leeftijdsgrens is er geen ruimte (gebonden). Een verbod is een gedragsnorm voor burgers. Op de eindtoets moest je dit zelf in de Wet wapens en munitie opzoeken."},
{w:6,t:"Beslissingsruimte",q:"Het college gebruikt een bevoegdheid om horecavergunningen te weigeren in werkelijkheid om een concurrent van een gemeentelijk zwembad dwars te zitten. Welke norm wordt geschonden?",o:["Het verbod van détournement de pouvoir (art. 3:3 Awb)","Het motiveringsbeginsel (art. 3:47 Awb)","Het vertrouwensbeginsel"],a:0,e:"Art. 3:3 Awb: een bevoegdheid mag niet worden gebruikt voor een ander doel dan waarvoor zij is verleend."},
{w:6,t:"Zorgvuldigheid",q:"Het college verklaart een hond gevaarlijk op basis van één onduidelijke melding, zonder verder onderzoek. Welk beginsel is vooral in het geding?",o:["Het zorgvuldigheidsbeginsel (art. 3:2 Awb)","Het kenbaarheidsvereiste (art. 3:47 Awb)","Het specialiteitsbeginsel"],a:0,e:"Art. 3:2 Awb: bij de voorbereiding de nodige kennis vergaren over de relevante feiten en belangen. Eén onduidelijke melding is geen deugdelijke feitelijke basis."},
{w:6,t:"Motivering",q:"Een vergunning wordt geweigerd met alleen de zin: ‘Dit past niet binnen het beleid.’ Welk beginsel schiet vooral tekort?",o:["Het motiveringsbeginsel","Het zorgvuldigheidsbeginsel","Het vertrouwensbeginsel"],a:0,e:"Het bestuur legt niet uit welk beleid geldt, welke feiten relevant zijn en waarom die tot weigering leiden. Dat is een gebrek in de (deugdelijke en kenbare) motivering."},
{w:6,t:"Motivering",q:"Wat is het verschil tussen art. 3:46 en art. 3:47 Awb?",o:["3:46 eist een deugdelijke motivering, 3:47 dat de motivering bij de bekendmaking wordt vermeld","3:46 gaat over horen, 3:47 over advies","3:46 eist een motivering bij beschikkingen, 3:47 bij AVV's"],a:0,e:"Deugdelijk (3:46): is de uitleg inhoudelijk draagkrachtig? Kenbaar (3:47): is de uitleg aan de belanghebbende meegedeeld?"},
{w:6,t:"Motivering",q:"Het college wijkt af van een wettelijk voorgeschreven advies van een adviescommissie. Wat moet het doen?",o:["De redenen voor de afwijking in de motivering vermelden (art. 3:50 Awb)","Het advies alsnog volgen, want afwijken mag niet","Niets, want een advies is nooit bindend"],a:0,e:"Art. 3:50 Awb: wie afwijkt van een wettelijk voorgeschreven advies, moet dat in de motivering uitleggen."},
{w:6,t:"Zorgvuldigheid",q:"Een aanvrager levert niet alle gegevens aan waarover hij redelijkerwijs kon beschikken. Welke plicht schendt hij?",o:["De informatieplicht van art. 4:2 lid 2 Awb","De onderzoeksplicht van art. 3:2 Awb","De motiveringsplicht van art. 3:46 Awb"],a:0,e:"De aanvrager moet de noodzakelijke gegevens verstrekken waarover hij redelijkerwijs kan beschikken. De onderzoeksplicht van het bestuur blijft daarnaast bestaan."},
{w:6,t:"Toetsingsverbod",q:"Mag de rechter een besluit van het college toetsen aan de algemene beginselen van behoorlijk bestuur?",o:["Ja; het toetsingsverbod van art. 120 Gw gaat over formele wetten en verdragen, niet over bestuursbesluiten","Nee, art. 120 Gw verbiedt dat","Alleen als het besluit op een AMvB berust"],a:0,e:"Art. 120 Gw verbiedt toetsing van formele wetten en verdragen aan de Grondwet. Bestuursbesluiten kunnen wel aan de abbb worden getoetst."},

// ---------- WEEK 7 ----------
{w:7,t:"Awb-structuur",q:"Wat staat (onder meer) geregeld in afdeling 7.2 van de Awb?",o:["Als het bezwaar ontvankelijk is, vindt op grondslag daarvan een heroverweging van het bestreden besluit plaats","Een belanghebbende kan tegen een besluit beroep instellen bij de bestuursrechter","Wie beroep bij de bestuursrechter kan instellen, moet eerst bezwaar maken"],a:0,e:"Afdeling 7.2 bevat bijzondere bepalingen over bezwaar, zoals de heroverweging van art. 7:11. De plicht om eerst bezwaar te maken staat in art. 7:1 (afdeling 7.1); beroep bij de rechter in hoofdstuk 8. Zo kwam het op de eindtoets van 2025."},
{w:7,t:"Bezwaar",q:"Wat is géén functie van de verplichte voorprocedure (bezwaar)?",o:["Bevestigingsfunctie","Dossierfunctie","Zeeffunctie"],a:0,e:"De functies zijn: laagdrempelige rechtsbescherming, verlengde besluitvorming, zeeffunctie, dossierfunctie en signaleringsfunctie. Een ‘bevestigingsfunctie’ bestaat niet."},
{w:7,t:"Bezwaar",q:"Welke functie van bezwaar staat centraal als geschillen al in de bezwaarfase worden opgelost, zodat ze niet bij de rechter komen?",o:["De zeeffunctie","De dossierfunctie","De signaleringsfunctie"],a:0,e:"Zeeffunctie: geschillen worden gefilterd voordat ze de rechter bereiken. Dossierfunctie: feiten en geschilpunten worden duidelijk. Signalering: fouten in beleid worden zichtbaar."},
{w:7,t:"Bezwaar",q:"Wat toetst het bestuursorgaan in bezwaar?",o:["Rechtmatigheid én doelmatigheid, in beginsel ex nunc","Alleen rechtmatigheid, ex tunc","Alleen doelmatigheid, ex tunc"],a:0,e:"Art. 7:11 Awb: volledige heroverweging. In bezwaar beoordeelt het orgaan zowel rechtmatigheid als doelmatigheid, op basis van de situatie op het moment van de beslissing op bezwaar (ex nunc)."},
{w:7,t:"Beroep",q:"Wat toetst de bestuursrechter in beroep?",o:["Alleen de rechtmatigheid, in beginsel ex tunc","Rechtmatigheid en doelmatigheid, ex nunc","Alleen de doelmatigheid, ex nunc"],a:0,e:"De rechter toetst rechtmatigheid naar de feiten en het recht op het moment van het bestreden besluit (ex tunc). Hij maakt zelf geen bestuurlijke keuzes."},
{w:7,t:"Bezwaar",q:"Mag het bestuursorgaan het horen in bezwaar overslaan omdat het bezwaar ‘waarschijnlijk’ ongegrond is?",o:["Nee, alleen bij een kennelijk ongegrond bezwaar, waarover redelijkerwijs geen twijfel bestaat","Ja, het orgaan mag altijd zelf bepalen of het hoort","Ja, horen is in bezwaar niet verplicht"],a:0,e:"Art. 7:3 Awb: horen mag onder meer achterwege blijven bij een kennelijk niet-ontvankelijk of kennelijk ongegrond bezwaar. ‘Kennelijk’ betekent: geen twijfel mogelijk."},
{w:7,t:"Bezwaar",q:"Sanne maakt bezwaar tegen een boete van €300. Het bestuursorgaan besluit de boete op uitsluitend haar bezwaar te verhogen naar €500. Welk verbod is in het geding?",o:["Het verbod van reformatio in peius","Het verbod van détournement de pouvoir","Het analogieverbod"],a:0,e:"Reformatio in peius: iemand mag door uitsluitend zijn eigen bezwaar in beginsel niet slechter af raken dan zonder dat bezwaar."},
{w:7,t:"Termijnen",q:"Een besluit is op maandag 2 maart bekendgemaakt. Wanneer begint de bezwaartermijn te lopen?",o:["Op dinsdag 3 maart, de dag na de bekendmaking","Op maandag 2 maart zelf","Op het moment dat de belanghebbende het besluit leest"],a:0,e:"Art. 6:8 Awb: de termijn van zes weken (art. 6:7) vangt aan met ingang van de dag na die waarop het besluit is bekendgemaakt."},
{w:7,t:"Termijnen",q:"Lars stuurt zijn bezwaarschrift per post. Hij post het op de laatste dag van de termijn; het komt vier dagen later aan. Is het bezwaar tijdig?",o:["Ja, het is vóór het einde van de termijn ter post bezorgd en binnen een week na afloop ontvangen","Nee, het moet binnen de termijn zijn ontvangen","Alleen als hij een verschoonbare reden heeft"],a:0,e:"Bij verzending per post is een bezwaarschrift tijdig als het vóór het einde van de termijn ter post is bezorgd en uiterlijk een week na afloop is ontvangen."},
{w:7,t:"Termijnen",q:"Fatima diende haar bezwaar twee weken te laat in, omdat zij in die periode met spoed in het ziekenhuis lag. Wat kan het bestuursorgaan (en later de rechter) oordelen?",o:["Dat de termijnoverschrijding verschoonbaar is (art. 6:11 Awb)","Dat het bezwaar prematuur is (art. 6:10 Awb)","Dat te laat altijd niet-ontvankelijk betekent"],a:0,e:"Bij een verschoonbare termijnoverschrijding kan de vertraging redelijkerwijs niet worden tegengeworpen, bijvoorbeeld door ernstige ziekte. Dat vraagt een individuele beoordeling."},
{w:7,t:"Termijnen",q:"Het bestuursorgaan beslist niet binnen de beslistermijn op een aanvraag. Wat kan de aanvrager doen?",o:["Een ingebrekestelling sturen en na twee weken beroep instellen wegens niet tijdig beslissen","Bezwaar maken tegen het uitblijven van een besluit","Direct naar de burgerlijke rechter stappen"],a:0,e:"Art. 6:12 Awb: na een schriftelijke ingebrekestelling en twee weken kan rechtstreeks beroep worden ingesteld. Het is dus in beginsel geen gewone bezwaarprocedure."},
{w:7,t:"Termijnen",q:"Wat is in beginsel de beslistermijn op een bezwaar als er geen adviescommissie is ingesteld?",o:["Zes weken","Twaalf weken","Acht weken"],a:0,e:"Art. 7:10 Awb: zes weken, of twaalf weken bij een adviescommissie, gerekend vanaf de dag na afloop van de bezwaartermijn. Verdaging met maximaal zes weken is mogelijk."},
{w:7,t:"Rechtsgang",q:"Welke rechter is de hogerberoepsrechter in een geschil over een bijstandsuitkering?",o:["De Centrale Raad van Beroep","De Afdeling bestuursrechtspraak van de Raad van State","Het College van Beroep voor het bedrijfsleven"],a:0,e:"Sociale zekerheid en bepaalde ambtenarenzaken: CRvB. Economisch bestuursrecht: CBb. Hoofdregel voor de rest: ABRvS."},
{w:7,t:"Rechtsgang",q:"Een inwoner van Utrecht wil beroep instellen tegen een besluit van het college van B&W van Amsterdam. Welke rechtbank is relatief bevoegd?",o:["De rechtbank Amsterdam, want bij een decentraal bestuursorgaan telt de vestigingsplaats van dat orgaan","De rechtbank Midden-Nederland, want de woonplaats van de indiener is bepalend","Iedere rechtbank naar keuze van de indiener"],a:0,e:"Art. 8:7 Awb: bij een decentraal bestuursorgaan is de vestigingsplaats van het orgaan bepalend. Bij andere bestuursorganen telt de woonplaats van de indiener."},
{w:7,t:"Rechtsgang",q:"Welke stelling over de rechtsmachtverdeling tussen bestuursrechter en burgerlijke rechter is juist?",o:["De eiser is bij de burgerlijke rechter niet-ontvankelijk als er nog een bestuursrechtelijke rechtsgang openstaat","De burgerlijke rechter staat pas open als alle bestuursrechtelijke rechtsmiddelen zijn uitgeput","Voor toegang tot de burgerlijke rechter is een besluit in de zin van de Awb vereist"],a:0,e:"De burgerlijke rechter is restrechter. Staat er een bestuursrechtelijke rechtsgang open, dan moet je daar naartoe. Zo stond deze vraag op de eindtoets van 2025."},
{w:7,t:"Rechtsbescherming",q:"Welke stelling over het relatief informele karakter van de bestuursrechtspraak is onjuist?",o:["De bestuursrechtspraak regelt voor iedereen een goede advocaat om tot ongelijkheidscompensatie te komen","De bestuursrechtspraak is laagdrempelig door het relatief lage griffierecht","Door een actieve rol van de bestuursrechter neemt de kans op procedurele rechtvaardigheid toe"],a:0,e:"Een advocaat is in het bestuursrecht niet verplicht, maar de bestuursrechtspraak regelt er ook niet voor iedereen een. Ongelijkheid wordt gecompenseerd door laagdrempeligheid en een actieve rechter."},
{w:7,t:"Beroep",q:"De rechter oordeelt dat het beroep slaagt omdat het besluit onvoldoende is gemotiveerd. Welke uitspraak doet hij?",o:["Het beroep is gegrond","Het beroep is niet-ontvankelijk","Het beroep is ongegrond"],a:0,e:"Art. 8:70 Awb: gegrond als het beroep geheel of gedeeltelijk slaagt. Niet-ontvankelijk gaat over procedurele voorwaarden; ongegrond betekent dat de gronden niet slagen."},
{w:7,t:"Beroep",q:"De rechter vernietigt een besluit, maar laat de rechtsgevolgen ervan in stand omdat het orgaan hetzelfde besluit opnieuw met een goede motivering zou nemen. Op welk artikel is dit gebaseerd?",o:["Art. 8:72 Awb","Art. 8:70 Awb","Art. 6:16 Awb"],a:0,e:"Art. 8:72 Awb geeft de rechter bij een gegrond beroep mogelijkheden zoals vernietigen, zelf voorzien en rechtsgevolgen in stand laten. Art. 8:70 noemt de soorten uitspraak."},
{w:7,t:"Voorlopige voorziening",q:"De gemeente wil een monumentale boom volgende week kappen. Een omwonende heeft bezwaar gemaakt. Wat kan hij doen om de kap tegen te houden?",o:["Een voorlopige voorziening vragen (art. 8:81 Awb), omdat bezwaar het besluit niet schorst","Niets, want het bezwaar schorst het besluit al automatisch","Direct hoger beroep instellen bij de ABRvS"],a:0,e:"Bezwaar en beroep schorsen niet (art. 6:16 Awb). Bij spoedeisend belang en een lopende procedure (connexiteit) kan een voorlopige voorziening worden gevraagd."},
{w:7,t:"Bezwaar overslaan",q:"In welk geval hoeft een belanghebbende géén bezwaar te maken voordat hij beroep instelt?",o:["Als het besluit is voorbereid met de uniforme openbare voorbereidingsprocedure (afdeling 3.4 Awb)","Als hij het besluit erg onrechtvaardig vindt","Als hij een advocaat heeft"],a:0,e:"Bezwaar kan worden overgeslagen bij de uniforme openbare voorbereidingsprocedure, bij een beslissing op bezwaar, bij niet tijdig beslissen, als een bijzondere wet dat bepaalt of met instemming voor rechtstreeks beroep (art. 7:1a)."},
{w:7,t:"Bestuursrechtspraak",q:"Wat is het verschil tussen recours subjectif en recours objectif?",o:["Subjectif: de individuele burger beschermen; objectif: bewaken dat het bestuur zich aan het recht houdt","Subjectif: beroep bij de rechtbank; objectif: hoger beroep","Subjectif: bezwaar; objectif: beroep"],a:0,e:"De twee doelen van bestuursrechtelijke rechtsbescherming: individuele rechtsbescherming en rechtmatigheidscontrole van het bestuur."},

// ---------- WEEK 8 ----------
{w:8,t:"Soorten grondrechten",q:"De vrijheid van vergadering en betoging is vooral een:",o:["Klassiek grondrecht, gericht op onthouding van overheidsinmenging","Sociaal grondrecht, gericht op actieve zorg van de overheid","Politiek participatierecht zonder enige vrijheidskant"],a:0,e:"Klassieke grondrechten beschermen tegen overheidsinmenging en sluiten aan bij negatieve vrijheid. Ook hier kan wel een positieve verplichting bestaan, bijvoorbeeld een vreedzame demonstratie beschermen."},
{w:8,t:"Soorten grondrechten",st:true,q:"Lees de volgende stellingen.",s1:"Klassieke grondrechten kunnen ook positieve verplichtingen voor de overheid meebrengen.",s2:"Sociale grondrechten zijn juridisch betekenisloos.",a:"JO",e:"Het onderscheid is niet absoluut: ook klassieke rechten kunnen de overheid tot actie verplichten. Sociale grondrechten verplichten tot zorg en inspanning, al geven ze meestal geen recht op een concreet resultaat."},
{w:8,t:"Reikwijdte",q:"Een kerkgenootschap beroept zich op de godsdienstvrijheid. Om welke vraag gaat het eerst?",o:["De personele reikwijdte: kan deze rechtspersoon zich op het grondrecht beroepen?","De materiële reikwijdte: valt de activiteit onder het grondrecht?","De beperking: grijpt de overheid in?"],a:0,e:"Personele reikwijdte: wie wordt beschermd? Ook rechtspersonen kunnen bepaalde grondrechten hebben, zoals een kerkgenootschap bij godsdienstvrijheid."},
{w:8,t:"Reikwijdte",q:"Welke uitspraak over beperking en schending is juist?",o:["Een beperking is pas een schending als zij niet aan de voorwaarden voldoet","Iedere beperking van een grondrecht is een schending","Een schending is een beperking die wel aan de voorwaarden voldoet"],a:0,e:"Een toegestane beperking voldoet aan alle toepasselijke voorwaarden. Een schending doet dat niet."},
{w:8,t:"Reikwijdte",q:"Welk grondrecht is absoluut en kan ook in een noodtoestand niet worden beperkt?",o:["Het folterverbod (art. 3 EVRM)","De vrijheid van meningsuiting (art. 10 EVRM)","De vrijheid van vergadering (art. 11 EVRM)"],a:0,e:"Het folterverbod is absoluut. Uitingsvrijheid en vergadervrijheid zijn relatief: beperking is mogelijk onder voorwaarden."},
{w:8,t:"Grondwet",q:"Wat betekent ‘wet’ in een grondwettelijke beperkingsclausule?",o:["Een wet in formele zin","Iedere regel van nationaal recht, ook ongeschreven recht","Iedere wet in materiële zin"],a:0,e:"In de Grondwet betekent ‘wet’ een wet in formele zin. In het EVRM is ‘wet’ veel ruimer: ook lagere regelgeving en ongeschreven recht."},
{w:8,t:"Grondwet",q:"Een burgemeester verbiedt een demonstratie omdat de boodschap ‘schadelijk voor het imago van de stad’ is. Waarom is dat volgens art. 9 lid 2 Gw problematisch?",o:["Het is geen toegestaan doel: alleen gezondheid, verkeer en het bestrijden of voorkomen van wanordelijkheden","De burgemeester mag nooit een demonstratie beperken","Art. 9 Gw beschermt alleen demonstraties binnen gebouwen"],a:0,e:"Art. 9 lid 2 Gw noemt de doelen waarvoor beperking mag. Een ander doel volstaat niet, ook als het bestuur dat belangrijk vindt. Onenigheid met de boodschap is nooit genoeg."},
{w:8,t:"Grondwet",st:true,q:"Lees de volgende stellingen.",s1:"Als de Grondwet delegatie van de beperkingsbevoegdheid toestaat, mag een burgemeester het grondrecht automatisch beperken.",s2:"Bij ‘behoudens ieders verantwoordelijkheid volgens de wet’ mag de beperkingsbevoegdheid niet worden gedelegeerd.",a:"OJ",e:"Delegatie mogen toestaan is iets anders dan daadwerkelijk gedelegeerd hebben: er moet ook een concrete wettelijke grondslag voor het lagere orgaan bestaan. ‘Behoudens ieders verantwoordelijkheid volgens de wet’ betekent: geen delegatie."},
{w:8,t:"Grondwet",q:"Welk grondrecht kent procedurecriteria zoals voorafgaande legitimatie en schriftelijke verslaglegging?",o:["Het recht op onaantastbaarheid van de woning (art. 12 Gw)","De vrijheid van godsdienst (art. 6 Gw)","De vrijheid van vergadering en betoging (art. 9 Gw)"],a:0,e:"Art. 12 Gw: binnentreden in een woning vereist onder meer voorafgaande legitimatie, mededeling van het doel en schriftelijke verslaglegging."},
{w:8,t:"EVRM",q:"Welke drie voorwaarden gelden voor een beperking van art. 8 tot en met 11 EVRM?",o:["Bij wet voorzien, legitiem doel, noodzakelijk in een democratische samenleving","Geschiktheid, noodzakelijkheid, evenwichtigheid","Competentie, doel, procedure"],a:0,e:"Het EVRM-schema staat in het tweede lid van die artikelen. Optie 2 is de evenredigheidstoets uit Harderwijk; optie 3 zijn de Grondwet-criteria."},
{w:8,t:"EVRM",q:"Een beperking berust op een geheime instructie van de politie die burgers niet kunnen inzien. Aan welke EVRM-eis voldoet dit waarschijnlijk niet?",o:["Bij wet voorzien: de rechtsbasis moet toegankelijk en voorzienbaar zijn","Legitiem doel","Noodzakelijk in een democratische samenleving"],a:0,e:"‘Bij wet voorzien’ is ruim (ook lagere regels), maar de basis moet toegankelijk (accessible) en voorzienbaar (foreseeable) zijn en bescherming bieden tegen willekeur."},
{w:8,t:"EVRM",q:"Een burgemeester verbiedt een hele demonstratie, terwijl een paar voorschriften (een andere route, een maximaal aantal deelnemers) het risico op wanordelijkheden ook hadden beperkt. Welk aspect van ‘noodzakelijk in een democratische samenleving’ is vooral in het geding?",o:["Subsidiariteit","Geschiktheid","Legitiem doel"],a:0,e:"Subsidiariteit: kan het doel met een minder beperkende maatregel worden bereikt? Een volledig verbod is het zwaarste middel."},
{w:8,t:"EVRM",q:"Wat is de margin of appreciation?",o:["De beoordelingsruimte die het EHRM aan nationale autoriteiten laat","De termijn waarbinnen een klacht bij het EHRM moet worden ingediend","De ruimte van de wetgever om af te wijken van de Grondwet"],a:0,e:"De appreciatiemarge verschilt per recht, activiteit, doel en ernst van de beperking. Het EHRM blijft wel controleren."},
{w:8,t:"Grondwet en EVRM",st:true,q:"Lees de volgende stellingen.",s1:"Een maatregel die aan de Grondwet voldoet, kan toch het EVRM schenden.",s2:"Art. 120 Gw verbiedt de rechter om formele wetten te toetsen aan rechtstreeks werkende bepalingen van het EVRM.",a:"JO",e:"Je moet beide systemen afzonderlijk onderzoeken. Art. 120 Gw verbiedt toetsing aan de Grondwet; toetsing aan eenieder verbindende verdragsbepalingen zoals het EVRM mag wel."},
{w:8,t:"Grondrechten",q:"Wanneer is het EU-Grondrechtenhandvest van toepassing op een lidstaat?",o:["Wanneer de lidstaat handelt binnen het toepassingsgebied van het EU-recht","Altijd, bij iedere nationale situatie","Alleen als het EVRM niet van toepassing is"],a:0,e:"Het Handvest geldt voor lidstaten wanneer zij binnen het toepassingsgebied van het EU-recht handelen, niet automatisch bij iedere nationale situatie."},
{w:8,t:"Demonstraties",q:"Demonstranten bij een abortuskliniek worden naar een plek verderop verplaatst. Waar let de rechter onder het EVRM vooral op?",o:["Of de demonstranten hun boodschap nog effectief kunnen overbrengen (zicht- en geluidsafstand)","Of de burgemeester het eens is met de boodschap","Of de demonstranten de kliniek kunnen betreden"],a:0,e:"Bij de evenredigheid speelt ‘sight and sound’: kunnen de demonstranten hun publiek nog zien en horen? Een bufferzone is niet altijd verboden en een verplaatsing niet altijd toegestaan; de omstandigheden beslissen."},

// ---------- EXTRA (eindtoets) ----------
{w:9,t:"Ministerraad",q:"Welke stelling over de ministeriële verantwoordelijkheid is juist?",o:["Ministers zijn verantwoordelijk voor besluiten die in de ministerraad zijn genomen, ook als ze daar zelf niet mee instemden","Ministers zijn nooit verantwoordelijk voor het handelen van de Koning","Ministers zijn verantwoordelijk voor het doen en laten van de leden van hun fractie"],a:0,e:"Eenheid van regeringsbeleid (art. 45 lid 3 Gw): de ministerraad besluit over het algemeen beleid en ministers dragen dat uit. Ministers zijn juist wél verantwoordelijk voor de Koning (art. 42 lid 2 Gw). Deze vraag stond zo op de eindtoets van 2025."},
{w:9,t:"Ministerraad",q:"Een minister doet tijdens een Kamerdebat toezeggingen namens het kabinet, terwijl hij nog niet weet of zijn collega's daarmee instemmen. Waarom is dat ongebruikelijk?",o:["Een minister spreekt namens het gehele kabinet; het is vreemd eerst toe te zeggen en pas daarna steun te zoeken","Een minister mag in een debat nooit iets toezeggen","De oppositie hoort bewindspersonen te steunen"],a:0,e:"Door de eenheid van kabinetsbeleid spreekt een bewindspersoon namens het hele kabinet. Toezeggingen moeten dus door het kabinet gedragen worden."},
{w:9,t:"Bevoegdheden",q:"Een minister besluit een aantal voordrachten voor een koninklijke onderscheiding niet te ondertekenen. Om wat voor bevoegdheid gaat het?",o:["Een bestuursbevoegdheid","Een regelgevende bevoegdheid","Een wetgevende bevoegdheid"],a:0,e:"Het gaat om beslissingen in concrete, individuele gevallen; geen algemene regels. Let op: op de eindtoets stond ook ‘beleidsbevoegdheid’ als afleider; dat is geen aparte categorie naast regelgevende en bestuursbevoegdheid."},
{w:9,t:"Grondwet",st:true,q:"Lees de volgende stellingen.",s1:"De Grondwet bepaalt dat de Staten-Generaal bestaan uit de Eerste Kamer en de Tweede Kamer.",s2:"De Grondwet gelast nieuwe verkiezingen na de ontbinding van een van de Kamers.",a:"JJ",e:"Art. 51 Gw: de Staten-Generaal bestaan uit de Tweede en de Eerste Kamer. Art. 64 Gw: het besluit tot ontbinding verplicht tot nieuwe verkiezingen voor de ontbonden Kamer."},
{w:9,t:"Regelgeving",q:"In je wettenbundel staat een regeling met als aanhef: ‘Op de voordracht van Onze Minister van Justitie en Veiligheid; De Afdeling advisering van de Raad van State gehoord; Hebben goedgevonden en verstaan.’ De Staten-Generaal worden niet genoemd. Wat voor regeling is dit?",o:["Een algemene maatregel van bestuur","Een wet in formele zin","Een ministeriële regeling"],a:0,e:"Een AMvB wordt op voordracht van een minister, na advies van de Raad van State, door de regering vastgesteld. Bij een formele wet staat ‘met gemeen overleg der Staten-Generaal’. Een ministeriële regeling begint met ‘De Minister van ... Besluit:’. Staat de aanhef niet in je bundel, kijk dan naar het opschrift (‘Wet van ...’, ‘Besluit van ...’, ‘Regeling van de Minister ...’) en de vindplaats (Stb. of Stcrt.)."},
{w:9,t:"Trias politica",q:"Welke stelling over de trias politica in het Nederlandse constitutionele bestel is juist?",o:["Als alle overheidsmacht in één orgaan is verenigd, is dat in strijd met de scheiding der machten","De trias stelt dat de ambten van wetgevende, uitvoerende en rechterlijke macht in Nederland strikt gescheiden zijn","De trias stelt dat samenwerking tussen rechterlijke en uitvoerende macht mag, zolang de wetgevende macht onafhankelijk blijft"],a:0,e:"De kern van machtenscheiding is het voorkomen van machtsconcentratie. Nederland kent geen strikte scheiding: machten werken samen en controleren elkaar. Deze vraag stond zo op de eindtoets van 2025."},
{w:9,t:"Evenredigheid",q:"De burgemeester sluit een woning na een drugsvondst in het appartement van de volwassen zoon. De ouders, eigenaren van de woning, wisten van niets en gaan in beroep. Wat is juist?",o:["Bij de evenredigheidstoets kan meewegen dat de ouders als eigenaar verantwoordelijk zijn voor wat er in de woning gebeurt","De arrestatie van de zoon is niet relevant voor de afweging","De evenredigheidstoets kent drie stappen: geschiktheid, noodzakelijkheid en redelijkheid"],a:0,e:"Bij de evenwichtigheid weegt de verwijtbaarheid en verantwoordelijkheid van de eigenaar mee. De aanleiding is wel relevant. En de derde stap heet evenwichtigheid, niet redelijkheid. Vrijwel deze casus stond op de eindtoets van 2025."}
];

// ISBR open casusvragen in de opbouw van de eindtoets: deelvragen met punten en een woordindicatie (wi).
window.OPEN = [
{
id:"algoritme", title:"Het uitkeringsalgoritme", w:[2],
intro:"Uit berichtgeving blijkt dat een uitvoeringsdienst van het ministerie van Sociale Zaken jarenlang een algoritme gebruikte dat bijstandsaanvragen van mensen met een dubbele nationaliteit vaker als ‘risico’ markeerde. Minister De Groot verklaart in de Tweede Kamer dat zij ‘pas sinds kort’ van het probleem weet.\n\nKamerlid Yasmina Bakker (oppositie) vraagt de minister om alle interne memo's over het algoritme naar de Kamer te sturen. De minister stuurt een deel, maar veel passages zijn zwartgelakt. Een meerderheid van de Tweede Kamer besluit daarop een parlementaire enquête in te stellen. Tijdens de openbare verhoren verklaart een ambtenaar onder ede dat de minister al twee jaar eerder per memo was gewaarschuwd.\n\nIn het debat dat volgt dient Bakker een motie van wantrouwen in tegen de minister. Die wordt aangenomen met 78 tegen 72 stemmen. De minister zegt na afloop tegen de pers: ‘Een motie is niet bindend. Ik blijf gewoon zitten.’",
parts:[
{l:"a",p:7,wi:125,q:"Welke twee bevoegdheden heeft de Tweede Kamer gebruikt om informatie te krijgen, en op welke grondwetsbepalingen berusten die? Leg daarna uit wat het belang van deze bevoegdheden is in het licht van de trias politica.",
c:[{p:2,t:"Inlichtingenrecht, art. 68 Gw: Kamerleden kunnen inlichtingen vragen; de minister moet die geven, tenzij dat in strijd is met het belang van de staat."},{p:2,t:"Enquêterecht, art. 70 Gw: de Kamer doet zelf onderzoek; een enquêtecommissie kan getuigen onder ede horen en documenten vorderen."},{p:2,t:"Trias: het parlement controleert de uitvoerende macht. Nederland kent geen strikte scheiding maar checks and balances; zonder informatie kan de Kamer de minister niet ter verantwoording roepen."},{p:1,t:"Toepassing: omdat de minister passages zwartlakte, schoot het inlichtingenrecht tekort en greep de Kamer naar het zwaardere middel van de enquête."}],
m:"De Kamer gebruikte ten eerste het inlichtingenrecht (art. 68 Gw): Bakker vroeg de memo's op, en een minister moet gevraagde inlichtingen geven tenzij dat in strijd is met het belang van de staat. Ten tweede gebruikte de Kamer het enquêterecht (art. 70 Gw): een enquêtecommissie doet zelf onderzoek en kan getuigen onder ede horen en documenten vorderen. Omdat de minister veel passages zwartlakte, koos de Kamer voor dit zwaardere middel.\nIn het licht van de trias politica zijn dit controlebevoegdheden van de volksvertegenwoordiging tegenover de uitvoerende macht. Nederland kent geen strikte machtenscheiding, maar een stelsel van checks and balances: de machten controleren elkaar. Zonder juiste informatie kan het parlement de minister niet ter verantwoording roepen (art. 42 lid 2 Gw) en schiet de controle tekort."},
{l:"b",p:8,wi:150,q:"Heeft de minister gelijk dat zij kan aanblijven? Leg in je antwoord de onderliggende staatsrechtelijke regel uit en het verschil met de ministeriële verantwoordelijkheid.",
c:[{p:1,t:"Formeel klopt het dat een motie juridisch niet bindend is."},{p:2,t:"Maar de vertrouwensregel (ongeschreven staatsrecht, gewoonterecht) bepaalt dat een bewindspersoon ontslag moet aanbieden zodra vaststaat dat het vertrouwen van de Kamer ontbreekt."},{p:2,t:"Toepassing: een meerderheid van de TK (78 tegen 72) heeft het vertrouwen opgezegd, dus de minister moet ontslag aanbieden. Zij heeft geen gelijk."},{p:2,t:"Ministeriële verantwoordelijkheid (art. 42 lid 2 Gw) is de plicht om verantwoording af te leggen over handelen en nalaten (ook van het ministerie); dat leidt niet automatisch tot ontslag."},{p:1,t:"De vertrouwensregel gaat over de gevolgen van verlies van vertrouwen; hij ontwikkelde zich na 1848 (conflicten 1866 tot 1868)."}],
m:"De minister heeft gedeeltelijk gelijk: een motie is juridisch niet bindend. Toch moet zij ontslag aanbieden. Dat volgt niet uit de motie zelf, maar uit de vertrouwensregel. Dat is ongeschreven staatsrecht (gewoonterecht), dat zich na 1848 heeft ontwikkeld: een minister, staatssecretaris of kabinet moet ontslag aanbieden zodra duidelijk is dat het vertrouwen van het parlement, vooral de Tweede Kamer, ontbreekt. Met de aangenomen motie van wantrouwen (78 tegen 72) staat dat vast. De minister moet dus ontslag aanbieden.\nDit moet je onderscheiden van de ministeriële verantwoordelijkheid (art. 42 lid 2 Gw). Die houdt in dat de minister verantwoording moet afleggen aan het parlement over haar handelen en nalaten, ook voor wat op haar ministerie gebeurt. Die verantwoording leidt niet automatisch tot ontslag. De vertrouwensregel bepaalt wat er gebeurt als het parlement na die verantwoording het vertrouwen opzegt."}
]},
{
id:"sportfonds", title:"Stichting Sportfonds", w:[5,6],
intro:"De Stichting Sportfonds Utrecht is een privaatrechtelijke stichting. Zij verstrekt bijdragen van maximaal €250 per jaar aan kinderen uit gezinnen met een laag inkomen, voor de contributie van een sportclub. De gemeente Utrecht betaalt 90% van het geld voor deze bijdragen; de rest komt uit giften. In een gemeentelijke subsidieverordening staat precies welke gezinnen in aanmerking komen: woonachtig in Utrecht en een inkomen tot 120% van het sociaal minimum. De stichting behandelt de aanvragen. Er is geen wettelijk voorschrift dat de stichting openbaar gezag toekent.\n\nDe stichting wijst per e-mail de aanvraag af die de moeder van Noor (9) had ingediend, omdat haar inkomen net boven de grens zou liggen. De moeder denkt dat de stichting een rekenfout heeft gemaakt en wil ertegen opkomen.",
parts:[
{l:"a",p:10,wi:175,q:"Is het bestuur van de stichting een bestuursorgaan in de zin van de Awb? Motiveer je antwoord.",
c:[{p:2,t:"Geen a-orgaan: een stichting is een privaatrechtelijke rechtspersoon (art. 2:3 BW), geen rechtspersoon krachtens publiekrecht ingesteld (art. 1:1 lid 1 sub a Awb)."},{p:1,t:"B-orgaan (art. 1:1 lid 1 sub b): er is geen wettelijk voorschrift dat openbaar gezag toekent."},{p:2,t:"Buitenwettelijk openbaar gezag kan alleen bij geldelijke uitkeringen of op geld waardeerbare voorzieningen; daar gaat het hier om (bijdragen aan contributie)."},{p:2,t:"Inhoudelijk vereiste: een a-orgaan (de gemeenteraad, via de subsidieverordening) bepaalt in beslissende mate de criteria. Let op: de gemeente is de rechtspersoon, de gemeenteraad het orgaan."},{p:2,t:"Financieel vereiste: de verstrekkingen worden in overwegende mate (twee derde of meer) door a-organen van de gemeente gefinancierd; 90% voldoet."},{p:1,t:"Conclusie: het bestuur is een b-bestuursorgaan, voor zover het deze bijdragen verstrekt."}],
m:"Eerst onderzoek je of het bestuur een a-orgaan is. Dat is niet zo: een stichting is een privaatrechtelijke rechtspersoon (art. 2:3 BW) en geen rechtspersoon die krachtens publiekrecht is ingesteld (art. 1:1 lid 1 sub a Awb).\nDan de vraag of het een b-orgaan is: een ander persoon of college met enig openbaar gezag bekleed (sub b). Er is geen wettelijk voorschrift dat de stichting openbaar gezag geeft. Bij geldelijke uitkeringen of op geld waardeerbare voorzieningen kan buitenwettelijk openbaar gezag bestaan. Daar gaat het hier om: bijdragen voor sportcontributie. Dan moet aan twee cumulatieve vereisten zijn voldaan. Het inhoudelijke vereiste: een a-orgaan bepaalt in beslissende mate de criteria. Dat is zo, want de gemeenteraad (een a-orgaan; de gemeente zelf is de rechtspersoon) legt in de subsidieverordening vast wie in aanmerking komt. Het financiële vereiste: de verstrekkingen worden in overwegende mate, in beginsel voor twee derde of meer, door a-organen gefinancierd. De bijdragen worden voor 90% door (organen van) de gemeente betaald, dus ook dat is vervuld.\nConclusie: het bestuur van de stichting is een b-bestuursorgaan, voor zover het deze bijdragen verstrekt."},
{l:"b",p:6,wi:125,q:"Is de afwijzing een besluit, en wat moet de moeder doen om ertegen op te komen?",
c:[{p:2,t:"Besluit (art. 1:3 lid 1 Awb): schriftelijk (een e-mail kan), van een bestuursorgaan (b-orgaan), publiekrechtelijke rechtshandeling (openbaar gezag, gericht op rechtsgevolg: geen recht op bijdrage)."},{p:1,t:"Afwijzing van een aanvraag is een beschikking (art. 1:3 lid 2 Awb)."},{p:1,t:"De moeder is als aanvrager belanghebbende (art. 1:2 Awb)."},{p:2,t:"Eerst bezwaar maken bij het bestuur van de stichting (art. 7:1 Awb), binnen zes weken na de bekendmaking (art. 6:7 en 6:8 Awb)."}],
m:"De afwijzing is een besluit in de zin van art. 1:3 lid 1 Awb. Het is een schriftelijke beslissing (ook een e-mail kan schriftelijk zijn) van een bestuursorgaan, namelijk het bestuur als b-orgaan. Het is een publiekrechtelijke rechtshandeling: de stichting oefent openbaar gezag uit en stelt eenzijdig vast dat er geen recht op een bijdrage is. Omdat het om de afwijzing van een aanvraag gaat, is het een beschikking (art. 1:3 lid 2 Awb).\nDe moeder is als aanvrager belanghebbende (art. 1:2 Awb). Zij moet eerst bezwaar maken bij het bestuur van de stichting (art. 7:1 Awb), binnen zes weken na de bekendmaking van het besluit (art. 6:7 en 6:8 Awb). In bezwaar volgt een volledige heroverweging; daarna staat beroep bij de rechtbank open."}
]},
{
id:"huurprotest", title:"Huurprotest op het Vredenburgplein", w:[8],
intro:"Een huurdersvereniging meldt bij de burgemeester van Utrecht een demonstratie aan op zaterdagochtend op het Vredenburgplein, tegen de hoge huren. Er worden ongeveer 400 deelnemers verwacht. Op dezelfde ochtend is op dat plein de warenmarkt. Twee weken eerder liep een demonstratie van een andere groep in de binnenstad uit de hand.\n\nDe burgemeester verbiedt de demonstratie volledig. In zijn besluit schrijft hij: ‘Op het plein is het die ochtend druk door de markt, er is risico op wanordelijkheden, en bovendien is de boodschap van de demonstratie eenzijdig en schadelijk voor verhuurders.’ Een andere tijd of plek biedt hij niet aan. De huurdersvereniging vraagt jou, als expert in het staats- en bestuursrecht, om advies.",
parts:[
{l:"a",p:6,wi:100,q:"Welk grondrecht is hier aan de orde en in welke bronnen is het vastgelegd? Is het een klassiek of een sociaal grondrecht? Motiveer je antwoord.",
c:[{p:2,t:"De vrijheid van vergadering en betoging: art. 9 Gw en art. 11 EVRM."},{p:2,t:"Klassiek grondrecht: beschermt tegen overheidsinmenging, vraagt vooral onthouding van de overheid en sluit aan bij negatieve vrijheid; vaak rechtstreeks inroepbaar."},{p:2,t:"Toepassing: het verbod is een ingreep van de overheid in die vrijheid. Nuance: ook klassieke rechten kunnen een positieve verplichting meebrengen, zoals een vreedzame demonstratie beschermen."}],
m:"Aan de orde is de vrijheid van vergadering en betoging, vastgelegd in art. 9 Gw en art. 11 EVRM. Het is een klassiek grondrecht: het beschermt burgers tegen inmenging van de overheid en vraagt vooral dat de overheid zich onthoudt. Het sluit aan bij negatieve vrijheid en is rechtstreeks bij de rechter in te roepen. Hier grijpt de overheid in door de demonstratie te verbieden. Wel kan ook dit klassieke recht een positieve verplichting meebrengen, bijvoorbeeld om een vreedzame demonstratie te beschermen tegen verstoring."},
{l:"b",p:7,wi:200,q:"Valt deze casus binnen de reikwijdte van de vrijheid van vergadering en betoging? Bespreek de personele en de materiële reikwijdte en of er sprake is van een beperking. Betrek de relevante artikelen uit de Grondwet en het EVRM.",
c:[{p:2,t:"Personele reikwijdte: de deelnemers zijn grondrechtendragers; ook de huurdersvereniging als rechtspersoon kan zich op dit recht beroepen."},{p:2,t:"Materiële reikwijdte art. 9 Gw: een betoging is een gezamenlijke meningsuiting in de openbare ruimte; protest tegen hoge huren valt daaronder."},{p:2,t:"Art. 11 EVRM beschermt vreedzame bijeenkomsten; niets wijst erop dat deze groep geweld wil. Rellen bij een andere groep maken deze demonstratie niet onvreedzaam."},{p:1,t:"Beperking: een volledig verbod is een inmenging in (beperking van) het grondrecht."}],
m:"Personele reikwijdte: de deelnemers kunnen zich als mensen op de vrijheid van betoging beroepen. Ook de huurdersvereniging, als rechtspersoon, kan zich op dit recht beroepen; het is geen recht dat alleen bij natuurlijke personen past.\nMateriële reikwijdte: art. 9 Gw beschermt het recht tot vergadering en betoging. Een betoging is een gezamenlijke uiting van een mening in de openbare ruimte; een protest tegen hoge huren op een plein valt daar duidelijk onder. Art. 11 EVRM beschermt de vrijheid van vreedzame vergadering. Er zijn geen aanwijzingen dat deze groep geweld wil; dat een andere groep twee weken eerder rellen veroorzaakte, maakt deze demonstratie niet onvreedzaam.\nDe casus valt dus binnen de reikwijdte. Het volledige verbod is een beperking van (inmenging in) het grondrecht. Of die beperking is toegestaan, moet daarna worden getoetst."},
{l:"c",p:12,wi:300,q:"Toets of het verbod van de burgemeester gerechtvaardigd kan worden. Bespreek eerst kort de eisen van de Grondwet en toets daarna aan de hand van de drie stappen van de beperkingsclausule van het EVRM.",
c:[{p:2,t:"Grondwet, competentie: art. 9 lid 2 Gw (‘de wet kan ... regels stellen’) staat delegatie toe; de Wet openbare manifestaties geeft de burgemeester een bevoegdheid."},{p:2,t:"Grondwet, doelen: verkeer en het voorkomen van wanordelijkheden zijn toegestane doelen; de ‘eenzijdige boodschap’ is geen toegestaan doel. Een beperking mag geen betrekking hebben op de inhoud (art. 5 lid 3 Wom)."},{p:2,t:"EVRM stap 1, bij wet voorzien: grondslag in de Wom, toegankelijk en voorzienbaar."},{p:2,t:"EVRM stap 2, legitiem doel (art. 11 lid 2): voorkoming van wanordelijkheden en bescherming van de rechten en vrijheden van anderen (marktkooplui, bezoekers)."},{p:2,t:"EVRM stap 3, noodzakelijk in een democratische samenleving: pressing social need twijfelachtig (risico gebaseerd op een andere groep); subsidiariteit: andere tijd of plek of voorschriften waren mogelijk; een volledig verbod is het zwaarste middel."},{p:2,t:"Conclusie, gemotiveerd: het verbod is waarschijnlijk niet gerechtvaardigd en schendt art. 9 Gw en art. 11 EVRM, mede omdat de inhoud van de boodschap meewoog."}],
m:"Grondwet. Art. 9 lid 2 Gw bepaalt dat de wet regels kan stellen ter bescherming van de gezondheid, in het belang van het verkeer en ter bestrijding of voorkoming van wanordelijkheden. Door het woord ‘regels’ is delegatie toegestaan; de Wet openbare manifestaties geeft de burgemeester de bevoegdheid om voorschriften, beperkingen of een verbod op te leggen. De drukte van de markt (verkeer) en het risico op wanordelijkheden zijn toegestane doelen. De ‘eenzijdige boodschap’ is dat niet: een beperking mag geen betrekking hebben op de inhoud van de te openbaren gedachten (art. 5 lid 3 Wom).\nEVRM, stap 1: bij wet voorzien. Het verbod berust op de Wom, een toegankelijke en voorzienbare wettelijke regeling. Daaraan is voldaan.\nStap 2: legitiem doel. Art. 11 lid 2 EVRM noemt onder meer het voorkomen van wanordelijkheden en de bescherming van de rechten en vrijheden van anderen, zoals marktkooplui en bezoekers. Voor zover de burgemeester die doelen nastreeft, is dit vervuld; de afkeuring van de boodschap is geen legitiem doel.\nStap 3: noodzakelijk in een democratische samenleving. Er moet een dringende maatschappelijke behoefte zijn. Het risico op wanordelijkheden is gebaseerd op een andere groep, dus twijfelachtig. Bovendien faalt de subsidiariteit: de burgemeester had een andere tijd of plek kunnen aanwijzen of voorschriften kunnen geven. Een volledig verbod is het zwaarste middel en staat niet in verhouding tot het doel.\nConclusie: het verbod is niet gerechtvaardigd. Het schendt art. 11 EVRM en, doordat de inhoud van de boodschap meewoog, ook de grondwettelijke eisen."}
]},
{
id:"dakterras", title:"Het beloofde dakterras", w:[5],
intro:"Mehmet wil op het platte dak van zijn bovenwoning in de Utrechtse wijk Lombok een dakterras bouwen. Hij gaat met zijn bouwtekeningen naar het gemeentekantoor. Een ambtenaar van de afdeling vergunningen bekijkt de tekeningen en mailt hem een week later: ‘Ik heb uw plan beoordeeld. Hiervoor is geen vergunning nodig; u kunt beginnen.’ De mail bevat geen voorbehoud. Mehmet laat het terras bouwen voor €18.000.\n\nEen half jaar later klaagt de buurvrouw van de benedenwoning dat het terras direct uitkijkt op haar slaapkamer. Het college stelt vast dat wél een vergunning nodig was en dat die niet kan worden verleend. Het college legt Mehmet een last onder dwangsom op: het hele terras moet binnen acht weken worden afgebroken.",
parts:[
{l:"a",p:8,wi:200,q:"Kan Mehmet zich met succes beroepen op het vertrouwensbeginsel? Gebruik de stappen uit de uitspraak Amsterdams dakterras.",
c:[{p:1,t:"Het vertrouwensbeginsel is een ongeschreven beginsel van behoorlijk bestuur: gerechtvaardigde verwachtingen moeten zwaar wegen en zoveel mogelijk worden gehonoreerd."},{p:2,t:"Stap 1, toezegging: concreet, na beoordeling van zijn eigen tekeningen, schriftelijk en zonder voorbehoud. Er is dus een toezegging."},{p:2,t:"Stap 2, toerekening: de ambtenaar was niet zelf bevoegd, maar Mehmet mocht aannemen dat de afdeling vergunningen het standpunt van het college weergaf."},{p:2,t:"Stap 3, honoreren: belangenafweging tussen het belang van Mehmet (€18.000, goede trouw) en het belang van de buurvrouw (privacy) en het algemeen belang; een zwaarder wegend belang kan honorering in de weg staan."},{p:1,t:"Conclusie, gemotiveerd; als het vertrouwen niet wordt gehonoreerd, kan vergoeding van vertrouwensschade aan de orde zijn."}],
m:"Het vertrouwensbeginsel is een ongeschreven beginsel van behoorlijk bestuur. Gerechtvaardigde verwachtingen die aan het bestuur kunnen worden toegerekend, moeten zwaar meewegen. In Amsterdams dakterras heeft de ABRvS drie stappen gegeven.\nStap 1: is er een toezegging? Mehmet kon redelijkerwijs begrijpen dat het bestuur een bewust standpunt over zijn concrete situatie innam: de ambtenaar beoordeelde zijn eigen tekeningen en schreef zonder voorbehoud dat geen vergunning nodig was. Dat is geen algemene informatie, maar een concrete toezegging.\nStap 2: kan de toezegging aan het bevoegde orgaan worden toegerekend? Het college is bevoegd, niet de ambtenaar. Maar de ambtenaar werkte bij de afdeling vergunningen en had het plan inhoudelijk beoordeeld; Mehmet mocht aannemen dat hij het standpunt van het college weergaf.\nStap 3: moet het vertrouwen worden gehonoreerd? Het belang van Mehmet weegt zwaar: hij handelde te goeder trouw en gaf €18.000 uit. Daartegenover staan het belang van de buurvrouw bij haar privacy en het algemeen belang bij naleving van de regels. Als die belangen zwaarder wegen, hoeft het vertrouwen niet te worden gehonoreerd. Dan kan wel een plicht ontstaan om Mehmets vertrouwensschade te vergoeden."},
{l:"b",p:7,wi:150,q:"Stel dat het college mag handhaven. Is de last om het hele terras binnen acht weken af te breken evenredig? Gebruik art. 3:4 lid 2 Awb en de uitspraak Harderwijk.",
c:[{p:1,t:"Art. 3:4 lid 2 Awb: de nadelige gevolgen mogen niet onevenredig zijn in verhouding tot de doelen van het besluit."},{p:1,t:"Geschiktheid: afbreken beëindigt de overtreding en de inkijk."},{p:2,t:"Noodzakelijkheid: is er een minder ingrijpende manier om de overtreding te beëindigen, bijv. een aanpassing waardoor het terras wél vergunbaar wordt (als dat kan) of een langere termijn?"},{p:2,t:"Evenwichtigheid: hoge kosten, Mehmet handelde te goeder trouw op basis van de toezegging, tegenover het belang van de buurvrouw."},{p:1,t:"Intensiteit en conclusie: bij ingrijpende gevolgen toetst de rechter intensiever; de last kan onevenredig zijn, vooral door de toezegging en de kosten, al weegt het belang van handhaving zwaar."}],
m:"Volgens art. 3:4 lid 2 Awb mogen de nadelige gevolgen van een besluit niet onevenredig zijn in verhouding tot de doelen ervan. Volgens Harderwijk kunnen drie aspecten een rol spelen.\nGeschiktheid: het afbreken van het terras beëindigt de overtreding en de inkijk, dus de maatregel is geschikt.\nNoodzakelijkheid: is er een minder ingrijpende manier om de overtreding te beëindigen? Als het terras door een aanpassing (bijv. een kleiner terras of een ondoorzichtig scherm) wél vergunbaar wordt, gaat dat minder ver dan volledige afbraak. Ook een langere termijn is een minder belastende optie.\nEvenwichtigheid: de gevolgen voor Mehmet zijn zwaar. Hij verliest €18.000 en handelde te goeder trouw op basis van een toezegging van de gemeente. Dat moet worden afgewogen tegen het belang van de buurvrouw.\nOmdat de gevolgen ingrijpend zijn, toetst de rechter intensiever. De last om het hele terras binnen acht weken af te breken kan daarom onevenredig zijn, vooral door de toezegging en de hoge kosten. Daar staat tegenover dat het belang van handhaving en de privacy van de buurvrouw zwaar wegen."}
]},
{
id:"koffiekar", title:"De koffiekar van Fleur", w:[6,7],
intro:"Fleur heeft een standplaatsvergunning voor haar koffiekar bij Utrecht Centraal. Bij besluit van 3 februari, dezelfde dag per post verzonden, trekt het college van burgemeester en wethouders van Utrecht de vergunning in, omdat zij ‘herhaaldelijk buiten de toegestane uren’ zou hebben gestaan. Fleur is het daar niet mee eens: volgens haar gaat het om een verwisseling met een andere kar.\n\nOnder het besluit staat dat zij binnen zes weken bezwaar kan maken bij het college. De intrekking gaat al op 1 maart in; vanaf dan mag zij er niet meer staan en mist zij haar inkomsten.\n\nFleur post haar bezwaarschrift op de laatste dag van de termijn, maar zij vergeet haar handtekening en schrijft er alleen op: ‘Ik ben het niet eens met het besluit.’ Het college ontvangt de brief vijf dagen later.",
parts:[
{l:"a",p:6,wi:125,q:"Is de intrekking een besluit waartegen Fleur kan opkomen, en is zij belanghebbende?",
c:[{p:2,t:"Besluit (art. 1:3 lid 1 Awb): schriftelijke beslissing van het college (a-orgaan, orgaan van de gemeente), op een publiekrechtelijke bevoegdheid, gericht op rechtsgevolg (de vergunning vervalt)."},{p:1,t:"Het is een beschikking (art. 1:3 lid 2 Awb): niet van algemene strekking, gericht tot Fleur."},{p:1,t:"Fleur is belanghebbende (art. 1:2 Awb): haar belang is rechtstreeks bij het besluit betrokken."},{p:2,t:"Het besluit is appellabel; eerst moet zij bezwaar maken bij het college (art. 7:1 Awb)."}],
m:"De intrekking is een besluit in de zin van art. 1:3 lid 1 Awb: een schriftelijke beslissing van een bestuursorgaan, het college van B&W als orgaan van de gemeente (a-orgaan), inhoudende een publiekrechtelijke rechtshandeling. Het college gebruikt een publiekrechtelijke bevoegdheid en beoogt een rechtsgevolg: Fleurs vergunning vervalt. Het besluit is niet van algemene strekking en gericht tot Fleur, dus een beschikking (art. 1:3 lid 2 Awb).\nFleur is belanghebbende (art. 1:2 Awb), omdat haar belang rechtstreeks bij het besluit betrokken is: zij is de vergunninghouder. Tegen het besluit staat beroep open, maar eerst moet zij bezwaar maken bij het college (art. 7:1 Awb)."},
{l:"b",p:7,wi:175,q:"Is het bezwaarschrift van Fleur tijdig, en wat moet het college doen met de gebreken in haar bezwaarschrift?",
c:[{p:2,t:"Termijn zes weken (art. 6:7 Awb), die begint op de dag na de bekendmaking (art. 6:8 Awb): vanaf 4 februari."},{p:2,t:"Per post: tijdig als het vóór het einde van de termijn ter post is bezorgd en uiterlijk een week na afloop is ontvangen (art. 6:9 Awb). Vijf dagen later ontvangen, dus tijdig."},{p:1,t:"Een bezwaarschrift moet onder meer ondertekend zijn en gronden bevatten (art. 6:5 Awb); die ontbreken."},{p:2,t:"Het college mag het bezwaar niet meteen niet-ontvankelijk verklaren, maar moet Fleur gelegenheid geven het verzuim te herstellen (art. 6:6 Awb). Zij kan de gronden aanvullen (pro-formabezwaar)."}],
m:"De bezwaartermijn is zes weken (art. 6:7 Awb) en begint op de dag na de bekendmaking (art. 6:8 Awb). Het besluit is op 3 februari bekendgemaakt door toezending, dus de termijn loopt vanaf 4 februari. Fleur postte haar bezwaar op de laatste dag. Bij verzending per post is een bezwaarschrift tijdig als het vóór het einde van de termijn ter post is bezorgd en niet later dan een week na afloop is ontvangen (art. 6:9 Awb). Het college ontving het na vijf dagen, dus het bezwaar is tijdig.\nHet bezwaarschrift voldoet niet aan art. 6:5 Awb: de handtekening en de gronden ontbreken. Het college mag het bezwaar daarom niet direct niet-ontvankelijk verklaren. Volgens art. 6:6 Awb moet Fleur eerst de gelegenheid krijgen om het verzuim binnen een termijn te herstellen. Haar brief werkt dan als pro-formabezwaar: zij kan haar handtekening zetten en de gronden later aanvullen, bijvoorbeeld dat het om een verwisseling ging."},
{l:"c",p:7,wi:175,q:"Het bezwaar schorst het besluit niet. Wat kan Fleur doen om te voorkomen dat zij vanaf 1 maart niet meer mag staan? En welke stappen staan voor haar open na de beslissing op bezwaar?",
c:[{p:1,t:"Bezwaar en beroep hebben geen schorsende werking (art. 6:16 Awb)."},{p:1,t:"Zij kan bij de voorzieningenrechter van de rechtbank een voorlopige voorziening vragen (art. 8:81 Awb)."},{p:2,t:"Vereisten: spoedeisend belang (verlies van inkomsten vanaf 1 maart) en connexiteit (er loopt een bezwaarprocedure)."},{p:1,t:"De voorzieningenrechter weegt de belangen af, geeft een voorlopig rechtmatigheidsoordeel en kan het besluit bijvoorbeeld schorsen."},{p:2,t:"Na de beslissing op bezwaar: beroep bij de rechtbank (relatief bevoegd: Midden-Nederland, art. 8:7 Awb, want het college is een decentraal orgaan uit Utrecht), daarna hoger beroep bij de ABRvS."}],
m:"Bezwaar en beroep schorsen de werking van een besluit niet (art. 6:16 Awb). De intrekking gaat dus op 1 maart in, ook als het bezwaar nog loopt. Fleur kan bij de voorzieningenrechter van de rechtbank een voorlopige voorziening vragen (art. 8:81 Awb). Daarvoor moet zij een spoedeisend belang hebben, dat zij heeft omdat zij vanaf 1 maart haar inkomsten verliest, en moet er een samenhangende bezwaarprocedure lopen (connexiteit). De voorzieningenrechter weegt de belangen af, geeft een voorlopig oordeel over de rechtmatigheid en kan het besluit bijvoorbeeld schorsen tot er op bezwaar is beslist.\nNa de beslissing op bezwaar kan Fleur in beroep gaan bij de rechtbank. Omdat het college van Utrecht een decentraal bestuursorgaan is, is de rechtbank van het gebied waar het is gevestigd bevoegd: de rechtbank Midden-Nederland (art. 8:7 Awb). Tegen de uitspraak van de rechtbank staat hoger beroep open bij de Afdeling bestuursrechtspraak van de Raad van State."}
]},
{
id:"huisdieren", title:"De Wet registratie huisdieren", w:[3],
intro:"Het kabinet dient een wetsvoorstel in voor een Wet registratie huisdieren. Het voorstel bevat één inhoudelijk artikel: ‘Bij of krachtens algemene maatregel van bestuur worden regels gesteld over de registratie van huisdieren, waaronder verplichtingen voor eigenaren en bestuurlijke boetes bij overtreding.’\n\nWelke dieren moeten worden geregistreerd, wie dat moet doen en hoe hoog de boetes zijn, wordt allemaal geregeld in een AMvB. De technische details van het registratiesysteem komen in een ministeriële regeling. Een Kamerlid zegt in het debat: ‘Zo wordt het parlement buitenspel gezet. Wij beslissen straks over niets meer.’",
parts:[
{l:"a",p:7,wi:150,q:"Leg uit wat attributie, delegatie en subdelegatie zijn en laat zien hoe deze begrippen terugkomen in het wetsvoorstel. Hoe heet het verschijnsel dat de regels over één onderwerp over verschillende niveaus zijn verspreid?",
c:[{p:1,t:"Attributie: het creëren en toekennen van een nieuwe bevoegdheid."},{p:1,t:"Delegatie: het overdragen van een bestaande bevoegdheid aan een ander orgaan, dat haar onder eigen verantwoordelijkheid uitoefent."},{p:1,t:"Subdelegatie: een gedelegeerde bevoegdheid verder overdragen; de grondslag moet daar ruimte voor geven."},{p:2,t:"Toepassing: de formele wetgever draagt regelgevende bevoegdheid over aan de regering (AMvB); door ‘krachtens’ mag de AMvB weer doordelegeren aan de minister (ministeriële regeling): subdelegatie."},{p:2,t:"Gelede normstelling: formele wet → AMvB → ministeriële regeling, met een ononderbroken keten van bevoegdheden."}],
m:"Attributie is het creëren en toekennen van een nieuwe bevoegdheid, zoals art. 81 Gw de wetgevende bevoegdheid aan regering en Staten-Generaal toekent. Delegatie is het overdragen van een bestaande bevoegdheid aan een ander orgaan, dat haar daarna onder eigen verantwoordelijkheid uitoefent. Subdelegatie is het verder overdragen van een gedelegeerde bevoegdheid; de grondslag moet daar ruimte voor bieden.\nIn het wetsvoorstel draagt de formele wetgever zijn regelgevende bevoegdheid over de registratie van huisdieren over aan de regering, die regels stelt bij AMvB: delegatie. Door de woorden ‘bij of krachtens’ mag de AMvB de bevoegdheid voor de technische details weer doorgeven aan de minister: subdelegatie, uitgewerkt in een ministeriële regeling.\nDat de regels zo verspreid staan over formele wet, AMvB en ministeriële regeling heet gelede normstelling. Er moet dan een ononderbroken keten van attributie en (sub)delegatie zijn."},
{l:"b",p:8,wi:175,q:"Heeft het Kamerlid een punt? Betrek in je antwoord het primaat van de wetgever, het legaliteitsbeginsel en de mogelijkheden om het parlement bij gedelegeerde regelgeving te betrekken.",
c:[{p:2,t:"Primaat van de wetgever: de belangrijkste keuzes (wie, welke plichten, hoogte van boetes) horen in de formele wet; een AMvB is voor nadere regels, een ministeriële regeling voor technische details."},{p:2,t:"Legaliteitsbeginsel: ingrijpende verplichtingen en boetes vereisen een voldoende duidelijke en specifieke grondslag in de formele wet; functie democratische legitimatie."},{p:1,t:"Terugtred van de wetgever: normstelling verschuift naar het bestuur, met minder directe democratische controle en rechtszekerheid."},{p:2,t:"Mogelijkheden: hoofdlijnen alsnog in de wet opnemen; gecontroleerde of voorwaardelijke delegatie, of goedkeuring bij wet; de minister blijft politiek verantwoordelijk."},{p:1,t:"Gemotiveerde conclusie: het Kamerlid heeft een punt; het voorstel delegeert te veel wezenlijke keuzes."}],
m:"Het Kamerlid heeft een punt. Volgens het primaat van de wetgever moet de formele wetgever de belangrijkste inhoudelijke en politieke keuzes zelf maken. Een AMvB is bedoeld voor nadere regels die geen hoofdlijnen zijn, een ministeriële regeling voor technische details. Hier staan zelfs de hoofdkeuzes, welke dieren, welke verplichtingen en hoe hoog de boetes, niet in de wet.\nOok het legaliteitsbeginsel staat onder druk. Overheidsoptreden dat burgers verplichtingen oplegt of hen beboet, moet herleidbaar zijn tot een formele wet en de grondslag moet voldoende duidelijk en specifiek zijn. Bovendien heeft het legaliteitsbeginsel een democratische functie: burgers hebben via hun vertegenwoordigers invloed op de grondslag. Dit is een voorbeeld van de terugtred van de wetgever, waardoor normstelling verschuift naar het bestuur, met minder directe democratische controle en rechtszekerheid.\nHet parlement kan dit ondervangen door de hoofdlijnen alsnog in de wet op te nemen, bijvoorbeeld via een amendement van de Tweede Kamer, of door te kiezen voor gecontroleerde delegatie (ontwerp-AMvB voorleggen), voorwaardelijke delegatie of goedkeuring bij wet. Daarnaast blijft de minister politiek verantwoordelijk voor de gedelegeerde regels."}
]}
];

<script>
(function(){
"use strict";
const $ = (s, el) => (el||document).querySelector(s);
const $$ = (s, el) => Array.from((el||document).querySelectorAll(s));
const esc = s => String(s).replace(/[&<>"]/g, c => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));
const fmt = s => esc(s).replace(/\n/g, "<br>");
const hashStr = s => { let h = 7; for (const ch of s) h = (Math.imul(h, 31) + ch.codePointAt(0)) | 0; return (h >>> 0).toString(36); };
const shuffle = a => { a = a.slice(); for (let i = a.length - 1; i > 0; i--) { const j = Math.floor(Math.random() * (i + 1)); [a[i], a[j]] = [a[j], a[i]]; } return a; };
const DAY = 864e5;
const LETTERS = ["A","B","C","D","E","F"];
const PRAISE = ["Goed zo!","Helemaal goed.","Klopt!","Precies, Manouk.","Netjes!","Mooi, goed gezien.","Top, die zit erin.","Ja, dat is hem!","Goed gedaan!"];
const STREAK = {3:"Drie goed op rij!",5:"Vijf op rij, lekker bezig Manouk!",10:"Tien op rij! Jij bent er klaar voor.",15:"Vijftien op rij. Echt heel sterk!"};
const NOPE = ["Niet goed. Lees even waarom.","Helaas, deze niet. Kijk naar de uitleg.","Niet goed, maar nu weet je het wel."];
const pick = a => a[Math.floor(Math.random() * a.length)];
const heart = '<svg viewBox="0 0 24 24" width="15" height="15" fill="currentColor" aria-hidden="true"><path d="M12 21s-7.5-4.6-9.6-9.2C.9 8.4 3 4.5 6.7 4.5c2.1 0 3.6 1.2 5.3 3.1 1.7-1.9 3.2-3.1 5.3-3.1 3.7 0 5.8 3.9 4.3 7.3C19.5 16.4 12 21 12 21z"/></svg>';
let toastT = null;
function toast(msg){
  let t = document.getElementById("toast");
  if (!t) { t = document.createElement("div"); t.id = "toast"; t.className = "toast"; t.setAttribute("role","status"); t.setAttribute("aria-live","polite"); document.body.appendChild(t); }
  t.innerHTML = msg; t.classList.add("show"); clearTimeout(toastT); toastT = setTimeout(() => t.classList.remove("show"), 1800);
}
const wlabel = w => Number(w) === 9 ? "EXTRA" : "WEEK " + w;
const comma = n => String(Math.round(n * 10) / 10).replace(".", ",");
const gradeStr = g => Number(g).toFixed(1).replace(".", ",");

// ---------- courses ----------
const COURSES = window.COURSE_DATA || {};

const ST = {JJ:"Beide stellingen zijn juist.", JO:"Stelling 1 is juist, stelling 2 is onjuist.", OJ:"Stelling 1 is onjuist, stelling 2 is juist.", OO:"Beide stellingen zijn onjuist."};
ORDER.forEach(id => {
  const D = COURSES[id];
  D.FLASH.forEach(c => c.id = "f" + hashStr(c.q));
  D.MC.forEach(q => {
    q.id = "m" + hashStr(q.q + (q.s1 || "") + (q.s2 || ""));

  D.WK = Object.keys(D.WEEKS).map(Number);
});
let CID = null, FLASH = [], MC = [], OPEN = [], SPRINT = [], WEEKS = {}, TABLES = [], LESSONS = {}, INFO = {}, WK = [];

// ---------- storage (per vak) ----------
const fresh = () => ({cards:{}, mc:{}, open:{}, sprint:{}, exams:[], examDate:""});

try { THEME = localStorage.getItem("manouk-theme") || ""; if (!THEME) { const g = JSON.parse(localStorage.getItem("manouk-gvr-v1") || "{}"); if (g.theme) THEME = g.theme; } } catch (e) {}

function cycleTheme(){ THEME = THEME === "" ? "light" : THEME === "light" ? "dark" : ""; document.documentElement.dataset.ownTheme = "1"; try { localStorage.setItem("manouk-theme", THEME); } catch (e) {} applyTheme(); }

// ---------- stats helpers ----------
const cardState = c => S.cards[c.id];
const mastered = c => (cardState(c) && cardState(c).box >= 3);
const isDue = c => { const s = cardState(c); return s && s.due <= Date.now(); };
function weekCards(w){ return FLASH.filter(c => w === "all" || c.w === w); }
function weekMc(w){ return MC.filter(q => w === "all" || q.w === w); }
function mcStats(list){ let ans = 0, ok = 0; list.forEach(q => { const s = S.mc[q.id]; if (s) { ans++; if (s.last) ok++; } }); return {ans, ok, total:list.length}; }
function recordMc(q, right){ const s = S.mc[q.id] || {r:0, w:0, last:false}; if (right) s.r++; else s.w++; s.last = right; S.mc[q.id] = s; save(); }
function daysUntil(str){ if (!str) return null; const d = new Date(str + "T09:00:00"); if (isNaN(d)) return null; const t = new Date(); t.setHours(0,0,0,0); d.setHours(0,0,0,0); return Math.round((d - t) / DAY); }
function examGrade(score, total){
  const E = INFO.exam || {};
  if (E.guess) { const g = total / (E.k || 3); const f = Math.max(0, (score - g) / (total - g)); return {grade: Math.round((1 + 9 * f) * 10) / 10, frac: f}; }
  return {grade: Math.round((1 + 9 * score / total) * 10) / 10, frac: score / total};
}

}

function viewStart(){
  const due = FLASH.filter(isDue).length;
  const neu = FLASH.filter(c => !cardState(c)).length;

}

// ======================================================================
// FLASHCARDS
// ======================================================================
let cardFilter = {w:"all", mode:"herhaal"};
let cardSess = null;
function buildCardQueue(){
  const pool = weekCards(cardFilter.w);
  let q;
  if (cardFilter.mode === "herhaal") {
    const due = shuffle(pool.filter(isDue));
    const neu = pool.filter(c => !cardState(c)).slice(0, 20);
    q = due.concat(neu);
  } else if (cardFilter.mode === "moeilijk") {
    q = shuffle(pool.filter(c => cardState(c) && cardState(c).box <= 1));
  } else q = shuffle(pool);
  cardSess = {queue:q, i:0, flipped:false, tally:{1:0,2:0,3:0}, requeued:{}, streak:0};
}
function viewCards(){
  if (!cardSess) buildCardQueue();
  const s = cardSess, c = s.queue[s.i];
  const modeBtn = (k, t) => `<button data-mode="${k}" aria-pressed="${cardFilter.mode === k}">${t}</button>`;
  const head = `<header class="stack" style="gap:.5rem"><p class="eyebrow">${esc(INFO.short)} · Flashcards</p><h1>Kaarten</h1>
    <p class="muted">Denk eerst zelf na, draai dan om en geef eerlijk aan hoe goed je het wist. Kaarten die je lastig vindt komen vaker terug.</p></header>
    <div class="toolbar">
      <div class="seg" role="group" aria-label="Soort ronde">${modeBtn("herhaal","Herhalen")}${modeBtn("alles","Alle kaarten")}${modeBtn("moeilijk","Moeilijke")}</div>
      ${weekChips(cardFilter.w, "cw")}
    </div>`;
  if (!s.queue.length) {

function flipCard(){ if (!cardSess || !cardSess.queue[cardSess.i] || cardSess.flipped) return; cardSess.flipped = true; render(); }
function rateCard(r){
  const s = cardSess, c = s && s.queue[s.i]; if (!c || !s.flipped) return;
  const st = S.cards[c.id] || {box:0, due:0, n:0}, now = Date.now();
  const INT = [0,1,2,4,8,16];
  if (r === 1) { st.box = 1; st.due = now; if ((s.requeued[c.id] || 0) < 2) { s.requeued[c.id] = (s.requeued[c.id] || 0) + 1; s.queue.splice(Math.min(s.i + 4, s.queue.length), 0, c); } }
  else if (r === 2) { st.box = Math.max(1, st.box); st.due = now + DAY; }
  else { st.box = Math.min(5, st.box + 1); st.due = now + INT[st.box] * DAY; }
  st.n = (st.n || 0) + 1; S.cards[c.id] = st; save();
  s.tally[r]++; s.i++; s.flipped = false;
  if (r === 3) { s.streak++; if (STREAK[s.streak]) toast(`<span class="h">${heart}</span> ${STREAK[s.streak]}`); else if (Math.random() < .45) toast(pick(PRAISE)); }
  else s.streak = 0;
  render();
  const fc = $("#fc"); if (fc) fc.focus({preventScroll:true});
}
function bindCards(){
  $$("[data-mode]").forEach(b => b.addEventListener("click", () => { cardFilter.mode = b.dataset.mode; buildCardQueue(); render(); }));

}

function prepQuestion(q){ const order = q.fixed ? q.o.map((_, i) => i) : shuffle(q.o.map((_, i) => i)); return {q, order}; }
function questionHTML(item, chosen, reveal){

}
function letterIndex(e, item){ const k = e.key.toUpperCase(); const i = LETTERS.indexOf(k); return item && i >= 0 && i < item.order.length ? i : -1; }

function choosePrac(oi){

let exam = null, examConfirm = false, timerId = null;
function pickExam(n){
  const per = {}; MC.forEach(q => { (per[q.w] = per[q.w] || []).push(q); });
  Object.keys(per).forEach(w => per[w] = shuffle(per[w]));
  const out = []; let k = 0; const ws = shuffle(Object.keys(per));
  while (out.length < n && k < 400) { const w = ws[k % ws.length]; if (per[w].length) out.push(per[w].pop()); k++; }
  return shuffle(out).map(prepQuestion);
}
