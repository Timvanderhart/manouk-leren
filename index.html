{w:3,t:"Radbruch",q:"Een wet is volgens de juiste procedure tot stand gekomen, maar sluit een bevolkingsgroep willekeurig en bewust uit van elk rechtsbeschermingsmiddel. Hoe zou Radbruch hierover oordelen?",o:["Deze wet mist haar rechtskarakter, omdat de wetgever bewust het streven naar rechtvaardigheid loslaat","Deze wet blijft recht, want de procedure is gevolgd en rechtszekerheid gaat altijd voor","Deze wet is recht zolang de meerderheid haar steunt","De rechter moet eerst voorspellen hoe andere rechters zouden oordelen"],a:0,e:"Radbruch: als de wetgever bewust gelijke behandeling en het verbod op willekeur loslaat, mist de wet haar rechtskarakter. Hier gaat het om extreem en bewust onrecht, niet om gewone onrechtvaardigheid."},
{w:3,t:"Radbruch en Dworkin",q:"Radbruch en Dworkin nemen allebei een tussenpositie in tussen natuurrecht en rechtspositivisme. Welke bewering over het verschil is juist?",o:["Volgens Dworkin zit rechtvaardigheid in het recht zelf besloten; volgens Radbruch niet noodzakelijk","Volgens Dworkin is onrechtvaardig recht nooit recht; volgens Radbruch altijd wel","Volgens Radbruch bestaat recht uit regels én beginselen; Dworkin ziet alleen regels","Volgens Dworkin gaat positief recht in de meeste gevallen voor; volgens Radbruch nooit"],a:0,e:"Dworkin: recht bestaat uit regels én beginselen, dus rechtvaardigheid (via beginselen) is onderdeel van het recht. Radbruch: onrechtvaardig positief recht blijft in beginsel recht, behalve bij onverdraaglijk onrecht."},
{w:3,t:"Natuurrecht",q:"Antigone begraaft haar broer, hoewel een wet van koning Kreon dat verbiedt. Zij zegt dat goddelijke, ongeschreven wetten boven de wet van de koning staan. Welke stroming herken je?",o:["Natuurrecht","Rechtspositivisme","Rechtsrealisme","Juridisch formalisme"],a:0,e:"Een beroep op hogere, ongeschreven normen om een geschreven regel af te wijzen is het herkenningspunt van het natuurrecht."},
{w:3,t:"Natuurrecht",st:true,q:"Lees de volgende stellingen over het klassieke natuurrecht.",s1:"De hogere morele beginselen zijn ongeschreven, maar via de menselijke rede te achterhalen.",s2:"Een onrechtvaardige wet kan haar aanspraak om als recht te gelden verliezen.",a:"JJ",e:"Beide zijn kenmerken van het klassieke natuurrecht, zoals bij Thomas van Aquino."},
{w:3,t:"Natuurrecht",st:true,q:"Het natuurrecht heeft een eigen visie op recht en moraal.",s1:"Rechtsregels ontlenen hun legitimiteit aan de manier waarop zij zich verhouden tot hogere morele normen.",s2:"Een rechtsregel krijgt pas legitimiteit doordat een rechter de hogere morele normen toepast.",a:"JO",e:"Stelling 1 is de kern van het natuurrecht. Stelling 2 is onjuist: de legitimiteit volgt uit de verhouding tot hogere normen zelf, niet uit een handeling van de rechter. Let op dit soort kleine verschuivingen in stellingen!"},
{w:3,t:"Dworkin",q:"Een auteur schrijft: ‘Wat “onmenselijke behandeling” betekent, kun je niet vaststellen door alleen te kijken wie de regel heeft gemaakt. Daarvoor heb je morele argumenten nodig.’ Welke opvatting herken je?",o:["Antipositivisme (Dworkin)","Beschrijvend rechtspositivisme","Juridisch formalisme","Scandinavisch rechtsrealisme"],a:0,e:"Antipositivisme: niet alleen de herkomst bepaalt wat recht is; bij open normen is morele argumentatie nodig."},
{w:3,t:"Dworkin",q:"Volgens Dworkin is de rechter in een moeilijk geval, waarin geen enkele regel een duidelijk antwoord geeft:",o:["Nog steeds gebonden aan rechtsbeginselen die deel uitmaken van het recht","Vrij om naar eigen inzicht nieuw recht te maken","Verplicht de zaak terug te sturen naar de wetgever","Gebonden aan wat de meerderheid van de bevolking wil"],a:0,e:"Dworkin tegenover Hart: waar Hart discretionaire ruimte ziet, blijft de rechter volgens Dworkin gebonden aan rechtsbeginselen."},

// ---------- WEEK 4 ----------
{w:4,t:"Rechtsrealisme",q:"Uit onderzoek blijkt dat een wettelijke boete voor fietsen zonder licht in de praktijk bijna nooit wordt opgelegd. Welk onderscheid uit het rechtsrealisme wordt hier zichtbaar?",o:["Law in the books tegenover law in action","Primaire tegenover secundaire regels","Positief tegenover wenselijk recht","Formeel tegenover materieel recht"],a:0,e:"Op papier bestaat de boete (law in the books), maar in de praktijk werkt het anders (law in action). Precies dat verschil onderzoeken rechtsrealisten."},
{w:4,t:"Holmes",q:"Een ondernemer zegt: ‘Of het netjes is, maakt me niet uit. Ik wil alleen weten hoe hoog de boete is als ik de milieuregels overtreed.’ Welk idee past hierbij?",o:["De bad man theory van Holmes","De herkenningsregel van Hart","De Radbruch-formule","De grand style van Llewellyn"],a:0,e:"Holmes bekijkt het recht vanuit de ‘bad man’: iemand die alleen wil weten welke gevolgen zijn gedrag heeft, niet of het moreel juist is."},
{w:4,t:"Holmes",q:"Welke kritiek op de bad man theory is juist?",o:["Veel mensen volgen het recht juist omdat zij het als bindende norm zien, en recht omvat meer dan sancties","De theorie besteedt te veel aandacht aan morele overwegingen","De theorie gaat ervan uit dat rechters altijd mechanisch de wet toepassen","De theorie negeert de gevolgen van gedrag volledig"],a:0,e:"Kritiek: mensen zien het recht vaak als bindend, niet alleen als een risico op sancties. Bovendien heeft recht ook buiten de rechtszaal betekenis."},
{w:4,t:"Regel- en feitenscepsis",q:"Een onderzoeker bestudeert hoe getuigenverklaringen bij de rechtbank leiden tot uiteenlopende vaststellingen van wat er precies gebeurd is. Welke benadering past hierbij?",o:["Feitenscepsis","Regelscepsis","Juridisch formalisme","Natuurrecht"],a:0,e:"Feitenscepsis gaat over onzekerheid bij het vaststellen van feiten en kijkt vooral naar procedures bij feitenrechters. Regelscepsis gaat over de betekenis van regels en kijkt vooral naar hogere rechters."},
{w:4,t:"Llewellyn",q:"Een rechter neemt eerdere uitspraken serieus, maar volgt ze niet blind. Hij kijkt naar het doel van de regel en wijkt met een zorgvuldige motivering af van een eerdere lijn omdat de omstandigheden zijn veranderd. Welk begrip past hierbij?",o:["Grand style (Llewellyn)","Bad man theory (Holmes)","Open textuur (Hart)","Formeel legaliteitsbeginsel"],a:0,e:"Grand style: eerdere uitspraken serieus nemen, letten op doel en achterliggende reden, en aanpassing goed motiveren."},
{w:4,t:"Rechtsrealisme",q:"Welke stroming probeert recht wetenschappelijk te verklaren, onder andere vanuit de psychologische invloed van regels en instituties op mensen?",o:["Scandinavisch rechtsrealisme","Amerikaans rechtsrealisme","Nieuw rechtsrealisme","Juridisch formalisme"],a:0,e:"Het Scandinavische rechtsrealisme legt de nadruk op de psychologische werking van recht. Het Amerikaanse kijkt vooral naar rechterlijke beslissingen."},
{w:4,t:"Rechtsrealisme",q:"Wat is de positie van het nieuwe rechtsrealisme over sociaalwetenschappelijke kennis?",o:["Die vult juridische kennis aan, maar vervangt haar niet","Die vervangt juridische kennis volledig","Die is voor juristen niet relevant","Die mag alleen door rechters worden gebruikt"],a:0,e:"Het nieuwe rechtsrealisme wil juridische aannames kritisch onderzoeken en aanvullen met sociaalwetenschappelijke kennis. Juristen moeten zulke onderzoeksresultaten op betrouwbaarheid kunnen beoordelen."},
{w:4,t:"Positivisme en realisme",st:true,q:"Lees de volgende stellingen.",s1:"Zowel rechtspositivisten als Amerikaanse rechtsrealisten onderscheiden het recht zoals het is van het recht zoals het zou moeten zijn.",s2:"Volgens rechtsrealisten zijn rechtsregels waardeloos.",a:"JO",e:"Stelling 1 klopt; het verschil zit in de nadruk (herkomst van regels tegenover feitelijke werking). Stelling 2 is onjuist: regelscepsis betekent dat regels de uitkomst niet volledig vastleggen, niet dat ze waardeloos zijn."},
{w:4,t:"Rechtsrealisme",q:"Welk punt van kritiek op het rechtsrealisme wordt in de stof genoemd?",o:["Veel ruimte voor persoonlijke afwegingen kan ten koste gaan van rechtszekerheid, voorspelbaarheid en gelijke behandeling","Het rechtsrealisme heeft te weinig oog voor maatschappelijke gevolgen","Het rechtsrealisme ziet recht als een gesloten, logisch systeem","Het rechtsrealisme maakt geen onderscheid tussen recht en moraal"],a:0,e:"Juist de nadruk op de praktijk en de persoon van de rechter maakt het recht volgens critici minder voorspelbaar."},
{w:4,t:"Holmes",q:"Volgens Holmes moet het recht vooral worden begrepen als:",o:["Een voorspelling van wat rechters zullen beslissen","Een gesloten systeem van regels waaruit logisch één uitkomst volgt","Een uitdrukking van hogere, goddelijke wetten","Het geheel van primaire en secundaire regels"],a:0,e:"Holmes: recht als voorspelling van rechterlijke beslissingen. Recht ontwikkelt zich door ervaring; rechters vormen ook recht en moeten letten op maatschappelijke gevolgen."},

// ---------- WEEK 5 ----------
{w:5,t:"Rechtsgang",q:"In welke instantie worden de feiten niet opnieuw vastgesteld?",o:["Bij de Hoge Raad in cassatie","Bij het gerechtshof in hoger beroep","Bij de rechtbank in eerste aanleg","Bij de kantonrechter"],a:0,e:"De Hoge Raad controleert alleen de rechtstoepassing en de naleving van procesregels. Cassatiegronden: schending van het recht en verzuim van vormen."},
{w:5,t:"Partijen en uitspraken",q:"Marieke verloor bij de rechtbank in een dagvaardingsprocedure en stelt hoger beroep in. Hoe heet Marieke in hoger beroep en hoe heet de uitspraak van het hof?",o:["Appellant; arrest","Eiser; vonnis","Geïntimeerde; arrest","Verzoeker; beschikking"],a:0,e:"Wie hoger beroep instelt is de appellant, de wederpartij de geïntimeerde. Het hof doet uitspraak bij arrest."},
{w:5,t:"Partijen en uitspraken",q:"In een verzoekschriftprocedure doet de rechter uitspraak bij:",o:["Beschikking","Vonnis","Arrest","Dictum"],a:0,e:"Verzoekschriftprocedure: verzoeker en verweerder, uitspraak bij beschikking. Dagvaarding bij de rechtbank: vonnis; hoger beroep en cassatie: arrest."},
{w:5,t:"Arresten lezen",st:true,q:"Lees de volgende stellingen over de conclusie van de Advocaat-Generaal.",s1:"De Hoge Raad is gebonden aan de conclusie van de A-G.",s2:"In de conclusie van de A-G vind je nooit de overwegingen van de Hoge Raad in die zaak.",a:"OJ",e:"De conclusie is een advies; de HR is er niet aan gebonden. Omdat de conclusie vóór het arrest komt, kan zij de overwegingen van de HR niet bevatten. Wel vind je er bijvoorbeeld de feiten, het oordeel van het hof en de argumenten van partijen."},
{w:5,t:"Arresten lezen",q:"Waar in een arrest van de Hoge Raad vind je de concrete uitkomst van de zaak?",o:["In het dictum, onder ‘Beslissing’","In de conclusie van de A-G","In de annotatie","In ‘Het geding in feitelijke instanties’"],a:0,e:"Het dictum is de uiteindelijke beslissing van de rechter. De annotatie is commentaar van een deskundige en de conclusie is een advies; geen van beide is het oordeel van de HR."},
{w:5,t:"Arresten lezen",q:"Wat is een cassatiemiddel?",o:["Een juridische klacht waarmee een partij vernietiging van de bestreden uitspraak probeert te bereiken","Het advies van de A-G aan de Hoge Raad","De beslissing van de Hoge Raad","Een procedure voor spoedeisende zaken"],a:0,e:"Het cassatiemiddel bevat de klachten over de uitspraak van de lagere rechter. De HR beoordeelt het middel in ‘Beoordeling van het middel’."},
{w:5,t:"Rechtsgang",q:"Iemand krijgt een besluit van de gemeente waar hij het niet mee eens is. Wat is de gebruikelijke eerste stap?",o:["Bezwaar maken bij hetzelfde bestuursorgaan","Direct beroep instellen bij de Raad van State","Direct beroep instellen bij de rechtbank","Een klacht indienen bij het EHRM"],a:0,e:"Bestuursrechtelijke route: besluit → bezwaar (het orgaan heroverweegt) → beroep bij de rechtbank → hoger beroep (vaak de Afdeling bestuursrechtspraak van de Raad van State)."},
{w:5,t:"Rechtsgang",q:"Een verhuurder vordert €18.000 aan achterstallige huur. Welke rechter behandelt deze zaak?",o:["De kantonrechter","Het gerechtshof","De Hoge Raad","De Afdeling bestuursrechtspraak van de Raad van State"],a:0,e:"De kantonrechter (onderdeel van de rechtbank) behandelt o.a. geldvorderingen tot en met €25.000 en huur- en arbeidszaken. Dit is bovendien een huurzaak."},
{w:5,t:"Arresten",q:"Wat is de belangrijkste les uit het Catoochi-arrest?",o:["Strijd met een wettelijk verbod betekent niet zonder meer dat een overeenkomst nietig is","Virtuele voorwerpen kunnen worden gestolen","Een beroep op verjaring is altijd onaanvaardbaar","Een huwelijk kan door moord nietig worden"],a:0,e:"Bij Catoochi telden de strekking van het verbod, de maatschappelijke aanvaarding en het gedogen door de overheid mee. Optie 2 is RuneScape; bij de onwaardige deelgenoot bleef het huwelijk gewoon bestaan."},
{w:5,t:"Arresten",q:"Op grond waarvan oordeelde de Hoge Raad in RuneScape dat virtuele voorwerpen een ‘goed’ zijn in de zin van art. 310 Sr?",o:["Ze hadden reële waarde voor de spelers en het slachtoffer had er feitelijke en exclusieve controle over, die hij door de wegneming verloor","Ze zijn tastbaar, omdat ze op een server staan","De wetgever had virtuele voorwerpen uitdrukkelijk in art. 310 Sr opgenomen","Ze vallen onder computervredebreuk en dus ook onder diefstal"],a:0,e:"De HR keek naar de reële waarde en de feitelijke, exclusieve controle. Een goed hoeft niet tastbaar te zijn."},
{w:5,t:"Arresten",q:"In de zaak van de onwaardige deelgenoot verschilt de motivering van de Hoge Raad van die van het hof. Wat benadrukt de Hoge Raad?",o:["Dat al op grond van de redelijkheid en billijkheid de aanspraken moeten worden ontzegd, en dat algemene rechtsbeginselen slechts een ondersteunende rol spelen","Dat de algemene rechtsbeginselen van het hof niet bestaan","Dat alleen geschreven rechtsbeginselen een wettelijke regel kunnen beperken","Dat het huwelijk door de moord nietig is geworden"],a:0,e:"De HR komt tot dezelfde conclusie als het hof, maar via de redelijkheid en billijkheid; de rechtsbeginselen ondersteunen alleen."},
{w:5,t:"Wetgeving",q:"Welke uitspraak over de totstandkoming van een wet is juist?",o:["De Tweede Kamer heeft het recht van amendement, de Eerste Kamer niet","De Eerste Kamer kan een wetsvoorstel wijzigen door amendementen","Na bekrachtiging treedt een wet direct in werking, zonder bekendmaking","Het contraseign is de handtekening van de Koning"],a:0,e:"Alleen de Tweede Kamer kan amenderen. Na bekrachtiging volgen bekendmaking (Staatsblad) en inwerkingtreding. Het contraseign is de medeondertekening door een minister of staatssecretaris."},

// ---------- WEEK 6 ----------
{w:6,t:"Wet formeel/materieel",q:"Een Algemene Maatregel van Bestuur (alleen door de regering vastgesteld) bevat algemene regels voor alle automobilisten in Nederland. Dit is:",o:["Een wet in materiële zin, maar niet in formele zin","Een wet in formele zin, maar niet in materiële zin","Zowel een wet in formele als in materiële zin","Geen van beide"],a:0,e:"Formele zin: herkomst (regering én Staten-Generaal, art. 81 Gw); dat is hier niet zo. Materiële zin: inhoud (algemeen verbindend voorschrift van bevoegd gezag met externe werking); dat is wel zo."},
{w:6,t:"Wet formeel/materieel",q:"De begrotingswet van een ministerie wordt door regering en Staten-Generaal vastgesteld, maar bevat geen algemeen verbindende regels voor burgers. Dit is:",o:["Een wet in formele zin, maar niet in materiële zin","Een wet in materiële zin, maar niet in formele zin","Zowel een wet in formele als in materiële zin","Geen van beide"],a:0,e:"De herkomst maakt het een wet in formele zin. Omdat er geen algemene regels met externe werking in staan, is het geen wet in materiële zin. Kijk dus altijd naar maker én inhoud."},
{w:6,t:"Voorrangsregels",q:"Een gemeentelijke verordening is in strijd met een wet in formele zin. Welke voorrangsregel bepaalt welke regel voorgaat?",o:["Lex superior","Lex specialis","Lex posterior","Lex certa"],a:0,e:"Hoger recht (de formele wet) gaat voor lager recht (de verordening). Lex certa is een aspect van het legaliteitsbeginsel, geen voorrangsregel."},
{w:6,t:"Voorrangsregels",q:"Een algemene regel in de wet zegt dat alle huurcontracten schriftelijk moeten. Een bijzondere regel in dezelfde wet zegt dat dit voor kamerhuur van minder dan een maand niet hoeft. Welke voorrangsregel maakt dat de bijzondere regel voorgaat?",o:["Lex specialis","Lex superior","Lex posterior","Geen: de rechter mag dit niet bepalen"],a:0,e:"Een bijzondere regel gaat voor een algemene regel: lex specialis derogat legi generali."},
{w:6,t:"Attributie en delegatie",q:"Een wet geeft de minister de bevoegdheid om nadere regels te stellen. Later draagt de minister die bevoegdheid over aan een zelfstandig bestuursorgaan. Wat gebeurt hier achtereenvolgens?",o:["Eerst attributie, daarna delegatie","Eerst delegatie, daarna attributie","Twee keer attributie","Twee keer delegatie"],a:0,e:"Attributie: een nieuwe bevoegdheid wordt gecreëerd en toegekend (door de wet aan de minister). Delegatie: een bestaande bevoegdheid wordt overgedragen (van minister naar zbo)."},
{w:6,t:"Attributie en delegatie",q:"Wat betekent ‘privatieve werking’ van delegatie?",o:["Zolang de delegatie bestaat, oefent de oorspronkelijke bevoegdheidsdrager de overgedragen bevoegdheid niet zelf uit","De gedelegeerde bevoegdheid mag alleen voor privaatrechtelijke handelingen worden gebruikt","De bevoegdheid vervalt automatisch na een jaar","Beide organen mogen de bevoegdheid tegelijk uitoefenen"],a:0,e:"Privatief = ‘uitsluitend’: na delegatie ligt de bevoegdheid bij het nieuwe orgaan, zolang de delegatie bestaat."},
{w:6,t:"Gelede normstelling",q:"Wat is een nadeel van gelede normstelling?",o:["Minder directe democratische invloed op de uitwerking van de regels","Minder flexibiliteit","Langzamere aanpassing aan nieuwe omstandigheden","De formele wetgever kan geen hoofdlijnen meer vaststellen"],a:0,e:"Bij gelede normstelling stelt de formele wetgever de hoofdlijnen vast en werken lagere regelgevers die uit. Voordeel: flexibiliteit; nadeel: minder directe democratische invloed."},
{w:6,t:"Verdragen",q:"Een bepaling in een Nederlandse wet botst met een eenieder verbindende bepaling uit het EVRM. Wat doet de rechter?",o:["Hij laat de wettelijke bepaling buiten toepassing (art. 94 Gw)","Hij past de wet toe, want hij mag wetten niet toetsen (art. 120 Gw)","Hij verklaart het verdrag ongeldig","Hij stuurt de zaak door naar de Tweede Kamer"],a:0,e:"Art. 120 Gw verbiedt toetsing van formele wetten aan de Grondwet, maar toetsing aan eenieder verbindende verdragsbepalingen mag wel (art. 94 Gw)."},
{w:6,t:"Toetsing",st:true,q:"Lees de volgende stellingen over rechterlijke toetsing.",s1:"De rechter mag een wet in formele zin toetsen aan ongeschreven rechtsbeginselen.",s2:"De rechter mag een wet in formele zin toetsen aan eenieder verbindende verdragsbepalingen.",a:"OJ",e:"Harmonisatiewet-arrest: geen toetsing van formele wetten aan het Statuut en ongeschreven rechtsbeginselen. Toetsing aan eenieder verbindende verdragsbepalingen mag wel (art. 94 Gw)."},
{w:6,t:"Toetsing",st:true,q:"Lees de volgende stellingen.",s1:"De Nederlandse rechter mag op grond van de voorrangsregels wetten aan elkaar toetsen.",s2:"Het toetsingsverbod van art. 120 Gw betekent dat wetten in formele zin helemaal niet getoetst kunnen worden.",a:"JO",e:"Wetten aan elkaar toetsen via lex superior, specialis en posterior kan. Het toetsingsverbod geldt alleen voor de Grondwet (en volgens de Harmonisatiewet ook Statuut en ongeschreven beginselen); toetsing aan verdragen blijft mogelijk."},
{w:6,t:"Gewoonterecht",q:"In een dorp parkeren bewoners al tientallen jaren op de stoep. Iedereen weet dat het eigenlijk niet mag, en niemand vindt dat het zo hoort. Is er sprake van gewoonterecht?",o:["Nee, de opinio iuris ontbreekt","Ja, er is een bestendige gedragspraktijk (usus)","Ja, omdat de gemeente niet optreedt","Nee, omdat gewoonterecht alleen door de Hoge Raad kan worden erkend"],a:0,e:"Gewoonterecht vraagt usus én opinio iuris: de overtuiging dat de handelwijze juridisch behoort te worden gevolgd. Die overtuiging ontbreekt hier."},
{w:6,t:"Gewoonterecht",st:true,q:"Lees de volgende stellingen over gewoonterecht.",s1:"In het Catoochi-arrest werkt het gewoonterecht aanvullend op de regel dat rechtshandelingen in strijd met de wet nietig zijn.",s2:"Gewoonterecht kan alleen worden erkend door de Hoge Raad.",a:"OO",e:"Stelling 1 is onjuist: in Catoochi ging de maatschappelijke aanvaarding juist tegen het wettelijk verbod in (derogerende werking), niet aanvullend. Stelling 2 is onjuist: gewoonterecht ontstaat in de samenleving en kan niet alleen door de HR worden erkend."},
{w:6,t:"Rechtsbeginselen",q:"Wat gebeurt er volgens de besproken benadering als twee rechtsbeginselen met elkaar botsen?",o:["Ze worden tegen elkaar afgewogen; het minder zwaar wegende beginsel blijft gewoon bestaan","Het oudere beginsel vervalt","Het beginsel dat niet gecodificeerd is vervalt","Beide beginselen worden buiten toepassing gelaten"],a:0,e:"Beginselen hebben gewicht en worden afgewogen; regels hebben een alles-of-niets-karakter."},
{w:6,t:"Rechtsbeginselen",st:true,q:"Lees de volgende stellingen over rechtsbronnen.",s1:"Rechtsbeginselen en gewoonterecht zijn altijd ongeschreven.",s2:"Een rechtsbeginsel kan zowel door de wetgever als in de jurisprudentie worden erkend.",a:"OJ",e:"Rechtsbeginselen kunnen geschreven (gecodificeerd) of ongeschreven zijn. Erkenning kan door de wetgever (codificatie) én door de rechter."},
{w:6,t:"Rechtsbeginselen",q:"Volgens welke denker zijn rechtsbeginselen ‘optimaliseringsgeboden’?",o:["Alexy","Scholten","Nieuwenhuis","Holmes"],a:0,e:"Alexy: een beginsel is een ideaal dat zo veel mogelijk moet worden gerealiseerd. Scholten: achterliggende gemeenschappelijke gedachten; Nieuwenhuis: beginselen helpen het recht veranderen."},
{w:6,t:"Rechtsbeginselen",q:"Een rechter gebruikt het beginsel ‘niemand mag profiteren van zijn eigen onrechtmatig handelen’ om een duidelijke wettelijke regel in een uitzonderlijk geval opzij te zetten. Welke functie van rechtsbeginselen zie je?",o:["Derogerende werking","Leemten aanvullen","Codificatie","Een kenbron raadplegen"],a:0,e:"Als een beginsel tegen een rechtsregel inwerkt, heet dat derogerende werking."},
{w:6,t:"Wet AB",q:"Welk artikel uit de Wet Algemene Bepalingen illustreert het best het oude idee dat de wet de enige rechtsbron is?",o:["Art. 11: de rechter moet volgens de wet rechtspreken en mag de innerlijke waarde of billijkheid van de wet niet beoordelen","Art. 4: de wet verbindt alleen voor het toekomende en heeft geen terugwerkende kracht","Art. 13: de rechter mag niet weigeren recht te spreken onder voorwendsel van onduidelijkheid of onvolledigheid van de wet","Art. 13a: de rechtsmacht van de rechter is beperkt door uitzonderingen in het volkenrecht"],a:0,e:"Art. 11 (net als art. 5 en 12) laat zien dat alleen de wet telt. Volgens het antwoordmodel bij de oefentoets wijzen art. 4, 13 en 13a niet op een ontkenning van het pluralisme van rechtsbronnen."},
{w:6,t:"Rechtsbronnen",q:"Wat maakt een kenbron, zoals het Staatsblad, anders dan een rechtsbron?",o:["Een kenbron maakt het recht toegankelijk; een rechtsbron is waar rechtsregels uit voortkomen of in worden erkend","Een kenbron bevat alleen gewoonterecht","Een kenbron gaat altijd voor op een rechtsbron","Er is geen verschil"],a:0,e:"Kenbronnen (Staatsblad, Tractatenblad, Staatscourant, gemeentebladen) maken het recht kenbaar. Rechtsbronnen: wetten, verdragen, jurisprudentie, gewoonterecht, rechtsbeginselen."},

// ---------- WEEK 7 ----------
{w:7,t:"Interpretatiemethoden",q:"De rechter overweegt: ‘Uit de memorie van toelichting blijkt dat de wetgever met deze bepaling alleen beroepsmatige verkopers op het oog had.’ Welke interpretatiemethode gebruikt de rechter?",o:["Wetshistorisch","Grammaticaal","Systematisch","Teleologisch"],a:0,e:"Kijken naar wat de wetgever bedoelde (memorie van toelichting, parlementaire geschiedenis) is wetshistorische interpretatie."},
{w:7,t:"Interpretatiemethoden",q:"De rechter overweegt: ‘Dit artikel moet worden gelezen in samenhang met artikel 12 van dezelfde wet, dat voor deze situatie een afzonderlijke regeling bevat.’ Welke methode?",o:["Systematisch","Wetshistorisch","Teleologisch","Grammaticaal"],a:0,e:"Samenhang met andere artikelen of wetten: systematische interpretatie."},
{w:7,t:"Interpretatiemethoden",q:"De rechter overweegt: ‘De bepaling beoogt kwetsbare consumenten te beschermen. Gelet op de opkomst van online platforms valt ook verkoop via een app hieronder, ook al bestond die toen de wet werd gemaakt nog niet.’ Welke methode staat centraal?",o:["Teleologisch","Wetshistorisch","Grammaticaal","Systematisch"],a:0,e:"Het doel van de bepaling, toegepast op de huidige omstandigheden: teleologische interpretatie. Let op: de rechter gaat juist niet uit van wat de wetgever destijds voor ogen had."},
{w:7,t:"Interpretatiemethoden",q:"In een arrest overweegt de Hoge Raad dat een bepaalde handeling ‘naar algemeen spraakgebruik’ niet onder het begrip in de strafbepaling valt, en dat een ander artikel uit het Wetboek van Strafrecht daarvoor een meer geschikt kader biedt. Welke interpretatiemethoden herken je?",o:["Grammaticaal en systematisch","Wetshistorisch en teleologisch","Teleologisch en systematisch","Grammaticaal en wetshistorisch"],a:0,e:"‘Algemeen spraakgebruik’ wijst op grammaticale interpretatie; ‘een ander artikel biedt een geschikter kader’ wijst op systematische interpretatie. (Vergelijk Tongzoen II.)"},
{w:7,t:"Interpretatiemethoden",q:"Een advocaat betoogt dat zijn cliënt niet ‘wederrechtelijk’ handelde in de zin van een strafbepaling, omdat een ander artikel uit het Wetboek van Strafrecht in combinatie met een zorgplicht uit een andere wet zijn handelen rechtvaardigde. Welke methode gebruikt hij?",o:["Systematisch","Grammaticaal","Wetshistorisch","Teleologisch"],a:0,e:"De advocaat leest bepalingen uit verschillende wetten in samenhang: systematische interpretatie. (Vergelijk de zaak Jip de kip.)"},
{w:7,t:"Interpretatiemethoden",st:true,q:"Lees de volgende stellingen.",s1:"Extensieve uitleg is een aparte interpretatiemethode, naast de grammaticale, wetshistorische, systematische en teleologische methode.",s2:"Verschillende interpretatiemethoden kunnen tot verschillende uitkomsten leiden.",a:"OJ",e:"Restrictief en extensief beschrijven de reikwijdte van de uitleg, geen aparte methode. Methoden kunnen samen worden gebruikt en tot verschillende uitkomsten leiden (zie het Mensenroof-arrest: hof en HR kwamen anders uit)."},
{w:7,t:"Extensief en analogie",q:"In het Elektriciteitsarrest (1921) oordeelde de Hoge Raad dat elektriciteit een ‘goed’ is dat kan worden weggenomen in de zin van art. 310 Sr. Deze uitleg is te beschouwen als:",o:["Een extensieve uitleg","Een restrictieve uitleg","Een uitleg naar analogie","Een uitleg contra legem"],a:0,e:"De HR legt het begrip ‘goed’ ruim uit, maar binnen de grenzen van de bepaling: extensieve interpretatie."},
{w:7,t:"Extensief en analogie",q:"Een rechter rekent een gedraging onder een strafbepaling, hoewel die gedraging er duidelijk buiten valt, omdat het ‘sterk lijkt’ op het strafbare geval. Wat doet de rechter hier?",o:["Hij past verboden analogie toe","Hij interpreteert extensief, wat is toegestaan","Hij interpreteert restrictief","Hij past lex specialis toe"],a:0,e:"Bij analogie wordt de bepaling uitgebreid naar een geval dat erbuiten valt. In het strafrecht is dat verboden (analogieverbod). Extensief is ruime uitleg binnen de grenzen van de bepaling."},
{w:7,t:"Legaliteitsbeginsel",q:"Een Algemene Plaatselijke Verordening stelt ‘ongepast gedrag’ in de openbare ruimte strafbaar. In het licht van welk aspect van het legaliteitsbeginsel is dit problematisch?",o:["Lex certa","Lex scripta","Het verbod op terugwerkende kracht","Het analogieverbod"],a:0,e:"‘Ongepast gedrag’ is zo vaag dat burgers niet kunnen voorzien wat strafbaar is: lex certa. Lex scripta is in orde, want de regel is geschreven."},
{w:7,t:"Legaliteitsbeginsel",q:"Een nieuwe wet maakt het verspreiden van deepfakes strafbaar. Het OM wil iemand vervolgen voor een deepfake die hij een jaar vóór de inwerkingtreding van die wet verspreidde. Welk aspect van het legaliteitsbeginsel staat dit in de weg?",o:["Het verbod van terugwerkende kracht","Lex certa","Het analogieverbod","Het formeel legaliteitsbeginsel"],a:0,e:"Geen feit is strafbaar zonder een daaraan voorafgaande wettelijke strafbepaling (art. 1 lid 1 Sr, art. 16 Gw): gedrag mag niet achteraf strafbaar worden gemaakt."},
{w:7,t:"Legaliteitsbeginsel",q:"Een rechter wil iemand straffen voor gedrag dat volgens een lange, vaste gewoonte in een beroepsgroep verboden is, maar dat nergens in een wet strafbaar is gesteld. Welk aspect van het legaliteitsbeginsel staat hieraan in de weg?",o:["Lex scripta","Lex certa","Het verbod van terugwerkende kracht","Het formeel legaliteitsbeginsel"],a:0,e:"Strafbaarheid vraagt een geschreven wettelijke basis; alleen gewoonterecht is onvoldoende."},
{w:7,t:"Legaliteitsbeginsel",q:"Art. 1 Sv bepaalt dat strafvordering alleen plaatsvindt op de wijze die de wet voorziet. Dit is:",o:["Het formeel legaliteitsbeginsel","Het materieel legaliteitsbeginsel","Het analogieverbod","Lex certa"],a:0,e:"Formeel: wettelijke basis voor opsporing, vervolging en berechting. Materieel (art. 1 lid 1 Sr, art. 16 Gw): strafbaarheid en bestraffing."},
{w:7,t:"Wiarda",q:"Een rechter moet beslissen of een termijn van zes weken voor het instellen van beroep is verstreken. De regel is duidelijk en de data staan vast. Welk type rechtsvinding volgens Wiarda?",o:["Heteronome rechtsvinding","Gematigd heteronome rechtsvinding","Autonome rechtsvinding","Gematigd autonome rechtsvinding"],a:0,e:"Een duidelijke regel toepassen op vastgestelde feiten, met weinig eigen afweging: heteronoom."},
{w:7,t:"Wiarda",q:"Een rechter moet in een concrete arbeidszaak bepalen wat de wettelijke open norm ‘goed werkgeverschap’ inhoudt. Volgens het antwoordmodel bij de oefentoets is dit:",o:["Gematigd heteronome rechtsvinding: de wet biedt houvast, maar de rechter moet de norm nader invullen","Heteronome rechtsvinding: de rechter past de regel mechanisch toe","Autonome rechtsvinding: de rechter spreekt recht op eigen gezag zonder houvast in de wet","Geen rechtsvinding, maar wetgeving"],a:0,e:"De open norm staat in de wet en vormt de basis van de uitspraak; de rechter vult haar in voor het concrete geval. Het bestaande recht biedt dus voldoende houvast: gematigd heteronoom. Let op, je samenvatting zegt hier iets anders!"},
{w:7,t:"Wiarda",q:"Een rechter moet een geheel nieuw soort geschil beslissen. De wet bevat alleen een zeer vage norm, en er zijn geen richtinggevende regels of eerdere uitspraken. De rechter moet grotendeels zelf afwegen wat redelijk is en formuleert daarvoor een nieuwe regel. Welk type rechtsvinding volgens Wiarda?",o:["Autonome rechtsvinding","Gematigd heteronome rechtsvinding","Heteronome rechtsvinding","Formalistische rechtsvinding"],a:0,e:"Het bestaande recht biedt weinig concrete houvast en de rechter moet veel zelf afwegen: autonome rechtsvinding. Doorslaggevend is dus niet óf er een norm in de wet staat, maar hoeveel houvast die geeft."},
{w:7,t:"Rechtsvorming",q:"Welk argument pleit voor terughoudendheid bij rechterlijke rechtsvorming?",o:["Rechters zijn niet gekozen en hebben minder directe democratische legitimatie","De rechter kan leemten in de wet oplossen","Open normen moeten voor concrete gevallen worden ingevuld","Het recht moet aansluiten bij maatschappelijke veranderingen"],a:0,e:"De andere drie zijn argumenten vóór rechtsvorming. Andere argumenten voor terughoudendheid: de wetgever kan bredere belangen betrekken en overgangsproblemen beter regelen; rechtersrecht kan rechtsonzekerheid geven."},
{w:7,t:"Mensenroof",q:"In het Mensenroof-arrest ging het om de vraag of ‘over de grenzen voeren’ (art. 278 Sr) ook iemand náár Nederland brengen omvat. Hoe kwamen hof en Hoge Raad tot hun oordeel?",o:["Het hof legde beperkt uit op basis van de wetsgeschiedenis; de HR legde ruimer uit met grammaticale, wetshistorische en teleologische argumenten","Het hof en de HR legden allebei beperkt uit op basis van het spraakgebruik","Het hof legde ruim uit op basis van het doel; de HR beperkt op basis van de wetsgeschiedenis","De HR paste analogie toe, wat in het strafrecht is toegestaan"],a:0,e:"Het hof: alleen vervoer vanuit Nederland. De HR: ook naar Nederland. Dit laat zien dat methoden tot verschillende uitkomsten kunnen leiden, en roept vragen op over de grenzen van het legaliteitsbeginsel."},
{w:7,t:"RuneScape en Rozemond",q:"Rozemond vindt dat de Hoge Raad in RuneScape de verhouding tot computervredebreuk beter had moeten onderzoeken. Welke interpretatiemethode mist hij vooral?",o:["Systematische interpretatie","Grammaticale interpretatie","Wetshistorische interpretatie","Restrictieve interpretatie"],a:0,e:"De verhouding tussen diefstal en een ander delict (computervredebreuk) onderzoeken, is kijken naar de samenhang binnen het wettelijk stelsel: systematisch."},
{w:7,t:"Belangenafweging",q:"Een rechter moet in een burenruzie het belang van rust, het belang van een bedrijf en het belang van de gemeente bij werkgelegenheid tegen elkaar afwegen. Deze belangen zijn moeilijk op één schaal te vergelijken. Hoe heet dat probleem?",o:["Incommensurabiliteit","Open textuur","Feitenscepsis","Privatieve werking"],a:0,e:"Incommensurabiliteit: belangen zijn niet op één schaal te vergelijken. Bovendien spelen hier meer dan twee belangen, de tweede moeilijkheid bij belangenafweging."},

// ---------- WEEK 8 ----------
{w:8,t:"Vrijheid en gelijkheid",q:"De overheid geeft studenten met weinig geld een aanvullende beurs, zodat zij net zo goed kunnen studeren als anderen. Welke begrippen passen hierbij?",o:["Positieve vrijheid en materiële gelijkheid","Negatieve vrijheid en formele gelijkheid","Negatieve vrijheid en materiële gelijkheid","Positieve vrijheid en formele gelijkheid"],a:0,e:"De overheid schept voorwaarden zodat mensen daadwerkelijk iets kunnen (positieve vrijheid) en houdt rekening met feitelijke achterstanden (materiële gelijkheid)."},
{w:8,t:"Vrijheid",q:"Wat is kenmerkend voor negatieve vrijheid?",o:["Vrij zijn van inmenging door anderen, met een terughoudende overheid","Daadwerkelijk de middelen hebben om je doelen te bereiken","Een actieve overheid die voorzieningen biedt","Handelen volgens wat als het werkelijke goede wordt gezien"],a:0,e:"Negatieve vrijheid: met rust gelaten worden, vooral burgerlijke en politieke rechten, en een terughoudende overheid. Optie 2 en 3 horen bij positieve vrijheid, optie 4 bij ‘ware vrijheid’."},
{w:8,t:"Gelijkheid",q:"Een rechtbank oordeelt dat een regeling discriminerend uitwerkt, omdat een groep die al op achterstand staat door het schrappen van een compensatieregeling nog verder achteropraakt. Welke opvatting van gelijkheid hanteert de rechtbank, met de beste motivering?",o:["Materiële gelijkheid, omdat zij kijkt naar het ongelijke resultaat als er geen compensatie is voor de ongelijke uitgangspositie","Materiële gelijkheid, omdat zij rekening houdt met verschillen tussen groepen","Formele gelijkheid, omdat iedereen dezelfde kansen moet krijgen","Formele gelijkheid, omdat gelijke gevallen gelijk moeten worden behandeld"],a:0,e:"Twee opties noemen materiële gelijkheid. ‘Rekening houden met verschillen’ is te vaag: ook formele gelijkheid houdt rekening met verschillen (ongelijke gevallen ongelijk behandelen). Kenmerkend voor materiële gelijkheid is de blik op het resultaat, de ongelijke uitgangspositie en compensatie. Op het tentamen telt de meest precieze motivering!"},
{w:8,t:"Locke",q:"Waarom richten mensen volgens Locke een staat op?",o:["Om hun leven, vrijheid en eigendom te beschermen, omdat de natuurtoestand te weinig zekerheid biedt","Omdat mensen in de natuurtoestand onvrij en ongelijk zijn","Om een bepaald geloof af te dwingen","Omdat de natuurwet geen grenzen kent"],a:0,e:"In de natuurtoestand zijn mensen vrij en gelijk, maar die toestand is onzeker. De staat beschermt leven, vrijheid en eigendom. Volgens Locke mag de overheid geen geloof afdwingen."},
{w:8,t:"Democratie",q:"Een meerderheid in het parlement wil het demonstratierecht van een kleine religieuze groep beperken. Een commentator zegt: ‘Als de meerderheid dit wil en de procedure klopt, dan is het democratisch. Punt.’ Welke opvatting van democratie hanteert deze commentator?",o:["Formele democratie","Materiële democratie","Compenserende democratie","Inclusieve democratie"],a:0,e:"De nadruk ligt op procedure en meerderheidsbesluitvorming. Een materiële opvatting zou zeggen dat ook de meerderheid grondrechten en minderheden moet respecteren."},
{w:8,t:"Democratie",q:"Hoe wordt gelijkheid uitgelegd binnen een materiële opvatting van democratie?",o:["Als gelijkwaardigheid: iedereen verdient gelijke zorg en respect, dus minderheden mogen niet zomaar worden achtergesteld","Als gelijkheid van stemmen: iedere stem telt even zwaar","Als gelijke uitkomsten voor iedereen, ongeacht omstandigheden","Als het recht van de meerderheid om te beslissen"],a:0,e:"Formele democratie: gelijkheid = gelijkheid van stemmen. Materiële democratie: gelijkheid = gelijkwaardigheid. Precies dit onderscheid leverde in de oefentoets punten op!"},
{w:8,t:"Democratie",q:"Na een fel debat over een wetsvoorstel zegt de ene talkshowgast dat de Grondwet op meerdere manieren kan worden uitgelegd en dat het voorstel eerlijk is voor ‘gewone burgers’; de andere gast zegt dat het voorstel in strijd is met het gelijkheidsbeginsel. Welke opvatting van democratie komt het sterkst naar voren?",o:["Materieel, omdat de gasten van mening verschillen over wat een rechtvaardige uitkomst is voor alle burgers","Materieel, omdat beide gasten vinden dat de minderheid gelijk behandeld moet worden","Formeel, omdat het voorstel volgens de juiste procedure wordt behandeld","Formeel, omdat het gaat over onafhankelijke rechtspraak"],a:0,e:"Het debat gaat over de inhoud: wat is een rechtvaardige, gelijkwaardige uitkomst? Dat is materieel. Optie 2 klopt niet: alleen de tweede gast beroept zich op gelijke behandeling, de eerste verdedigt het voorstel juist. ‘Beide’ is dus onjuist. Lees elk detail van de opties!"},
{w:8,t:"Grondrechten",q:"Het recht op onderwijs en het recht op huisvesting zijn voorbeelden van sociale grondrechten. Bij welk vrijheidsbegrip sluiten deze vooral aan?",o:["Positieve vrijheid","Negatieve vrijheid","Collectieve vrijheid","Ware vrijheid"],a:0,e:"Sociale grondrechten gaan over basisvoorwaarden voor bestaan en ontplooiing: positieve vrijheid. Klassieke grondrechten sluiten aan bij negatieve vrijheid."},
{w:8,t:"Trias politica",q:"Jarenlang liet een hoogste bestuursrechter keuzes van de Belastingdienst grotendeels ongemoeid. Daarna ging hij uitvoeringsbesluiten actief toetsen aan het evenredigheidsbeginsel om burgers te beschermen. Wat past bij die verandering?",o:["Meer machtenspreiding: checks and balances tussen rechter en uitvoerende macht","Meer machtenscheiding: rechter en bestuur bemoeien zich minder met elkaar","Een overgang van machtenspreiding naar machtenscheiding","Geen verandering: de rechter blijft strikt gescheiden van het bestuur"],a:0,e:"Door het bestuur actief te controleren en te begrenzen, werkt de rechter meer volgens checks and balances (machtenspreiding). Ongemoeid laten past juist bij strikte scheiding."},
{w:8,t:"Trias politica",q:"Een regering wil dat de minister rechters kan ontslaan als hun uitspraken ‘het algemeen belang schaden’. Waar staat dit vooral mee op gespannen voet?",o:["De onafhankelijkheid van de rechter","Het analogieverbod","Het lex specialis-beginsel","Positieve vrijheid"],a:0,e:"De rechter moet zonder ongeoorloofde beïnvloeding door andere machten kunnen oordelen. Ontslag door de uitvoerende macht om de inhoud van uitspraken tast dat direct aan."},
{w:8,t:"Neutraliteit",q:"Een gemeente bepaalt dat geen enkele baliemedewerker een zichtbaar religieus symbool mag dragen, ongeacht de godsdienst. Welke vorm van neutraliteit en welke gelijkheid passen hierbij?",o:["Exclusieve neutraliteit en formele gelijkheid","Inclusieve neutraliteit en formele gelijkheid","Compenserende neutraliteit en materiële gelijkheid","Exclusieve neutraliteit en materiële gelijkheid"],a:0,e:"Religieuze uitingen buiten publieke functies houden is exclusieve neutraliteit. Dezelfde beperking voor iedereen: formele gelijkheid."},
{w:8,t:"Neutraliteit",q:"Een gemeente geeft extra subsidie aan een vereniging van een religieuze minderheid, om achterstanden ten opzichte van grotere gemeenschappen te verminderen. Welke vorm van neutraliteit?",o:["Compenserende neutraliteit","Exclusieve neutraliteit","Inclusieve neutraliteit","Formele neutraliteit"],a:0,e:"Extra ondersteuning voor minderheden om achterstanden te verminderen: compenserende neutraliteit, die aansluit bij materiële gelijkheid."},
{w:8,t:"Neutraliteit",q:"De burgemeester verbiedt een demonstratie ter voorkoming van wanordelijkheden, op grond van de Wet openbare manifestaties, die art. 9 lid 2 Gw uitwerkt. Deze beperking geldt voor iedere demonstratie, ongeacht de overtuiging van de demonstranten. Welke interpretaties van gelijkheid en neutraliteit passen hierbij?",o:["Formele gelijkheid en inclusieve neutraliteit","Formele gelijkheid en compenserende neutraliteit","Materiële gelijkheid en compenserende neutraliteit","Materiële gelijkheid en exclusieve neutraliteit"],a:0,e:"Alle overtuigingen mogen in beginsel publiek demonstreren (inclusief), en de beperking geldt voor iedereen op dezelfde grond (formele gelijkheid). Er is geen sprake van compensatie."},
{w:8,t:"Meningsuiting",q:"Welke uitspraak past het best bij de Amerikaanse benadering van de vrijheid van meningsuiting?",o:["Ook schokkende en beledigende uitingen zijn beschermd zolang ze geen directe oproep tot geweld zijn; slechte ideeën bestrijd je met betere argumenten","Uitingen mogen worden beperkt ter bescherming van kwetsbare groepen","Verdragsrechten mogen niet worden gebruikt om de in het EVRM vermelde rechten en vrijheden te vernietigen","De overheid bepaalt welke ideeën aanvaardbaar zijn"],a:0,e:"Amerikaans: vrije markt van ideeën. Optie 2 en 3 horen bij de Europese benadering (art. 10 lid 2 en art. 17 EVRM), die aansluit bij materiële democratie."},
{w:8,t:"Meningsuiting",q:"Welk artikel voorkomt dat de rechten uit het EVRM worden gebruikt om juist de rechten en vrijheden van het EVRM te vernietigen?",o:["Art. 17 EVRM","Art. 10 lid 2 EVRM","Art. 137d Sr","Art. 7 EVRM"],a:0,e:"Art. 17 EVRM: verbod op misbruik van recht. Art. 10 lid 2 biedt ruimte voor beperkingen; art. 137d Sr gaat over aanzetten tot haat; art. 7 EVRM over het legaliteitsbeginsel."},
{w:8,t:"Machtenscheiding",q:"Een wetsvoorstel wil de minister van Justitie het recht ontnemen om het Openbaar Ministerie opdrachten te geven over vervolging. Met welke opvatting van de trias politica is dit in lijn?",o:["Machtenscheiding: uitvoerende en rechterlijke macht worden strikter gescheiden","Machtenspreiding: de minister kan het OM beter controleren","Materiële democratie: de meerderheid krijgt meer invloed","Geen: het OM hoort bij de wetgevende macht"],a:0,e:"De minister hoort bij de uitvoerende macht, het OM bij de rechterlijke macht. Minder invloed van de minister betekent een strengere scheiding der machten."},
// ---------- aanvullingen na controle ----------
{w:6,t:"Rechtsbronnen",st:true,q:"Lees de volgende stellingen over rechtsbronnen.",s1:"Gewoonte is in het internationale recht geen formele rechtsbron, maar in het nationale recht wel.",s2:"Voor de gelding van een verdrag zijn ondertekening en bekendmaking voldoende.",a:"OO",e:"Stelling 1 is onjuist: internationaal gewoonterecht is juist een erkende bron van het volkenrecht. Stelling 2 is onjuist: je stof noemt ondertekening, ratificatie én bekendmaking; ratificatie ontbreekt hier."},
{w:6,t:"Witteveen",q:"Het beginsel van redelijkheid en billijkheid staat letterlijk in het Burgerlijk Wetboek (art. 6:2 en 6:248 BW). In de termen van Witteveen is dit een:",o:["Erkend rechtsbeginsel","Achtergrondbeginsel","Optimaliseringsgebod","Ongeschreven rechtsbeginsel"],a:0,e:"Erkende rechtsbeginselen zijn gecodificeerd. Achtergrondbeginselen zijn meer fundamentele normen van rechtvaardigheid die niet letterlijk in de wet staan. ‘Optimaliseringsgebod’ is de term van Alexy."},
{w:4,t:"Opvolgers rechtsrealisme",q:"Welke stroming werd in het gastcollege over de opvolgers van het rechtsrealisme wél als opvolger genoemd?",o:["Law & Economics","Law & Literature","Juridisch formalisme","Klassiek natuurrecht"],a:0,e:"Volgens de oefentoets zijn Legal Feminism, Law & Political Economy en Law & Economics opvolgers. Law & Literature niet. Formalisme en natuurrecht zijn geen opvolgers; het rechtsrealisme zette zich juist af tegen het formalisme."},
{w:1,t:"Kernbegrippen",q:"Art. 5:1 lid 1 BW luidt: ‘Eigendom is het meest omvattende recht dat een persoon op een zaak kan hebben.’ Het woord ‘recht’ verwijst hier naar:",o:["Subjectief recht","Objectief recht","Positief recht","Wenselijk recht"],a:0,e:"Het gaat om de concrete aanspraak die een persoon op een zaak heeft: een subjectief recht. Het artikel zelf is objectief recht, maar het woord ‘recht’ in de zin slaat op het recht van die persoon."},
{w:7,t:"Rozemond",q:"In zijn annotatie bij RuneScape schrijft Rozemond dat begrippen uit de bepaling over computervredebreuk niet moeten worden uitgelegd naar wat de wetgever destijds voor ogen had, maar ‘functioneel’, aan de hand van de technologische ontwikkelingen. Wat doet Rozemond hier?",o:["Hij wijst een wetshistorische uitleg af en kiest voor een teleologische uitleg","Hij wijst een teleologische uitleg af en kiest voor een wetshistorische uitleg","Hij wijst een grammaticale uitleg af en kiest voor een systematische uitleg","Hij wijst analogie af en kiest voor een restrictieve uitleg"],a:0,e:"‘Wat de wetgever destijds bedoelde’ is wetshistorisch; ‘functioneel, aan de hand van maatschappelijke en technologische ontwikkelingen’ is teleologisch."},
{w:7,t:"Boogaard & Uzman",q:"Boogaard en Uzman plaatsen hun visie op rechtsvorming tussen Montesquieu en Judge Dredd. Waar staat Montesquieu in dit beeld voor?",o:["De rechter als spreekbuis van de wet: heteronome rechtsvinding","De rechter die op eigen gezag recht spreekt: autonome rechtsvinding","De rechter als vertolker van de wet: gematigd heteronome rechtsvinding","De rechter als voorspeller van uitspraken: rechtsrealisme"],a:0,e:"Montesquieu: de rechter is de mond die de woorden van de wet uitspreekt (heteronoom). Judge Dredd: de rechter spreekt recht op eigen gezag. Boogaard en Uzman kiezen ertussenin: gematigd heteronoom."}
];

// Open casusvragen in de opbouw van de oefentoets: a (3 pt), b (4 pt), c (8 pt) = 15 punten.
// c = criteria om jezelf na te kijken, m = modelantwoord.
window.OPEN = [
{
id:"estep", title:"De e-step in het park", w:[3,7],
intro:"De gemeente Utrecht heeft in 1995 in haar Algemene Plaatselijke Verordening opgenomen: ‘Het is verboden met een voertuig het Wilhelminapark te betreden.’ Overtreding wordt bestraft met een geldboete. De regel kwam er na klachten over brommers die met hoge snelheid door het park reden.\n\nIn 2026 krijgt Sanne een boete omdat zij op een elektrische step door het park reed. Zij stelt dat een step geen ‘voertuig’ is en dat de gemeenteraad in 1995 nooit aan steps kan hebben gedacht.",
parts:[
{l:"a",p:3,q:"Leg uit wat Hart bedoelt met de open textuur van het recht en waarom deze casus daar een voorbeeld van is.",
c:[{p:1,t:"Rechtsregels bestaan uit taal, en taal kent randgevallen waarbij onduidelijk is of iets onder een begrip valt."},{p:1,t:"De wetgever kan niet elke situatie voorzien; daardoor ligt de toepassing niet voor elk geval vast en heeft de rechter in moeilijke gevallen beoordelingsruimte."},{p:1,t:"Toepassing: ‘voertuig’ heeft een duidelijke kern (auto, brommer), maar een e-step is een randgeval dat in 1995 niet voorzien was."}],
m:"Volgens Hart bestaan rechtsregels uit taal, en het is eigen aan taal dat er randgevallen zijn waarbij niet duidelijk is of iets binnen een begrip valt. De wetgever kan bovendien niet iedere situatie voorzien. Daardoor ligt de toepassing van een regel niet voor ieder geval vast: dat is de open textuur. In zo'n moeilijk geval heeft de rechter beoordelingsruimte.\nHier is ‘voertuig’ duidelijk van toepassing op een auto of brommer (de kern), maar een elektrische step is een randgeval dat de gemeenteraad in 1995 niet kon voorzien."},
{l:"b",p:4,q:"De rechter kan het begrip ‘voertuig’ op verschillende manieren uitleggen. Bespreek twee interpretatiemethoden en geef bij elk aan tot welke uitkomst die zou kunnen leiden.",
c:[{p:1,t:"Eerste methode juist benoemd en uitgelegd (bijv. wetshistorisch: wat bedoelde de wetgever?)."},{p:1,t:"Eerste methode toegepast op de casus, met een uitkomst."},{p:1,t:"Tweede methode juist benoemd en uitgelegd (bijv. teleologisch: wat is het doel van de regel?)."},{p:1,t:"Tweede methode toegepast op de casus, met een uitkomst."}],
m:"Wetshistorisch: de rechter kijkt naar wat de gemeenteraad in 1995 bedoelde. De regel kwam er vanwege brommers; aan e-steps werd niet gedacht. Dat kan leiden tot een beperkte uitleg: de step valt er niet onder en Sanne krijgt geen boete.\nTeleologisch: de rechter kijkt naar het doel van de regel, ook in de huidige omstandigheden. Het doel is de veiligheid en rust van wandelaars beschermen tegen snel, gemotoriseerd verkeer. Een e-step brengt die risico's ook mee, dus valt die er wel onder.\n(Ook goed: grammaticaal, ‘voertuig’ volgens het spraakgebruik of woordenboek; systematisch, samenhang met andere artikelen of verkeersregels.)"},
{l:"c",p:8,q:"Omdat op overtreding een geldboete staat, gaat het om een strafbaar feit. Bespreek of de rechter het begrip ‘voertuig’ hier ruim mag uitleggen. Betrek daarbij (1) het legaliteitsbeginsel, (2) het verschil tussen extensieve interpretatie en analogie en (3) de visie van Hart óf Dworkin op moeilijke gevallen.",
c:[{p:2,t:"Materieel legaliteitsbeginsel uitgelegd (art. 1 lid 1 Sr, art. 16 Gw): geen straf zonder voorafgaande wettelijke strafbepaling; burgers moeten kunnen voorzien wat strafbaar is (lex certa)."},{p:2,t:"Verschil uitgelegd: extensief = ruime uitleg binnen de grenzen van de bepaling (toegestaan); analogie = uitbreiden naar een geval erbuiten omdat het erop lijkt (verboden in het strafrecht)."},{p:2,t:"Toepassing: valt de e-step nog binnen de betekenis van ‘voertuig’, dan is een ruime uitleg extensief en toegestaan; valt die erbuiten, dan zou het verboden analogie zijn. Eigen conclusie met argument."},{p:2,t:"Hart: in moeilijke gevallen discretionaire ruimte om recht te vormen. Of Dworkin: de rechter blijft gebonden aan rechtsbeginselen (bijv. rechtszekerheid, geen straf zonder voorzienbare wet)."}],
m:"Het strafrecht is ultimum remedium en het materieel legaliteitsbeginsel (art. 1 lid 1 Sr, art. 16 Gw, art. 7 EVRM) bepaalt dat geen feit strafbaar is zonder een voorafgaande wettelijke strafbepaling. Burgers moeten kunnen voorzien welk gedrag strafbaar is (lex certa), en de rechter mag strafbaarheid niet uitbreiden via analogie.\nExtensieve interpretatie is ruime uitleg binnen de grenzen van de bepaling en is toegestaan (vgl. het Elektriciteitsarrest). Bij analogie wordt de bepaling uitgebreid naar een geval dat erbuiten valt, alleen omdat het erop lijkt; dat is in het strafrecht verboden.\nIk vind dat een e-step nog binnen de gewone betekenis van ‘voertuig’ valt: het is een gemotoriseerd vervoermiddel op wielen. Dan is het een extensieve, toegestane uitleg. Wie vindt dat ‘voertuig’ in 1995 alleen brommers en auto's omvatte, zal zeggen dat het om verboden analogie gaat.\nVolgens Hart is dit een moeilijk geval door de open textuur: de rechter heeft discretionaire ruimte en vormt hier recht. Volgens Dworkin blijft de rechter ook dan gebonden aan beginselen, zoals rechtszekerheid en het beginsel dat niemand mag worden gestraft voor gedrag dat hij niet kon voorzien."}
]},
{
id:"overstroming", title:"Schuilen tijdens de overstroming", w:[2],
intro:"In het fictieve land Vallonië geldt de wet: ‘Wie zonder toestemming een gebouw van een ander binnengaat, wordt gestraft met gevangenisstraf van ten hoogste één jaar.’ Er is geen uitzondering voor noodsituaties in de wet opgenomen.\n\nTijdens een plotselinge overstroming breekt Daan de deur van een leegstaand kantoorpand open, zodat twintig mensen, onder wie kinderen, droog kunnen schuilen. Niemand raakt gewond en er ontstaat alleen schade aan de deur. Het Openbaar Ministerie vervolgt Daan. Uit een peiling blijkt dat 80% van de bevolking vindt dat hij moet worden vrijgesproken.",
parts:[
{l:"a",p:3,q:"Hoe zou rechter Keen uit de zaak van de grotverkenners deze zaak beslissen? Motiveer je antwoord met zijn opvatting over de taak van de rechter.",
c:[{p:1,t:"Uitkomst: Keen zou Daan schuldig verklaren (veroordelen)."},{p:1,t:"Motivering: de rechter past het geldende recht toe en houdt zijn persoonlijke opvatting over rechtvaardigheid gescheiden van zijn taak."},{p:1,t:"Strafkwijtschelding of gratie is een taak van het bestuur; de rechter respecteert de taakverdeling tussen wetgever, bestuur en rechter."}],
m:"Keen zou Daan veroordelen. Hij maakt een strikt onderscheid tussen zijn persoonlijke mening en zijn taak als rechter: de rechter moet het geldende recht toepassen en zijn persoonlijke gevoelens over rechtvaardigheid mogen het oordeel niet bepalen. De wet kent hier geen uitzondering. Persoonlijk kan Keen begrip hebben voor Daan, maar strafkwijtschelding is een beslissing van het bestuur; de rechter moet de taken van wetgever en bestuur respecteren."},
{l:"b",p:4,q:"Hoe zouden rechter Foster en rechter Handy deze zaak benaderen? Noem per rechter de rechtsfilosofische stroming en de bijbehorende kernwaarde.",
c:[{p:1,t:"Foster: natuurrecht, kernwaarde rechtvaardigheid."},{p:1,t:"Foster: de letter van de wet is niet doorslaggevend; Daan schendt de letter maar niet het doel/recht (vergelijk zelfverdediging). Uitkomst: vrijspraak."},{p:1,t:"Handy: rechtsrealisme, kernwaarde doelmatigheid."},{p:1,t:"Handy: praktisch en menselijk probleem, recht moet aansluiten bij de werkelijkheid en de opvattingen van de bevolking (80%). Uitkomst: vrijspraak."}],
m:"Foster redeneert vanuit het natuurrecht met als kernwaarde rechtvaardigheid. Je kunt de letter van de wet schenden zonder het recht te schenden: de wet is bedoeld om eigendom te beschermen, niet om mensen te straffen die levens redden. Zoals bij zelfverdediging geldt een verbod niet zonder uitzonderingen. Hij spreekt vrij.\nHandy redeneert vanuit het rechtsrealisme met als kernwaarde doelmatigheid. Hij ziet de zaak als een praktisch en menselijk probleem; het recht moet aansluiten bij de werkelijkheid en goed bestuur houdt rekening met de opvattingen van de bevolking (80% wil vrijspraak). Hij spreekt ook vrij."},
{l:"c",p:8,q:"Neem zelf een standpunt in: veroordelen, vrijspreken of een tussenpositie. Onderbouw dit met twee argumenten, bespreek een tegenargument en leg uit welke kernwaarde door jouw keuze onder druk komt te staan. Betrek daarbij het begrip antinomieën.",
c:[{p:1,t:"Duidelijk standpunt ingenomen."},{p:2,t:"Eerste argument, ontleend aan de casus en gekoppeld aan een stroming of kernwaarde."},{p:2,t:"Tweede argument, ontleend aan de casus en gekoppeld aan een stroming of kernwaarde."},{p:1,t:"Een serieus tegenargument besproken."},{p:2,t:"Benoemd welke kernwaarde onder druk komt en uitgelegd dat kernwaarden kunnen botsen (antinomieën): geen waarde heeft altijd voorrang."}],
m:"Ik kies voor de tussenpositie van Truepenny: Daan veroordelen, maar het bestuur verzoeken om strafvermindering of gratie.\nArgument 1 (rechtszekerheid, rechtspositivisme): de wet is duidelijk en kent geen uitzondering. Als rechters naar eigen moraal uitzonderingen maken, wordt het recht onvoorspelbaar en treedt de rechter in de rol van de wetgever.\nArgument 2 (rechtvaardigheid): Daan redde twintig mensen; een zware straf zou onrechtvaardig zijn. Daarom vraag ik het bestuur om de straf te verminderen, zodat recht en rechtvaardigheid beide aandacht krijgen.\nTegenargument: Foster en Handy zouden zeggen dat de rechter zelf moet vrijspreken, omdat toepassing van de wet moet passen bij haar doel en bij de werkelijkheid; 80% van de bevolking wil vrijspraak.\nDoor mijn keuze komt vooral de rechtvaardigheid (en de doelmatigheid) onder druk: Daan krijgt een veroordeling op zijn naam voor een goede daad. Dit laat de antinomieën zien: rechtszekerheid, rechtvaardigheid en doelmatigheid kunnen botsen en er is geen eenvoudige keuze waarbij één waarde altijd wint."}
]},
{
id:"jachthaven", title:"Het gebruik in de jachthaven", w:[6,9],
intro:"In de jachthavens langs de Vecht geldt al zeventig jaar het gebruik dat een passant die als eerste in een vrije box ligt, die box tot zonsondergang mag gebruiken, ook als de box van een vaste ligplaatshouder is die op dat moment weg is. Havenmeesters, schippers en ligplaatshouders gaan er allemaal van uit dat dit ‘zo hoort’ en houden zich eraan.\n\nEen nieuwe havenexploitant in Maarssen weigert dit gebruik te respecteren en wijst op een bepaling uit een recente verordening, die zegt dat een box alleen door de ligplaatshouder mag worden gebruikt.",
parts:[
{l:"a",p:3,q:"Is hier sprake van gewoonterecht? Bespreek beide voorwaarden.",
c:[{p:1,t:"Usus: een bestendige gedragspraktijk binnen een gemeenschap, toegepast (zeventig jaar, alle betrokkenen in de havens)."},{p:1,t:"Opinio iuris: de overtuiging dat de handelwijze juridisch behoort te worden gevolgd, toegepast (‘zo hoort het’)."},{p:1,t:"Conclusie, eventueel met de grond voor erkenning: gerechtvaardigde verwachtingen."}],
m:"Gewoonterecht vereist usus en opinio iuris. Usus: er is een bestendige gedragspraktijk binnen een bepaalde gemeenschap; hier al zeventig jaar in de havens langs de Vecht. Opinio iuris: de betrokkenen zijn ervan overtuigd dat deze handelwijze juridisch behoort te worden gevolgd; iedereen gaat ervan uit dat het ‘zo hoort’ en houdt zich eraan. Beide voorwaarden zijn vervuld, dus er is sprake van gewoonterecht. Erkenning is gerechtvaardigd omdat mensen moeten kunnen vertrouwen op een handelwijze die als verplicht wordt gezien."},
{l:"b",p:4,q:"De verordening bepaalt iets anders dan het gebruik. Leg uit wat het verschil is tussen aanvullende en derogerende werking van gewoonterecht, welke van de twee hier aan de orde is, en wat je in dit verband uit het Catoochi-arrest kunt leren.",
c:[{p:1,t:"Aanvullende werking: gewoonterecht vult het recht aan waar de wet niets regelt."},{p:1,t:"Derogerende werking: gewoonterecht gaat tegen een geschreven regel in en zet die (gedeeltelijk) opzij."},{p:1,t:"Hier: derogerende werking, want het gebruik gaat in tegen de verordening."},{p:1,t:"Catoochi: maatschappelijke aanvaarding (en gedogen) kan meewegen tegen een wettelijke regel in; strijd met een wettelijk verbod betekent niet zonder meer nietigheid."}],
m:"Bij aanvullende werking vult gewoonterecht een leemte op: de wet regelt iets niet en het gebruik bepaalt wat geldt. Bij derogerende werking gaat het gewoonterecht in tegen een geschreven regel en zet het die opzij.\nHier staat het gebruik tegenover een uitdrukkelijke bepaling uit de verordening, dus gaat het om derogerende werking.\nIn Catoochi woog de maatschappelijke aanvaarding van de verboden loterij (en het gedogen door de overheid) mee tegen het wettelijke verbod in: strijd met een wettelijk verbod leidde niet zonder meer tot nietigheid. Dat laat zien dat maatschappelijke praktijk tegen een geschreven regel kan inwerken."},
{l:"c",p:8,q:"De Wet Algemene Bepalingen gaat uit van het idee dat de wet de enige rechtsbron is. Illustreer dit idee met twee artikelen uit de Wet AB. Leg daarna uit hoe het rechtspositivisme en het rechtsrealisme aankijken tegen gewoonterecht als rechtsbron.",
c:[{p:2,t:"Eerste artikel juist weergegeven en gekoppeld aan het idee (bijv. art. 5: een wet verliest alleen haar kracht door een latere wet, niet door gewoonte of jurisprudentie)."},{p:2,t:"Tweede artikel juist weergegeven en gekoppeld (art. 11: rechter spreekt recht volgens de wet en beoordeelt de billijkheid niet; of art. 12: uitspraak bindt alleen partijen, de rechter maakt geen algemene regels)."},{p:2,t:"Rechtspositivisme: de herkomst en erkenning zijn bepalend; gewoonterecht is recht als het via een erkende bron (herkenningsregel) als recht wordt erkend."},{p:2,t:"Rechtsrealisme: kijkt naar de maatschappelijke werking (law in action); recht ontstaat ook van onderop uit gedrag en gewoonten in de samenleving."}],
m:"Art. 5 Wet AB: een wet verliest alleen haar kracht door een latere wet. Gewoonte of jurisprudentie kunnen een wet dus niet opzij zetten; de wet staat boven de andere bronnen.\nArt. 11 Wet AB: de rechter moet volgens de wet rechtspreken en mag de innerlijke waarde of billijkheid van de wet niet beoordelen. Rechtspreken kan dus alleen op basis van de wet; andere bronnen zoals beginselen of gewoonten zijn uitgesloten.\n(Ook goed: art. 12, een uitspraak bindt alleen partijen; uit een uitspraak volgen geen algemene regels. Niet goed: art. 4, 13 en 13a.)\nRechtspositivisme: een regel hoort bij het recht doordat zij uit een erkende bron voortkomt; de herkomst en erkenning zijn bepalend, niet de inhoud. Gewoonterecht is recht wanneer het volgens de criteria van de herkenningsregel als recht wordt erkend.\nRechtsrealisme: kijkt naar hoe regels, gewoonten en uitspraken in de praktijk ontstaan en worden toegepast (law in action). Recht ontstaat ook van onderop vanuit de samenleving (evolutionair karakter), zoals dit gebruik in de jachthavens laat zien."}
]},
{
id:"neude", title:"Demonstratie op de Neude", w:[8,9],
intro:"Een actiegroep demonstreert op de Neude in Utrecht tegen een religieuze minderheid. Op de spandoeken wordt de groep als geheel neergezet als ‘gevaar voor Nederland’ dat ‘niet bij ons hoort’. Er wordt niet opgeroepen tot geweld. Na afloop vervolgt het Openbaar Ministerie de organisatoren voor groepsbelediging (art. 137c Sr). De organisatoren beroepen zich op de vrijheid van meningsuiting.",
parts:[
{l:"a",p:3,q:"Hoe zou deze zaak volgens de Amerikaanse benadering van de vrijheid van meningsuiting worden beoordeeld? Motiveer je antwoord.",
c:[{p:1,t:"Ruime bescherming, ook voor schokkende en beledigende uitingen, zolang er geen directe oproep tot geweld is."},{p:1,t:"Vrije markt van ideeën: verkeerde ideeën moet je bestrijden met betere argumenten; de overheid bepaalt niet welke ideeën aanvaardbaar zijn."},{p:1,t:"Toepassing: er wordt niet opgeroepen tot geweld, dus de uitingen zouden beschermd zijn en vervolging zou niet passen."}],
m:"De Amerikaanse benadering beschermt politieke meningen ruim, ook als ze schokkend, verwerpelijk of beledigend zijn, zolang ze geen directe oproep tot geweld vormen. De gedachte is een vrije markt van ideeën: verkeerde ideeën moeten met betere argumenten worden bestreden, en de overheid hoort zo weinig mogelijk te bepalen welke ideeën aanvaardbaar zijn. Omdat hier niet tot geweld wordt opgeroepen, zouden de uitingen beschermd zijn en zou vervolging niet passen."},
{l:"b",p:4,q:"Hoe zou deze zaak volgens de Europese benadering worden beoordeeld? Betrek twee relevante artikelen.",
c:[{p:1,t:"Vrijheid van meningsuiting is beschermd, maar kan worden begrensd ter bescherming van andere rechten, democratische waarden en kwetsbare groepen."},{p:1,t:"Art. 10 lid 2 EVRM: ruimte voor gerechtvaardigde beperkingen."},{p:1,t:"Art. 17 EVRM (verdragsrechten mogen niet worden gebruikt om de in het EVRM vermelde rechten en vrijheden te vernietigen) of art. 137c/137d Sr (groepsbelediging, aanzetten tot haat of discriminatie)."},{p:1,t:"Context is belangrijk: kritiek op een geloof is niet hetzelfde als belediging van gelovigen. Hier wordt de groep als zodanig weggezet, wat strafrechtelijk optreden achteraf kan rechtvaardigen."}],
m:"In de Europese benadering is de vrijheid van meningsuiting beschermd, maar ook begrensd ter bescherming van andere rechten en democratische waarden. Art. 10 lid 2 EVRM biedt ruimte voor gerechtvaardigde beperkingen, en art. 17 EVRM voorkomt dat verdragsrechten worden gebruikt om de in het EVRM vermelde rechten en vrijheden te vernietigen. In Nederland zijn groepsbelediging (art. 137c Sr) en aanzetten tot haat of discriminatie (art. 137d Sr) strafbaar.\nDe context is beslissend: kritiek op een geloof valt onder het debat, maar hier wordt een groep gelovigen als zodanig als gevaar weggezet. Dat kan vervolging achteraf rechtvaardigen.\n(Goed om te weten: vooraf een demonstratie verbieden vanwege de inhoud mag in Nederland niet, art. 5 lid 3 Wet openbare manifestaties en het censuurverbod. Daarom gaat het hier om strafrechtelijk optreden achteraf.)"},
{l:"c",p:8,q:"Bij welke opvatting van democratie sluit de Europese benadering het sterkst aan? Leg uit hoe gelijkheid in die opvatting wordt uitgelegd, vergelijk dit met de andere opvatting van democratie, en geef aan wat elke opvatting betekent voor de rol van de rechter.",
c:[{p:1,t:"De Europese benadering sluit aan bij materiële democratie."},{p:2,t:"Materiële democratie: legitimiteit hangt ook af van inhoudelijke waarden (grondrechten, bescherming minderheden); gelijkheid = gelijkwaardigheid, iedereen verdient gelijke zorg en respect."},{p:1,t:"Materieel: grotere, controlerende rol van de rechter om minderheden te beschermen tegen tirannie van de meerderheid."},{p:2,t:"Formele democratie: nadruk op procedure en meerderheidsbesluitvorming; gelijkheid = gelijkheid van stemmen, iedere stem telt even zwaar."},{p:2,t:"Formeel: geen grote rol voor de rechter, want die is niet democratisch gekozen en mist democratische legitimatie."}],
m:"De Europese benadering sluit aan bij een materiële opvatting van democratie. Daarin is iets democratisch gelegitimeerd als het inhoudelijke democratische waarden respecteert, zoals grondrechten en bescherming van minderheden. Gelijkheid betekent hier gelijkwaardigheid: iedereen verdient gelijke zorg en respect, dus minderheden mogen niet worden achtergesteld, ook niet als de meerderheid dat wil. De rechter heeft dan een grotere, controlerende rol: hij bewaakt die waarden en beschermt minderheden tegen de tirannie van de meerderheid.\nIn een formele opvatting draait democratie om procedures, gelijke stemmen en meerderheidsbesluitvorming. Gelijkheid betekent daar gelijkheid van stemmen: iedere stem telt even zwaar. Er past geen grote rol voor de rechter, want die is niet door het volk gekozen en heeft geen democratische legitimatie."}
]},
{
id:"binnenhof", title:"Demonstreren bij het Binnenhof", w:[6,7,8],
intro:"Na een reeks onrustige protesten neemt het parlement een wet in formele zin aan die bepaalt dat demonstraties in een straal van 500 meter rond het Binnenhof alleen nog op zondag zijn toegestaan. Een actiegroep vindt dat de wet in strijd is met het recht tot betoging uit art. 9 Grondwet en met de vrijheid van vergadering uit art. 11 EVRM. Een columnist schrijft: ‘Als de rechter deze wet opzij zet, gaat hij op de stoel van de wetgever zitten.’",
parts:[
{l:"a",p:3,q:"Mag de rechter deze wet toetsen aan art. 9 Grondwet? En aan art. 11 EVRM? Motiveer je antwoord.",
c:[{p:1,t:"Art. 120 Gw: de rechter mag wetten in formele zin niet toetsen aan de Grondwet, dus niet aan art. 9 Gw."},{p:1,t:"Art. 94 Gw: wettelijke voorschriften blijven buiten toepassing bij strijd met eenieder verbindende verdragsbepalingen."},{p:1,t:"Art. 11 EVRM is (naar zijn inhoud) eenieder verbindend, dus de rechter mag hieraan toetsen en de wet zo nodig buiten toepassing laten."}],
m:"Aan art. 9 Gw mag de rechter de wet niet toetsen: art. 120 Gw verbiedt toetsing van wetten in formele zin aan de Grondwet. Aan art. 11 EVRM mag dat wel: volgens art. 94 Gw blijven wettelijke voorschriften buiten toepassing als toepassing strijdig is met eenieder verbindende verdragsbepalingen. Art. 11 EVRM kan naar zijn inhoud eenieder verbinden, dus de rechter kan de wet aan die bepaling toetsen."},
{l:"b",p:4,q:"Leg uit wat het verschil is tussen machtenscheiding en machtenspreiding, en welke van de twee het sterkst terugkomt als de rechter deze wet aan het EVRM toetst.",
c:[{p:1,t:"Machtenscheiding: wetgevende, uitvoerende en rechterlijke macht hebben strikt gescheiden taken en bemoeien zich niet met elkaar."},{p:1,t:"Machtenspreiding: eigen taken, maar de machten controleren en begrenzen elkaar (checks and balances)."},{p:2,t:"Toetsing aan het EVRM: de rechter controleert en begrenst de wetgever, dus machtenspreiding (checks and balances)."}],
m:"Bij machtenscheiding hebben de drie machten strikt gescheiden taken en bemoeien zij zich niet met elkaars werk. Bij machtenspreiding hebben ze eigen taken, maar controleren en begrenzen ze elkaar: checks and balances.\nAls de rechter de wet aan het EVRM toetst en zo nodig buiten toepassing laat, controleert de rechterlijke macht de wetgevende macht. Dat past het best bij machtenspreiding."},
{l:"c",p:8,q:"Reageer op de columnist. Bespreek twee argumenten voor en twee argumenten tegen een grotere rol van de rechter, en leg uit hoe de formele en de materiële opvatting van democratie hier verschillend over denken.",
c:[{p:2,t:"Twee argumenten vóór rechterlijke rechtsvorming/controle (bijv. rechtsbescherming bieden, leemten en open normen invullen, aansluiten bij maatschappelijke veranderingen)."},{p:2,t:"Twee argumenten voor terughoudendheid (bijv. rechters niet gekozen, wetgever kan bredere belangen en informatie betrekken, overgangsproblemen, rechtsonzekerheid; primaat van de politiek)."},{p:2,t:"Formele democratie: nadruk op procedure en meerderheid, gelijkheid van stemmen; de rechter is niet gekozen, dus een grote rol past niet."},{p:2,t:"Materiële democratie: ook grondrechten en minderheden beschermen, gelijkwaardigheid; een controlerende rechter past juist goed."}],
m:"Voor een grotere rol van de rechter: (1) de rechter kan rechtsbescherming bieden aan burgers en minderheden wiens grondrechten worden beperkt; (2) de rechter kan open normen in verdragen voor concrete gevallen invullen en het recht laten aansluiten bij maatschappelijke ontwikkelingen.\nVoor terughoudendheid: (1) rechters zijn niet gekozen en hebben minder directe democratische legitimatie; het primaat van de politiek ligt bij het parlement; (2) de wetgever kan bredere informatie en belangen betrekken en overgangsproblemen regelen, terwijl rechtersrecht rechtsonzekerheid kan geven.\nIn een formele opvatting van democratie draait het om procedure en meerderheidsbesluitvorming; gelijkheid is gelijkheid van stemmen. Een rechter die een door de meerderheid aangenomen wet opzij zet, past daar niet bij: de columnist heeft vanuit die opvatting gelijk.\nIn een materiële opvatting moet ook de meerderheid grondrechten en minderheden respecteren; gelijkheid is gelijkwaardigheid. Een controlerende rechter die het recht tot betoging beschermt, past daar juist goed bij. De columnist heeft dan geen gelijk: de rechter bewaakt de democratie in plaats van haar te ondermijnen."}
]},
{
id:"nft", title:"De gestolen NFT", w:[5,7,9],
intro:"Thijs dwingt een klasgenoot met bedreiging om hem de inloggegevens van diens digitale wallet te geven. Daarna zet Thijs zelf een digitaal kunstwerk (een NFT) ter waarde van €2.000 over naar zijn eigen wallet. Alleen wie de wallet beheert kan over de NFT beschikken. Het Openbaar Ministerie vervolgt Thijs onder meer voor diefstal (art. 310 Sr), waarvoor vereist is dat een ‘goed’ wordt weggenomen.\n\nThijs' advocaat stelt dat een NFT niets anders is dan een regel code, en dus geen goed.",
parts:[
{l:"a",p:3,q:"Welke vorm van rechtsvinding volgens Wiarda verricht de rechter als hij moet bepalen of een NFT een ‘goed’ is? Motiveer je antwoord.",
c:[{p:1,t:"Gematigd heteronome rechtsvinding."},{p:1,t:"Het bestaande recht (art. 310 Sr en eerdere jurisprudentie zoals Elektriciteit en RuneScape) biedt voldoende houvast."},{p:1,t:"Maar de rechter moet het begrip ‘goed’ nog uitleggen voor dit nieuwe geval: de rechter als vertolker van de wet."}],
m:"Dit is gematigd heteronome rechtsvinding. Het bestaande recht biedt voldoende houvast: art. 310 Sr en eerdere uitspraken over elektriciteit en virtuele voorwerpen. De rechter moet het begrip ‘goed’ wel nog uitleggen en de reikwijdte voor dit nieuwe geval bepalen. Hij is dan de vertolker van de wet, niet iemand die op eigen gezag nieuw recht maakt (autonoom) of mechanisch een duidelijke regel toepast (heteronoom)."},
{l:"b",p:4,q:"Hoe kan de rechter het RuneScape-arrest gebruiken? Noem de criteria uit dat arrest en pas ze toe op de NFT.",
c:[{p:1,t:"Criterium: het voorwerp heeft reële waarde voor de betrokkenen."},{p:1,t:"Criterium: het slachtoffer had feitelijke en exclusieve controle."},{p:1,t:"Criterium: die controle ging door de wegneming verloren."},{p:1,t:"Toepassing: €2.000 waarde, alleen de beheerder van de wallet kon erover beschikken, en na de overdracht is de controle weg. Conclusie: goed."}],
m:"In RuneScape oordeelde de HR dat virtuele voorwerpen een goed kunnen zijn, omdat ze reële waarde hadden voor de spelers, het slachtoffer er feitelijke en exclusieve controle over had en die controle door de wegneming verloor. Een goed hoeft niet tastbaar te zijn.\nToegepast: de NFT is €2.000 waard, alleen de klasgenoot kon er via zijn wallet over beschikken, en door de overdracht verloor hij die controle. Volgens deze criteria is de NFT een goed en kan zij worden ‘weggenomen’."},
{l:"c",p:8,q:"Leg uit wat bedoeld wordt met de open textuur van het recht en met het evolutionaire karakter van het recht. Laat zien hoe beide zichtbaar zijn in de ontwikkeling van het begrip ‘goed’ (van elektriciteit, via RuneScape, naar de NFT). Bespreek ten slotte één kritiekpunt vanuit het legaliteitsbeginsel.",
c:[{p:2,t:"Open textuur: rechtsregels bestaan uit taal; er zijn altijd randgevallen waarbij onduidelijk is of iets onder een begrip valt, en de rechter moet dan de reikwijdte bepalen."},{p:2,t:"Evolutionair karakter (Holmes, Ratnapala): recht ontwikkelt zich mee met de samenleving en ontstaat ook van onderop, buiten de wil van de wetgever om."},{p:2,t:"Toepassing: ‘goed’ is steeds opnieuw uitgelegd voor nieuwe verschijnselen (elektriciteit, virtuele voorwerpen, NFT); de betekenis verandert met de maatschappij, zoals Taverne al schreef."},{p:2,t:"Kritiek: ruime uitleg van strafbepalingen botst met lex certa/voorzienbaarheid en schuurt aan het analogieverbod; bijv. Rozemond: verhouding tot computervredebreuk had (systematisch) moeten worden onderzocht."}],
m:"Open textuur: rechtsregels bestaan uit taal, en taal kent randgevallen waarbij niet duidelijk is of iets binnen een begrip valt. In zulke moeilijke gevallen moet de rechter de reikwijdte van een bepaling vaststellen, waardoor de betekenis ervan door de tijd verandert.\nEvolutionair karakter: het recht ontstaat niet alleen uit wat de wetgever vaststelt, maar ontwikkelt zich mee met de samenleving en ontstaat ook van onderop, buiten de wil van de wetgever om.\nBeide zie je in het begrip ‘goed’: de wetgever dacht aan tastbare zaken, maar de rechter moest steeds beslissen over randgevallen die ontstonden door maatschappelijke en technische ontwikkelingen: elektriciteit (1921), virtuele voorwerpen (RuneScape) en nu NFT's. Zoals Taverne schreef: wat de wet betekent, hangt goeddeels af van wat de maatschappij ervan maakt.\nKritiek: in het strafrecht geldt het legaliteitsbeginsel. Burgers moeten kunnen voorzien wat strafbaar is (lex certa), en de rechter mag strafbaarheid niet via analogie uitbreiden. Rozemond vond bij RuneScape dat de verruiming van ‘goed’ onvoldoende was onderbouwd en dat de verhouding tot computervredebreuk systematisch had moeten worden onderzocht."}
]}
];

window.FLASH = [
// ---------- WEEK 1 ----------
{w:1,q:"Welke twee uitgangspunten combineert een democratische rechtsstaat?",a:"Democratie: burgers hebben invloed op de uitoefening van overheidsmacht.\nRechtsstaat: overheidsmacht is gebonden aan het recht en burgers worden beschermd tegen willekeur.\nKort: de rechtsstaat begrenst de macht, de democratie geeft burgers invloed op die macht."},
{w:1,q:"Wat veranderde de Grondwetsherziening van 1848 (Thorbecke)?",a:"De koning werd onschendbaar en de ministers politiek verantwoordelijk. Het parlement kreeg meer invloed en de Tweede Kamer werd rechtstreeks gekozen (toen nog door een beperkte groep: censuskiesrecht)."},
{w:1,q:"Welke vijf beginselen van de democratische rechtsstaat ken je?",a:"1. Legaliteitsbeginsel\n2. Machtenscheiding\n3. Grondrechten\n4. Onafhankelijke rechtspraak en rechterlijke controle\n5. Democratiebeginsel"},
{w:1,q:"Legaliteitsbeginsel (basis)",a:"De overheid moet handelen volgens het recht. Voor optreden dat burgers bindt of hun vrijheid beperkt is in beginsel een wettelijke bevoegdheid nodig. Een bestuursorgaan mag geen bevoegdheden verzinnen.\nDraagt bij aan rechtszekerheid en rechtsgelijkheid."},
{w:1,q:"De trias politica: welke drie machten en wat doen ze?",a:"Wetgevende macht: algemene regels vaststellen (regering en Staten-Generaal samen).\nUitvoerende macht: wetten uitvoeren en besturen (ministers, gemeentebesturen).\nRechterlijke macht: geschillen beoordelen en rechtspreken (onafhankelijke rechters).\nNederland kent geen volledige scheiding: de machten werken samen en controleren elkaar."},
{w:1,q:"Onafhankelijk vs. onpartijdig (rechter)",a:"Onafhankelijk: de rechter krijgt geen opdrachten over de uitkomst, bijvoorbeeld van een minister.\nOnpartijdig: de rechter trekt geen partij voor een van de betrokkenen.\nArt. 17 Gw: niemand mag tegen zijn wil worden afgehouden van de rechter die de wet hem toekent; ook recht op een eerlijk proces binnen een redelijke termijn."},
{w:1,q:"Democratiebeginsel",a:"Burgers moeten invloed kunnen uitoefenen op politieke besluitvorming, vooral via gekozen vertegenwoordigers.\nActief kiesrecht: stemmen. Passief kiesrecht: gekozen worden.\nOok een meerderheid is gebonden aan rechtsstatelijke grenzen en grondrechten."},
{w:1,q:"De algemene bepaling van de Grondwet",a:"‘De Grondwet waarborgt de grondrechten en de democratische rechtsstaat.’\nToegevoegd in 2022 (niet in 2014)."},
{w:1,q:"Welk beginsel herken je bij welke vraag in een casus?",a:"Mag dit orgaan deze maatregel nemen? → legaliteitsbeginsel\nTe veel macht bij één instantie? → machtenscheiding\nWordt een fundamenteel recht geraakt? → grondrechten\nKan een onafhankelijke rechter het beoordelen? → rechterlijke controle\nHebben burgers via vertegenwoordigers invloed? → democratiebeginsel"},
{w:1,q:"Publiekrecht vs. privaatrecht",a:"Publiekrecht: organisatie van de overheid en haar optreden als overheid (staatsrecht, bestuursrecht, strafrecht). Vb: een vergunning verlenen.\nPrivaatrecht: verhoudingen tussen burgers en bedrijven onderling. Vb: een koopovereenkomst.\nLet op: de overheid kan ook privaatrechtelijk handelen, bijvoorbeeld als een gemeente bureaus koopt."},
{w:1,q:"Staatsrecht vs. bestuursrecht",a:"Staatsrecht: inrichting van de staat, verdeling van overheidsmacht en de verhouding tussen staatsorganen en burgers. Vb: de positie van een minister.\nBestuursrecht: het handelen van het openbaar bestuur, de grenzen daarvan en rechtsbescherming. Vb: hoe een bestuursorgaan over een vergunning beslist."},
{w:1,q:"Vier functies van het staatsrecht",a:"Constitueren: ambten en organen instellen.\nAttribueren: bevoegdheden toekennen.\nReguleren: regels en grenzen stellen aan de uitoefening van bevoegdheden.\nLegitimeren: bijdragen aan de rechtvaardiging en aanvaarding van overheidsmacht."},
{w:1,q:"Drie functies van het bestuursrecht",a:"Instrumentele functie (van het bestuur): juridische middelen om publieke belangen te behartigen.\nNormerende functie (voor het bestuur): regels waaraan het bestuur zich moet houden.\nWaarborgfunctie (tegen het bestuur): bescherming tegen onrechtmatig overheidsoptreden."},
