<!doctype html>
<html lang="nl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Manouks studietrainer</title>
<meta name="robots" content="noindex">
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220 0 64 64%22%3E%3Ccircle cx=%2232%22 cy=%2232%22 r=%2232%22 fill=%22%23bf3f6c%22/%3E%3Ctext x=%2232%22 y=%2244%22 font-size=%2236%22 text-anchor=%22middle%22 fill=%22white%22 font-family=%22Georgia%22%3E%C2%A7%3C/text%3E%3C/svg%3E">
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin><link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Nunito:ital,wght@0,400;0,600;0,700;0,800;1,400&display=swap">
<style>
:root{padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}img{max-width:100%}[hidden]{display:none!important}
/* Layout: rustige studie-app. Links een vaste kolom met navigatie (op telefoon een plakbalk bovenaan), rechts één leeskolom van max. 46rem. Roze als papier-tint en als enige accentkleur; groen/oker/rood alleen voor goed/twijfel/fout. */
:root{
  --paper:#fbf4f6; --surface:#ffffff; --blush:#f7e5ec; --line:#ecd6df;
  --ink:#33202a; --muted:#7b6270; --rose:#bf3f6c; --rose-deep:#93294f; --rose-soft:#f4cddb; --on-rose:#ffffff;
  --good:#2c7a5f; --good-soft:#dcefe6; --warn:#9a6618; --warn-soft:#f6e9d2; --bad:#b4313e; --bad-soft:#f8dde1;
  --shadow:0 1px 2px rgba(80,30,50,.06),0 8px 24px -12px rgba(120,40,70,.18);
  --f-display:"Nunito",system-ui,-apple-system,"Segoe UI",sans-serif;
  --f-body:"Nunito",system-ui,-apple-system,"Segoe UI",sans-serif;
  --f-mono:ui-monospace,SFMono-Regular,Menlo,Consolas,monospace;
  --f-label:"Nunito",system-ui,-apple-system,"Segoe UI",sans-serif;
  --r:14px; --r-sm:10px;
}
@media (prefers-color-scheme: dark){ :root:not([data-theme="light"]){
  --paper:#1c1317; --surface:#261a20; --blush:#33222b; --line:#45303b;
  --ink:#f6e9ef; --muted:#bb9cab; --rose:#f17ca5; --rose-deep:#ffa9c6; --rose-soft:#4b2637; --on-rose:#2a0f1b;
  --good:#71c9a3; --good-soft:#1d3a2f; --warn:#e2b265; --warn-soft:#3b2d17; --bad:#f28d95; --bad-soft:#45222a;
  --shadow:0 1px 2px rgba(0,0,0,.3),0 10px 28px -14px rgba(0,0,0,.6); color-scheme:dark; } }
:root[data-theme="dark"]{
  --paper:#1c1317; --surface:#261a20; --blush:#33222b; --line:#45303b;
  --ink:#f6e9ef; --muted:#bb9cab; --rose:#f17ca5; --rose-deep:#ffa9c6; --rose-soft:#4b2637; --on-rose:#2a0f1b;
  --good:#71c9a3; --good-soft:#1d3a2f; --warn:#e2b265; --warn-soft:#3b2d17; --bad:#f28d95; --bad-soft:#45222a;
  --shadow:0 1px 2px rgba(0,0,0,.3),0 10px 28px -14px rgba(0,0,0,.6); color-scheme:dark; }

*{box-sizing:border-box}
html,body{height:100%}
body{margin:0;background:var(--paper);color:var(--ink);font-family:var(--f-body);font-size:16px;line-height:1.55;-webkit-font-smoothing:antialiased}
button,input,textarea,select{font:inherit;color:inherit}
a{color:var(--rose-deep)}
:focus-visible{outline:2px solid var(--rose);outline-offset:2px;border-radius:6px}
h1,h2,h3{text-wrap:balance;margin:0}
h1{font-family:var(--f-display);font-weight:800;font-size:clamp(2rem,4.5vw,2.7rem);line-height:1.1;letter-spacing:-.02em}
h2{font-family:var(--f-display);font-weight:700;font-size:1.4rem;line-height:1.2;letter-spacing:-.01em}
h3{font-size:1.05rem;font-weight:700}
p{margin:0}
.eyebrow{font-family:var(--f-label);font-weight:700;font-size:.74rem;letter-spacing:.11em;text-transform:uppercase;color:var(--muted)}
.muted{color:var(--muted)}
.small{font-size:.875rem}
.tnum{font-variant-numeric:tabular-nums}

/* ---------- shell ---------- */
.app{display:grid;grid-template-columns:15.5rem minmax(0,1fr);min-height:100%}
.side{position:sticky;top:0;height:100vh;display:flex;flex-direction:column;gap:1.5rem;padding:1.5rem 1rem;border-right:1px solid var(--line);background:var(--paper)}
.brand{display:flex;align-items:center;gap:.75rem;text-decoration:none;color:var(--ink);padding:0 .5rem}
.mark{display:grid;place-items:center;width:2.6rem;height:2.6rem;border-radius:50%;background:var(--rose);color:var(--on-rose);font-family:var(--f-display);font-weight:800;font-size:1.45rem;flex:none}
.brand b{display:block;font-family:var(--f-display);font-weight:800;font-size:1.3rem;line-height:1.1}
.brand small{display:block;color:var(--muted);font-size:.78rem}
.nav{display:flex;flex-direction:column;gap:.15rem}
.nav a{display:flex;align-items:center;gap:.7rem;padding:.55rem .7rem;border-radius:var(--r-sm);text-decoration:none;color:var(--ink);font-size:.95rem}
.nav a svg{width:1.15rem;height:1.15rem;flex:none;color:var(--muted)}
.nav a:hover{background:var(--blush)}
.nav a[aria-current="page"]{background:var(--rose-soft);color:var(--ink);font-weight:700}
.nav a[aria-current="page"] svg{color:var(--rose-deep)}
.side-foot{margin-top:auto;display:flex;flex-direction:column;gap:.5rem;padding:0 .5rem}
.theme-btn{display:inline-flex;align-items:center;gap:.5rem;background:none;border:1px solid var(--line);border-radius:999px;padding:.35rem .8rem;font-size:.82rem;color:var(--muted);cursor:pointer;width:max-content}
.theme-btn:hover{border-color:var(--rose);color:var(--ink)}

.main{min-width:0;padding-block:2.5rem 5rem;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));outline:none}
.wrap{max-width:46rem;margin:0 auto;display:flex;flex-direction:column;gap:2rem}
.wrap.wide{max-width:58rem}

@media (max-width:860px){
  body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);z-index:10;background:var(--paper)}
  .app{grid-template-columns:minmax(0,1fr)}
  .side{position:sticky;top:env(safe-area-inset-top,0px);z-index:5;height:auto;flex-direction:column;gap:.6rem;padding-block:.7rem .5rem;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));border-right:0;border-bottom:1px solid var(--line)}
  .brand{padding:0}
  .mark{width:2.1rem;height:2.1rem;font-size:1.15rem}
  .brand b{font-size:1.1rem}
  .nav{flex-direction:row;overflow-x:auto;gap:.3rem;padding-bottom:.25rem;scrollbar-width:none}
  .nav::-webkit-scrollbar{display:none}
  .nav a{flex:none;padding:.4rem .7rem;font-size:.88rem;border:1px solid var(--line)}
  .nav a svg{display:none}
  .side-foot{position:absolute;right:max(16px,env(safe-area-inset-right,0px));top:.85rem;margin:0;padding:0}
  .side-foot .muted{display:none}
  .main{padding-block:1.5rem 4rem}
}

/* ---------- generic ---------- */
.panel{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:1.4rem;box-shadow:var(--shadow)}
.stack{display:flex;flex-direction:column;gap:1rem}
.row{display:flex;flex-wrap:wrap;gap:.6rem;align-items:center}
.between{justify-content:space-between}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:.45rem;border:1px solid transparent;border-radius:999px;padding:.6rem 1.15rem;font-weight:700;font-size:.95rem;cursor:pointer;text-decoration:none;line-height:1.2;transition:background .15s,border-color .15s,transform .1s}
.btn:active{transform:translateY(1px)}
.btn-primary{background:var(--rose);color:var(--on-rose)}
.btn-primary:hover{background:var(--rose-deep)}
.btn-ghost{background:transparent;border-color:var(--line);color:var(--ink)}
.btn-ghost:hover{border-color:var(--rose);background:var(--blush)}
.btn-link{background:none;border:0;padding:0;color:var(--rose-deep);font-weight:700;cursor:pointer;text-decoration:underline;text-underline-offset:3px}
.btn[disabled]{opacity:.45;cursor:not-allowed}
kbd{font-family:var(--f-mono);font-size:.72rem;border:1px solid var(--line);border-bottom-width:2px;border-radius:5px;padding:0 .3rem;color:var(--muted);background:var(--surface)}

.chips{display:flex;flex-wrap:wrap;gap:.4rem}
.chip{border:1px solid var(--line);background:var(--surface);border-radius:999px;padding:.3rem .75rem;font-size:.85rem;cursor:pointer;color:var(--ink)}
.chip:hover{border-color:var(--rose)}
.chip[aria-pressed="true"]{background:var(--ink);color:var(--paper);border-color:var(--ink)}
.tag{display:inline-block;font-family:var(--f-label);font-weight:700;font-size:.72rem;letter-spacing:.04em;border-radius:6px;padding:.1rem .45rem;background:var(--blush);color:var(--rose-deep)}
.seg{display:inline-flex;border:1px solid var(--line);border-radius:999px;padding:3px;background:var(--surface)}
.seg button{border:0;background:none;border-radius:999px;padding:.3rem .8rem;font-size:.85rem;cursor:pointer;color:var(--muted)}
.seg button[aria-pressed="true"]{background:var(--rose-soft);color:var(--ink);font-weight:700}

.bar{height:.5rem;border-radius:999px;background:var(--blush);overflow:hidden}
.bar > i{display:block;height:100%;background:var(--rose);border-radius:999px;transition:width .4s}
.bar.good > i{background:var(--good)}

.callout{border-radius:var(--r);padding:1rem 1.2rem;background:var(--warn-soft);border:1px solid color-mix(in srgb,var(--warn) 30%,transparent);display:flex;flex-direction:column;gap:.35rem}
.callout b{color:var(--warn)}

/* ---------- start ---------- */
.hello{display:flex;flex-direction:column;gap:.6rem}
.hello .lede{font-size:1.1rem;color:var(--muted);max-width:36rem}
.today{display:grid;grid-template-columns:minmax(0,1.3fr) minmax(0,1fr);gap:1rem}
.today-main{background:var(--rose);color:var(--on-rose);border-radius:var(--r);padding:1.5rem;display:flex;flex-direction:column;gap:.9rem;box-shadow:var(--shadow)}
.today-main .big{font-family:var(--f-display);font-weight:800;font-size:3rem;line-height:1}
.today-main .btn{background:var(--on-rose);color:var(--rose-deep);align-self:flex-start}
.today-main .btn:hover{background:var(--paper)}
.today-side{display:flex;flex-direction:column;gap:.8rem}
.countdown{display:flex;flex-direction:column;gap:.4rem}
.countdown .big{font-family:var(--f-display);font-weight:800;font-size:2.2rem;line-height:1}
.countdown input{border:1px solid var(--line);border-radius:var(--r-sm);padding:.35rem .5rem;background:var(--paper);max-width:100%}
.modes{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:.8rem}
.mode{display:flex;flex-direction:column;gap:.3rem;padding:1.1rem 1.2rem;border:1px solid var(--line);border-radius:var(--r);background:var(--surface);text-decoration:none;color:var(--ink);transition:border-color .15s,transform .15s}
.mode:hover{border-color:var(--rose);transform:translateY(-1px)}
.mode h3{display:flex;align-items:center;gap:.5rem}
.mode h3 svg{width:1.1rem;height:1.1rem;color:var(--rose)}
.mode p{color:var(--muted);font-size:.9rem}
.weeks{display:flex;flex-direction:column}
.wk{display:grid;grid-template-columns:4.2rem minmax(0,1fr) 7rem 7rem;gap:1rem;align-items:center;padding:.75rem 0;border-top:1px solid var(--line)}
.wk:first-child{border-top:0}
.wk .nm{font-family:var(--f-label);font-weight:700;font-size:.78rem;color:var(--muted)}
.wk .tt{font-size:.95rem;min-width:0}
.wk .st{display:flex;flex-direction:column;gap:.25rem;font-size:.75rem;color:var(--muted)}
@media (max-width:640px){
  .today{grid-template-columns:minmax(0,1fr)}
  .modes{grid-template-columns:minmax(0,1fr)}
  .wk{grid-template-columns:3.6rem minmax(0,1fr);row-gap:.4rem}
  .wk .st{grid-column:2}
}

/* ---------- flashcards ---------- */
.toolbar{display:flex;flex-direction:column;gap:.75rem}
.toolbar > .seg{align-self:flex-start;max-width:100%}
.fc{background:var(--surface);border:1px solid var(--line);border-radius:20px;box-shadow:var(--shadow);padding:2rem 2rem 1.6rem;min-height:18rem;display:flex;flex-direction:column;gap:1.2rem;cursor:pointer;position:relative}
.fc::before{content:"";position:absolute;left:2rem;right:2rem;top:0;height:4px;border-radius:0 0 4px 4px;background:var(--rose-soft)}
.fc-meta{display:flex;justify-content:space-between;align-items:center;gap:1rem}
.fc-q{font-family:var(--f-display);font-weight:700;font-size:clamp(1.3rem,3vw,1.65rem);line-height:1.3}
.fc-a{border-top:1px dashed var(--line);padding-top:1.1rem;font-size:1.02rem;animation:rise .25s ease}
.fc-hint{margin-top:auto;color:var(--muted);font-size:.85rem}
.rate{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:.6rem}
.rate button{border-radius:var(--r-sm);padding:.8rem .5rem;border:1px solid var(--line);background:var(--surface);cursor:pointer;font-weight:700;display:flex;flex-direction:column;align-items:center;gap:.15rem}
.rate button small{font-weight:400;color:var(--muted);font-size:.75rem}
.rate .r1:hover{background:var(--bad-soft);border-color:var(--bad)}
.rate .r2:hover{background:var(--warn-soft);border-color:var(--warn)}
.rate .r3:hover{background:var(--good-soft);border-color:var(--good)}
@keyframes rise{from{opacity:0;transform:translateY(4px)}to{opacity:1;transform:none}}
@media (prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}

/* ---------- questions ---------- */
.q{display:flex;flex-direction:column;gap:1.1rem}
.q-text{font-size:1.08rem;line-height:1.6;white-space:pre-line}
.stel{display:flex;flex-direction:column;gap:.5rem;background:var(--blush);border-radius:var(--r-sm);padding:.9rem 1rem}
.stel p{display:grid;grid-template-columns:5.5rem minmax(0,1fr);gap:.5rem}
.stel b{font-family:var(--f-label);font-weight:700;font-size:.78rem;padding-top:.2rem;color:var(--rose-deep)}
.opts{display:flex;flex-direction:column;gap:.55rem;margin:0;padding:0;list-style:none}
.opt{display:grid;grid-template-columns:2rem minmax(0,1fr);gap:.7rem;align-items:start;text-align:left;width:100%;padding:.8rem .95rem;border:1px solid var(--line);border-radius:var(--r-sm);background:var(--surface);cursor:pointer;line-height:1.45}
.opt:hover:not([disabled]){border-color:var(--rose);background:var(--blush)}
.opt .l{display:grid;place-items:center;width:1.75rem;height:1.75rem;border-radius:50%;border:1px solid var(--line);font-family:var(--f-label);font-weight:700;font-size:.8rem;color:var(--muted)}
.opt.sel{border-color:var(--rose);background:var(--blush)}
.opt.sel .l{background:var(--rose);color:var(--on-rose);border-color:var(--rose)}
.opt.ok{border-color:var(--good);background:var(--good-soft)}
.opt.ok .l{background:var(--good);color:var(--surface);border-color:var(--good)}
.opt.no{border-color:var(--bad);background:var(--bad-soft)}
.opt.no .l{background:var(--bad);color:var(--surface);border-color:var(--bad)}
.opt[disabled]{cursor:default}
.explain{border-left:3px solid var(--rose);padding:.2rem 0 .2rem 1rem;display:flex;flex-direction:column;gap:.3rem;animation:rise .25s ease}
.verdict{font-weight:700}
.verdict.good{color:var(--good)} .verdict.bad{color:var(--bad)}
.scoreline{display:flex;gap:1.2rem;font-size:.9rem;color:var(--muted)}
.scoreline b{color:var(--ink)}

/* exam */
.qgrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(2.3rem,1fr));gap:.35rem}
.qgrid button{aspect-ratio:1;max-width:100%;border-radius:8px;border:1px solid var(--line);background:var(--surface);font-family:var(--f-label);font-weight:700;font-size:.78rem;cursor:pointer}
.qgrid button.done{background:var(--rose-soft);border-color:var(--rose-soft)}
.qgrid button.cur{outline:2px solid var(--rose);outline-offset:1px}
.qgrid button.ok{background:var(--good-soft);border-color:var(--good);color:var(--good)}
.qgrid button.no{background:var(--bad-soft);border-color:var(--bad);color:var(--bad)}
.timer{font-family:var(--f-label);font-weight:700;font-size:.9rem;color:var(--muted)}
.result-big{display:flex;align-items:baseline;gap:1rem;flex-wrap:wrap}
.result-big .n{font-family:var(--f-display);font-weight:800;font-size:3.4rem;line-height:1}
.grade{font-family:var(--f-display);font-weight:800;font-size:1.6rem;color:var(--rose-deep)}
.confirm{border:1px solid var(--rose);background:var(--blush);border-radius:var(--r);padding:1rem 1.2rem;display:flex;flex-direction:column;gap:.7rem}
details.rev{border-top:1px solid var(--line);padding:.7rem 0}
details.rev summary{cursor:pointer;display:grid;grid-template-columns:1.6rem minmax(0,1fr);gap:.6rem;align-items:start;list-style:none}
details.rev summary::-webkit-details-marker{display:none}
.dot{width:1.4rem;height:1.4rem;border-radius:50%;display:grid;place-items:center;font-size:.75rem;font-weight:700;color:var(--surface)}
.dot.ok{background:var(--good)} .dot.no{background:var(--bad)}
details.rev .body{padding:.6rem 0 0 2.2rem;display:flex;flex-direction:column;gap:.4rem;font-size:.95rem}
.hist{width:100%;border-collapse:collapse;font-size:.9rem}
.hist th,.hist td{text-align:left;padding:.45rem .5rem;border-bottom:1px solid var(--line)}
.hist th{font-weight:400;color:var(--muted);font-size:.8rem}

/* open questions */
.olist{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:.8rem}
.ocard{text-align:left;display:flex;flex-direction:column;gap:.5rem;padding:1.1rem 1.2rem;border:1px solid var(--line);border-radius:var(--r);background:var(--surface);cursor:pointer}
.ocard:hover{border-color:var(--rose)}
.ocard h3{font-family:var(--f-display);font-weight:800;font-size:1.2rem}
@media (max-width:640px){.olist{grid-template-columns:minmax(0,1fr)}}
.casus{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:1.4rem 1.5rem;display:flex;flex-direction:column;gap:.7rem}
.casus .txt{white-space:pre-line}
.part{display:flex;flex-direction:column;gap:.75rem;padding-top:1.4rem;border-top:1px solid var(--line)}
.part-h{display:flex;justify-content:space-between;align-items:baseline;gap:1rem}
.part-h h3{font-family:var(--f-display);font-weight:800;font-size:1.15rem}
textarea{width:100%;min-height:9rem;resize:vertical;border:1px solid var(--line);border-radius:var(--r-sm);padding:.8rem .9rem;background:var(--surface);line-height:1.55}
textarea:focus{outline:2px solid var(--rose-soft);border-color:var(--rose)}
.wc{font-family:var(--f-label);font-weight:700;font-size:.75rem;color:var(--muted)}
.crit{display:flex;flex-direction:column;gap:.45rem;margin:0;padding:0;list-style:none}
.crit label{display:grid;grid-template-columns:1.3rem minmax(0,1fr) auto;gap:.6rem;align-items:start;padding:.6rem .75rem;border-radius:var(--r-sm);background:var(--blush);cursor:pointer}
.crit input{margin-top:.25rem;accent-color:var(--rose)}
.crit .pt{font-family:var(--f-label);font-weight:700;font-size:.75rem;color:var(--rose-deep);white-space:nowrap}
.model{border-left:3px solid var(--good);padding:.3rem 0 .3rem 1rem;white-space:pre-line;font-size:.97rem}
.model-h{font-weight:700;color:var(--good);font-size:.9rem}
.total{display:flex;justify-content:space-between;align-items:center;gap:1rem;flex-wrap:wrap;padding:1rem 1.2rem;border-radius:var(--r);background:var(--rose-soft)}
.total b{font-family:var(--f-display);font-weight:800;font-size:1.6rem}

/* sprint */
.slist{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:.8rem}
@media (max-width:760px){.slist{grid-template-columns:repeat(2,minmax(0,1fr))}}
@media (max-width:460px){.slist{grid-template-columns:minmax(0,1fr)}}
.sprint-stmt{font-family:var(--f-display);font-weight:700;font-size:clamp(1.2rem,3vw,1.5rem);line-height:1.35;min-height:4.5rem}
.choices{display:flex;flex-wrap:wrap;gap:.5rem}
.choices button{border:1px solid var(--line);background:var(--surface);border-radius:999px;padding:.6rem 1rem;cursor:pointer;font-weight:700}
.choices button:hover:not([disabled]){border-color:var(--rose);background:var(--blush)}
.choices button.ok{background:var(--good);border-color:var(--good);color:var(--surface)}
.choices button.no{background:var(--bad);border-color:var(--bad);color:var(--surface)}

/* naslag */
.search{width:100%;border:1px solid var(--line);border-radius:999px;padding:.7rem 1.1rem;background:var(--surface)}
.tbl-wrap{overflow-x:auto;border:1px solid var(--line);border-radius:var(--r);background:var(--surface)}
.tbl{width:100%;border-collapse:collapse;font-size:.92rem;min-width:32rem}
.tbl th{text-align:left;font-size:.75rem;font-family:var(--f-label);font-weight:700;letter-spacing:.04em;text-transform:uppercase;color:var(--muted);font-weight:400;padding:.7rem .9rem;background:var(--blush)}
.tbl td{padding:.65rem .9rem;border-top:1px solid var(--line);vertical-align:top}

{w:1,q:"Hoe verhouden positief recht en objectief recht zich tot elkaar?",a:"Positief recht is het geldende recht. Objectief recht is de verzameling van alle rechtsregels binnen een rechtsorde, inclusief dat geldende recht.\nZe sluiten elkaar dus niet uit en objectief recht is géén ideaalbeeld."},
{w:1,q:"Art. 3:82 BW: ‘Afhankelijke rechten volgen het recht waaraan zij verbonden zijn.’ Welk soort recht wordt twee keer bedoeld?",a:"Beide keren subjectief recht: het gaat om concrete rechten van iemand (bijv. een hypotheekrecht dat de vordering volgt).\nTip: ‘rechten’ in het BW betekent vaak subjectieve rechten."},
{w:1,q:"Nationaal vs. internationaal recht",a:"Nationaal recht: geldt binnen de rechtsorde van een bepaalde staat (bijv. het Nederlandse strafrecht).\nInternationaal recht: komt voort uit betrekkingen tussen staten en uit internationale organisaties (bijv. een verdrag). Te verdelen in volkenrecht en het recht van internationale organisaties."},
{w:1,q:"Publiekrecht vs. privaatrecht",a:"Publiekrecht: regelt de organisatie en bevoegdheden van de overheid en haar verhouding tot burgers wanneer zij als overheid optreedt (straf-, staats- en bestuursrecht).\nPrivaatrecht: regelt verhoudingen tussen private partijen. Ook de overheid kan als private partij optreden."},
{w:1,q:"Wanneer valt handelen van de overheid onder het privaatrecht?",a:"Als de overheid optreedt zoals een gewone private partij, bijvoorbeeld bij koop, huur of het leveren van spullen tegen betaling (en daarvoor een factuur stuurt)."},
{w:1,q:"Dwingend recht vs. aanvullend recht",a:"Dwingend recht: partijen mogen er niet van afwijken (bijv. geen loon onder het wettelijk minimum afspreken).\nAanvullend recht: geldt voor zover partijen zelf niets anders hebben afgesproken."},
{w:1,q:"Materieel recht vs. formeel recht",a:"Materieel recht: bepaalt welke rechten en plichten bestaan, wat mag, moet en verboden is (bijv. verbod op diefstal).\nFormeel recht (procesrecht): regelt de procedures waarmee het materiële recht wordt toegepast of afgedwongen (bijv. regels over het verloop van een strafproces, termijnen, bevoegdheden in procedures)."},
{w:1,q:"Recht vs. moraal, beleid en politiek",a:"Moraal: ideeën over wat goed, fout en rechtvaardig is.\nBeleid: de doelen die bijvoorbeeld de overheid wil bereiken en de aanpak daarvoor.\nPolitiek: keuzes over hoe de samenleving moet worden ingericht.\nKernvraag: moet een geldende regel altijd worden toegepast, ook als de uitkomst onrechtvaardig lijkt?"},

// ---------- WEEK 2 ----------
{w:2,q:"Welke drie rechtsfilosofische stromingen zijn er en bij welke kernwaarde hoort elk?",a:"Rechtspositivisme: rechtszekerheid\nNatuurrecht: rechtvaardigheid\nRechtsrealisme: doelmatigheid"},
{w:2,q:"Kern van het rechtspositivisme (week 2)",a:"Bij toepassing van het recht moeten geldende rechtsregels en persoonlijke morele opvattingen van elkaar worden onderscheiden.\nKernwaarde: rechtszekerheid (duidelijkheid, voorspelbaarheid, vaste regels)."},
{w:2,q:"Kern van het natuurrecht (week 2)",a:"Er bestaan hogere, ongeschreven normen en waarden waaraan het geschreven recht moet worden getoetst.\nKernwaarde: rechtvaardigheid."},
{w:2,q:"Kern van het rechtsrealisme (week 2)",a:"Kijk naar hoe het recht in de praktijk werkt, met aandacht voor omstandigheden en maatschappelijke gevolgen.\nKernwaarde: doelmatigheid."},
{w:2,q:"De casus van de grotverkenners in het kort",a:"Vijf grotverkenners zitten opgesloten en dreigen te sterven. Ze dobbelen wie wordt opgeofferd. Whetmore, die zich uit de afspraak wilde terugtrekken, wordt gedood.\nRechtsvraag: moeten de overlevenden wegens moord worden veroordeeld?"},
{w:2,q:"Truepenny",a:"Volgens de wet zijn ze schuldig. Hij steunt de veroordeling, maar bepleit strafvermindering (gratie) door het bestuur.\nUitkomst: veroordelen."},
{w:2,q:"Foster",a:"Natuurrecht en rechtvaardigheid. Twee argumenten:\n1. Het gewone recht geldt niet: in de grot was samenleven onmogelijk, ze zaten in een natuurtoestand.\n2. De letter van de wet is niet doorslaggevend: je kunt de letter schenden zonder het recht te schenden (vergelijk zelfverdediging).\nUitkomst: vrijspreken."},
{w:2,q:"Tatting",a:"Twijfels en tegenstrijdigheden. Kritiek op Foster: wanneer begon de natuurtoestand? Waarom zou een afspraak over opofferen bindend zijn? Hoe verhoudt toepassing zich tot het doel van de wet? Ook: tien reddingswerkers kwamen om.\nUitkomst: onthoudt zich van een uitspraak."},
{w:2,q:"Keen",a:"Rechtspositivisme en rechtszekerheid. Strikte scheiding tussen persoonlijke mening en taak als rechter: de rechter past het geldende recht toe, respecteert de taken van wetgever en bestuur. Gratie is een beslissing van het bestuur; hij bekritiseert Truepenny voor het vragen om gratie, want de rechter hoort zich niet met de uitvoerende macht te bemoeien.\nUitkomst: veroordelen."},
{w:2,q:"Handy",a:"Rechtsrealisme en doelmatigheid. De zaak is een praktisch en menselijk probleem. Recht moet aansluiten bij de werkelijkheid; goed bestuur houdt rekening met de opvattingen van de bevolking (peiling: 90% wil vrijspraak).\nUitkomst: vrijspreken."},
{w:2,q:"Welke grotverkenner-rechters spreken vrij, welke veroordelen?",a:"Vrijspreken: Foster en Handy.\nVeroordelen: Truepenny (met verzoek om strafvermindering) en Keen.\nGeen uitspraak: Tatting."},
{w:2,q:"Hoe onderbouw je een eigen standpunt in de grotverkenners-casus?",a:"Maak een keuze en verdedig die met argumenten uit de casus.\nVoor veroordeling: rechtszekerheid, rechter mag eigen moraal niet boven de wet stellen.\nVoor vrijspraak: extreme omstandigheden, toepassing moet passen bij het doel van de wet.\nTussenpositie: veroordelen, maar strafvermindering door het bestuur.\nBespreek ook een tegenargument: welke kernwaarde komt onder druk?"},
{w:2,q:"Wat zijn antinomieën?",a:"Spanningen tussen de kernwaarden rechtszekerheid, rechtvaardigheid en doelmatigheid. Een vaste regel geeft duidelijkheid, maar kan in een bijzonder geval onrechtvaardig uitpakken. Geen enkele waarde heeft altijd voorrang."},
{w:2,q:"Van Hese/De Schelde: feiten en oordeel",a:"Van Hese werkte met asbest en kreeg pas tientallen jaren later mesothelioom; de 30-jarige verjaringstermijn was verstreken.\nHR: een beroep op verjaring kan onder bijzondere omstandigheden naar maatstaven van redelijkheid en billijkheid onaanvaardbaar zijn. Afweging per geval, geen algemene uitzondering voor asbestclaims."},
{w:2,q:"Welke spanning laat Van Hese/De Schelde zien?",a:"Rechtszekerheid (oude claims moeten eindigen) tegenover rechtvaardigheid (het slachtoffer kon de schade niet eerder ontdekken).\nVerband met rechtsrealisme: de rechter kijkt naar concrete omstandigheden en gevolgen."},

// ---------- WEEK 3 ----------
{w:3,q:"Wat is de kern van het rechtspositivisme (week 3)?",a:"De vraag wat geldend recht is, moet worden onderscheiden van de vraag of dat recht moreel juist is. Voor geldigheid telt vooral de herkomst: is de regel volgens de erkende procedure vastgesteld of erkend?\nEen onrechtvaardige inhoud maakt een regel dus niet automatisch ongeldig."},
{w:3,q:"Beschrijvend vs. normatief rechtspositivisme",a:"Beschrijvend: beschrijft wat geldend recht is; of je het moet gehoorzamen staat daar los van.\nNormatief: gaat over hoe men zich tegenover het geldende recht behoort te gedragen, met nadruk op het volgen van de wet."},
{w:3,q:"‘Onrechtvaardig recht is geen recht.’ Bij welke stroming hoort dit?",a:"Bij het natuurrecht. Niet bij het rechtspositivisme! (Je aantekeningen zijn hier tegenstrijdig, dus let op.)"},
{w:3,q:"Juridisch formalisme",a:"Ziet het recht als een gesloten en volledig systeem. Door regels logisch op feiten toe te passen volgt steeds één juiste uitkomst. Morele en beleidsmatige overwegingen spelen geen rol."},
{w:3,q:"Wat bedoelt Hart met ‘open textuur’?",a:"Taal is niet altijd duidelijk en de wetgever kan niet iedere situatie voorzien. Daardoor ligt de toepassing van een rechtsregel niet voor ieder geval vast: er zijn randgevallen. In moeilijke gevallen heeft de rechter beoordelingsruimte en kan hij recht vormen.\nRechtspositivisme betekent dus niet dat de rechter altijd mechanisch de letter van de wet toepast."},
{w:3,q:"Primaire regels (Hart)",a:"Regels die rechtstreeks het gedrag van mensen regelen. Bijv. verbod op doodslag en mishandeling, bescherming van eigendom, regels die samenwerking en uitwisseling mogelijk maken."},
{w:3,q:"Secundaire regels (Hart): welke drie problemen lossen ze op?",a:"Onzekerheid (welke regels gelden?) → herkenningsregel\nVerandering (regels passen niet meer) → veranderingsregels\nHandhaving (wie beslist over overtredingen en geschillen?) → handhavingsregels"},
{w:3,q:"Herkenningsregel",a:"Geeft criteria om geldend recht te herkennen. Kijkt doorgaans naar de herkomst van een regel, niet naar de morele inhoud.\nVoorbeeld: art. 81 Gw (wetten worden door regering en Staten-Generaal gezamenlijk vastgesteld)."},
{w:3,q:"Veranderingsregels",a:"Bepalen wie regels mag invoeren, wijzigen of afschaffen en volgens welke procedure.\nIn de oefentoets golden als veranderingsregel o.a.: art. 81 Gw (wetgeving), art. 147 lid 1 Gemeentewet (gemeentelijke verordeningen worden door de raad vastgesteld) en art. 6:213 BW (overeenkomst: partijen veranderen zelf hun rechtsverhouding).\nGeen veranderingsregel: art. 6:162 BW (onrechtmatige daad), dat is een primaire regel."},
{w:3,q:"Handhavingsregels",a:"Regelen wie bevoegd is om geschillen te beoordelen en regels te handhaven. Belangrijk: verbod op eigenrichting, instelling van een rechterlijke macht en uitvoering van rechterlijke uitspraken."},
{w:3,q:"Hoe ziet Hart de verhouding tussen recht en moraal?",a:"De geldigheid van een wet is onafhankelijk van haar moraliteit. Iets kan illegaal zijn en toch moreel juist worden geacht (en andersom).\nNiet: ‘een immorele wet is geen wet’ (natuurrecht) en ook niet ‘alle wetten zijn automatisch moreel juist’."},
{w:3,q:"Wat kan het recht volgens je stof mogelijk maken? (3)",a:"1. Vreedzaam samenleven (geschillen door bevoegde instanties opgelost)\n2. Individuele projecten (afspraken en verbintenissen)\n3. Collectieve projecten (de overheid realiseert gezamenlijke doelen)"},
{w:3,q:"Kenmerken van het klassieke natuurrecht",a:"Recht moet rechtvaardig zijn; hogere morele beginselen gaan boven het geschreven recht; deze beginselen zijn ongeschreven maar via de menselijke rede te achterhalen; een onrechtvaardige wet kan haar aanspraak om als recht te gelden verliezen."},
{w:3,q:"Natuurrecht en legitimiteit: wat klopt wel en wat niet?",a:"Wel: de legitimiteit van een rechtsregel hangt af van hoe die regel zich verhoudt tot hogere morele regels.\nNiet: ‘hogere morele normen moeten door de rechter worden toegepast om rechtsregels legitimiteit te verschaffen.’ De legitimiteit volgt uit de verhouding tot hogere normen, niet uit een handeling van de rechter."},
{w:3,q:"Thomas van Aquino",a:"Verbindt de geldigheid van wetten aan hogere morele principes (klassiek natuurrecht)."},
{w:3,q:"Antigone",a:"Begraaft haar broer ondanks een wettelijk verbod en beroept zich op hogere, goddelijke regels. Voorbeeld van natuurrecht: een beroep op hogere waarden om een geschreven regel af te wijzen."},
{w:3,q:"De Radbruch-formule",a:"Positief recht heeft in beginsel voorrang, ook als het onrechtvaardig is (want het biedt rechtszekerheid). Maar bij een onverdraaglijk grote tegenstelling met de rechtvaardigheid moet het wijken.\nDaarnaast: een wet mist haar rechtskarakter als de wetgever bewust het streven naar rechtvaardigheid loslaat (gelijke behandeling, verbod op willekeur)."},
{w:3,q:"Radbruch herkennen in een casus",a:"Een wet is geldig tot stand gekomen maar veroorzaakt extreem onrecht. Vraag: moet de rechtszekerheid wijken? Niet gewone onrechtvaardigheid, maar de ernst van het onrecht is doorslaggevend.\nContext: kritiek na WOII op Duitse juristen tegenover de naziwetgeving."},
{w:3,q:"Dworkin",a:"Antipositivist: recht is meer dan regels waarvan alleen de herkomst telt. Recht bestaat uit regels én rechtsbeginselen. Als een regel geen duidelijk antwoord geeft, blijft de rechter gebonden aan rechtsbeginselen. Bij open normen (bijv. ‘onmenselijke behandeling’) is morele argumentatie nodig om te bepalen wat het recht inhoudt."},
{w:3,q:"Wat is antipositivisme?",a:"De opvatting dat je niet alleen naar de herkomst van rechtsregels kunt kijken om te bepalen wat recht is. Ook morele beginselen zoals rechtvaardigheid en eerlijkheid spelen een rol."},
{w:3,q:"Radbruch en Dworkin zitten allebei ‘tussen’ natuurrecht en positivisme. Wat is het verschil?",a:"Dworkin: rechtvaardigheid zit in het recht zelf besloten (via de rechtsbeginselen die deel van het recht zijn).\nRadbruch: rechtvaardigheid zit niet noodzakelijk in het recht; onrechtvaardig positief recht is in beginsel gewoon recht, behalve bij onverdraaglijk onrecht."},
{w:3,q:"Hart, Radbruch, Dworkin in één zin",a:"Hart: recht = primaire + secundaire regels; open textuur.\nRadbruch: positief recht gaat voor, behalve bij extreem onrecht.\nDworkin: morele argumentatie speelt een rol bij het bepalen van het recht (regels én beginselen)."},

// ---------- WEEK 4 ----------
{w:4,q:"Wat is rechtsrealisme?",a:"Een verzameling denkers die onderzoeken hoe het recht daadwerkelijk in de samenleving functioneert. Alleen rechtsregels bestuderen is onvoldoende. Ze bekritiseren het juridisch formalisme."},
{w:4,q:"Law in the books vs. law in action",a:"Law in the books: het recht zoals het in wetten en juridische teksten staat.\nLaw in action: het recht zoals het daadwerkelijk wordt toegepast en werkt in de samenleving."},
{w:4,q:"Vijf kenmerken van het rechtsrealisme",a:"1. Recht in maatschappelijke context\n2. Regelscepsis\n3. De persoon van de rechter (persoonlijke, morele, beleidsmatige opvattingen tellen mee)\n4. Sociale wetenschappen gebruiken\n5. Instrumentalisme: recht als middel om maatschappelijke doelen te bereiken"},
{w:4,q:"Hoe beïnvloeden recht en samenleving elkaar?",a:"In beide richtingen. De samenleving beïnvloedt het recht (recht reageert op problemen, gewoonten en verwachtingen). Het recht beïnvloedt de samenleving (regels sturen gedrag). Recht kan achterlopen op maatschappelijke ontwikkelingen."},
{w:4,q:"Holmes: wat is recht?",a:"Een voorspelling van wat rechters zullen beslissen. Recht ontwikkelt zich door ervaring en maatschappelijke veranderingen; rechters vormen ook recht; logica verklaart een uitspraak niet volledig; rechters moeten letten op maatschappelijke gevolgen."},
{w:4,q:"Bad man theory (Holmes) en de kritiek erop",a:"Bekijk het recht vanuit iemand die alleen wil weten: welke gevolgen krijg ik als ik dit doe? (boetes, aansprakelijkheid), niet of het moreel juist is.\nKritiek: veel mensen volgen het recht juist omdat ze het als bindende norm zien; recht heeft ook buiten de rechtszaal betekenis en omvat meer dan sancties."},
{w:4,q:"Regelscepsis vs. feitenscepsis",a:"Regelscepsis: onzekerheid over betekenis en toepassing van regels. Aandacht vooral voor uitspraken van hogere rechters.\nFeitenscepsis: onzekerheid over wat er precies gebeurd is en hoe feiten worden vastgesteld. Aandacht vooral voor procedures bij feitenrechters.\nRegelscepsis betekent niet dat regels waardeloos zijn."},
{w:4,q:"Llewellyn: dubbele functie van rechtsregels",a:"Regels bieden stabiliteit en rechtszekerheid én laten ruimte voor rechtvaardige resultaten en reactie op veranderende omstandigheden. Om een regel te begrijpen onderzoek je eerdere uitspraken: patronen leiden tot voorspellingen."},
{w:4,q:"Llewellyn: tijdelijke scheiding tussen recht en moraal",a:"Eerst onderzoek je wat rechters daadwerkelijk doen, zonder je eigen morele oordeel. Daarna beoordeel je hoe het recht verbeterd zou moeten worden."},
{w:4,q:"Grand style (Llewellyn)",a:"Rechters nemen eerdere uitspraken serieus maar volgen ze niet blind. Ze kijken naar het doel en de achterliggende reden van een regel. Aanpassing kan, mits goed gemotiveerd."},
{w:4,q:"Amerikaans, Scandinavisch en nieuw rechtsrealisme",a:"Amerikaans: verschil tussen recht op papier en in de praktijk, veel aandacht voor rechterlijke beslissingen.\nScandinavisch: recht wetenschappelijk verklaren, o.a. vanuit de psychologische invloed van regels en instituties.\nNieuw: ook gevolgen van recht voor individuen en maatschappelijke problemen; combineert onderzoeksmethoden; vult juridische kennis aan met sociaalwetenschappelijke kennis (vervangt haar niet)."},
{w:4,q:"Rechtspositivisme vs. rechtsrealisme: overeenkomst en verschil",a:"Overeenkomst: allebei onderscheiden het recht zoals het is van het recht zoals het zou moeten zijn.\nVerschil in nadruk: positivisme op erkende regels en hun herkomst; realisme op de feitelijke werking en toepassing van recht."},
{w:4,q:"Kritiek op het rechtsrealisme",a:"Veel ruimte voor persoonlijke afwegingen en aanpassing kan ten koste gaan van rechtszekerheid, voorspelbaarheid en gelijke behandeling."},
{w:4,q:"Opvolgers van het rechtsrealisme (gastcollege Mingelen, volgens de oefentoets)",a:"Wél opvolgers: Legal Feminism, Law & Political Economy, Law & Economics.\nNiet als opvolger gezien: Law & Literature.\n(Check dit nog even in je collegeaantekeningen.)"},

// ---------- WEEK 5 ----------
{w:5,q:"Wat is jurisprudentie?",a:"Het geheel van rechterlijke uitspraken. Hieruit blijkt hoe rechters rechtsregels uitleggen en toepassen."},
{w:5,q:"De civiele rechtsgang: drie instanties",a:"Rechtbank: eerste aanleg, beoordeelt de zaak voor het eerst.\nGerechtshof: hoger beroep, beoordeelt feiten én recht opnieuw.\nHoge Raad: cassatie, controleert rechtstoepassing en naleving van procesregels. Stelt de feiten niet opnieuw vast."},
{w:5,q:"Cassatiegronden",a:"Schending van het recht en verzuim van vormen."},
{w:5,q:"Dagvaardingsprocedure bij de rechtbank: partijen en uitspraak",a:"Eiser en gedaagde. Uitspraak: vonnis."},
{w:5,q:"Hoger beroep (dagvaarding): partijen en uitspraak",a:"Appellant (stelt hoger beroep in) en geïntimeerde. Uitspraak: arrest."},
{w:5,q:"Cassatie (dagvaarding): partijen en uitspraak",a:"Eiser tot cassatie en verweerder in cassatie. Uitspraak: arrest."},
{w:5,q:"Verzoekschriftprocedure: partijen en uitspraak",a:"Verzoeker en verweerder (in cassatie: verzoeker tot cassatie). Uitspraak: beschikking."},
{w:5,q:"Wat behandelt de kantonrechter?",a:"Onder andere geldvorderingen tot en met €25.000 en huur- en arbeidszaken. Andere civiele zaken gaan naar de overige civiele rechter van de rechtbank."},
{w:5,q:"Kort geding",a:"Een procedure voor spoedeisende zaken."},
{w:5,q:"Cassatiemiddel",a:"Een juridische klacht waarmee een partij vernietiging van de bestreden uitspraak probeert te bereiken."},
{w:5,q:"Rechtsoverwegingen vs. dictum",a:"Rechtsoverwegingen: de redenering waarmee de rechter zijn oordeel onderbouwt.\nDictum: de uiteindelijke beslissing."},
{w:5,q:"Conclusie van de P-G of A-G",a:"Een advies aan de Hoge Raad; de HR is er niet aan gebonden. De conclusie komt vóór het arrest, dus je vindt er nooit de overwegingen van de HR in die zaak in. Wel bijvoorbeeld de feiten, het procesverloop, de argumenten van partijen en het oordeel van het hof."},
{w:5,q:"Annotatie (noot)",a:"Rechtswetenschappelijk commentaar van een deskundige bij een uitspraak. Is niet het oordeel van de Hoge Raad."},
{w:5,q:"Opbouw van een arrest van de Hoge Raad",a:"1. Het geding in feitelijke instanties (procedure bij lagere rechters)\n2. Het geding in cassatie\n3. Beoordeling van het middel (redenering van de HR)\n4. Beslissing (het dictum)\nVraag je steeds af: wie is hier aan het woord?"},
{w:5,q:"Stappenplan: de kern uit een arrest halen",a:"Partijen en procedure → feiten → procesverloop → rechtsvraag → cassatiemiddel → oordeel en motivering → dictum en betekenis."},
{w:5,q:"Strafrecht: wie staan tegenover elkaar?",a:"Het Openbaar Ministerie (officier van justitie) tegenover de verdachte, eventueel met raadsman. Eenvoudige zaken: enkelvoudige kamer; zware zaken: meervoudige kamer. Tegen hoger beroep staat cassatie open."},
{w:5,q:"Bestuursrecht: de gebruikelijke route",a:"Besluit → bezwaar (bij hetzelfde bestuursorgaan, dat heroverweegt) → beroep bij de rechtbank → hoger beroep (vaak Afdeling bestuursrechtspraak van de Raad van State).\nBij spoed: voorlopige voorziening."},
{w:5,q:"Rechtsgangverwijzing",a:"Informatie in een besluit over waar en hoe je ertegen kunt opkomen."},
{w:5,q:"EHRM",a:"Europees Hof voor de Rechten van de Mens: beoordeelt klachten over schendingen van rechten uit het EVRM. De klacht richt zich tegen een staat."},
{w:5,q:"Onwaardige deelgenoot: feiten en oordeel",a:"Man trouwt een vermogende vrouw in algehele gemeenschap en vermoordt haar kort daarna.\nOordeel: in zeer uitzonderlijke omstandigheden kan de wettelijke verdeling bij helft naar maatstaven van redelijkheid en billijkheid onaanvaardbaar zijn. Huwelijk en gemeenschap bestonden wel; het ging om het uitoefenen van zijn aanspraak."},
{w:5,q:"Onwaardige deelgenoot: hoe verschilt de motivering van de HR van die van het hof?",a:"Het hof legde algemene rechtsbeginselen ten grondslag. De HR benadrukt dat al op basis van redelijkheid en billijkheid de aanspraken moeten worden ontzegd; algemene rechtsbeginselen spelen slechts een ondersteunende rol."},
{w:5,q:"Catoochi (Ruiz/Gomez)",a:"Gomez won bij een wettelijk verboden loterij; Ruiz wilde het beslag laten opheffen.\nOordeel: strijd met een wettelijk verbod betekent niet zonder meer nietigheid. Maatschappelijke aanvaarding en gedogen door de overheid mochten meewegen."},
{w:5,q:"RuneScape",a:"Jongens dwongen een speler met geweld virtuele voorwerpen over te dragen.\nRechtsvraag: is een virtueel voorwerp een ‘goed’ (art. 310 Sr)?\nOordeel: ja. Reële waarde voor spelers, feitelijke en exclusieve controle, verloren door wegneming. Een goed hoeft niet tastbaar te zijn."},
{w:5,q:"Totstandkoming van een wet: de fasen",a:"Voorbereiding (ministerie, memorie van toelichting) → advies Raad van State → Tweede Kamer → Eerste Kamer → bekrachtiging (Koning + minister/staatssecretaris: contraseign) → bekendmaking in het Staatsblad → inwerkingtreding."},
{w:5,q:"Recht van amendement",a:"De Tweede Kamer kan een wetsvoorstel wijzigen. De Eerste Kamer heeft dit recht niet."},
{w:5,q:"Initiatiefwetsvoorstel",a:"Een wetsvoorstel ingediend door een of meer Tweede Kamerleden."},
{w:5,q:"Memorie van toelichting",a:"Uitleg van de achtergrond en de gemaakte keuzes bij een wetsvoorstel. Bruikbaar bij wetsinterpretatie (wetshistorisch)."},
{w:5,q:"Kamerstukken vs. Handelingen",a:"Kamerstukken: schriftelijke parlementaire documenten.\nHandelingen: verslagen van de mondelinge behandeling."},

// ---------- WEEK 6 ----------
{w:6,q:"Wat zijn rechtsbronnen en welke vijf zijn het belangrijkst?",a:"Bronnen waaruit rechtsregels voortkomen of waarin zij worden erkend. Belangrijk is vooral de herkomst van de regel.\nVijf: wetten, verdragen, jurisprudentie, gewoonterecht, rechtsbeginselen."},
{w:6,q:"Gelding vs. legitimiteit",a:"Gelding: maakt een regel deel uit van het geldende recht?\nLegitimiteit: waarom wordt het gezag van die regel aanvaard of gerechtvaardigd?"},
{w:6,q:"Is gewoonte een formele rechtsbron in het internationale recht?",a:"Ja. Internationaal gewoonterecht is een erkende rechtsbron van het volkenrecht (naast verdragen). De stelling ‘gewoonte is in het internationale recht geen formele rechtsbron, maar wel in het nationale recht’ is dus onjuist."},
{w:6,q:"Kenbronnen",a:"Maken het recht toegankelijk, bijv. Staatsblad, Tractatenblad, Staatscourant en gemeentebladen."},
{w:6,q:"Wet in formele zin",a:"Kijkt naar de herkomst: vastgesteld door regering en Staten-Generaal gezamenlijk (art. 81 Gw)."},
{w:6,q:"Wet in materiële zin",a:"Kijkt naar de inhoud: een algemeen verbindend voorschrift.\n1. Externe werking (werkt naar buiten)\n2. Algemene regels (algemeen omschreven groep, herhaalbare gevallen)\n3. Afkomstig van bevoegd gezag (regelgevende bevoegdheid)\nEen regeling kan beide zijn. De titel ‘wet’ of ‘besluit’ zegt niets: kijk naar maker én inhoud."},
{w:6,q:"Wat is nodig voor gelding van wetgeving?",a:"Vaststelling door bevoegd gezag, bekendmaking vóór inwerkingtreding, en de verhouding tot andere rechtsregels (voorrangsregels)."},
{w:6,q:"De drie voorrangsregels",a:"Lex superior: hoger recht gaat voor lager recht.\nLex specialis: een bijzondere regel gaat voor een algemene regel.\nLex posterior: een nieuwere regel gaat voor een oudere."},
{w:6,q:"Mag de Nederlandse rechter wetten aan elkaar toetsen?",a:"Ja, op grond van de voorrangsregels (lex superior, specialis, posterior). Wat niet mag: wetten in formele zin toetsen aan de Grondwet (art. 120 Gw)."},
{w:6,q:"Attributie vs. delegatie",a:"Attributie: een nieuwe bevoegdheid wordt gecreëerd en aan een orgaan toegekend.\nDelegatie: een bestaande bevoegdheid wordt overgedragen aan een ander orgaan."},
{w:6,q:"Privatieve werking",a:"Zolang de delegatie bestaat, oefent de oorspronkelijke bevoegdheidsdrager de overgedragen bevoegdheid niet zelf uit."},
{w:6,q:"Gelede normstelling",a:"De formele wetgever stelt hoofdlijnen vast, lagere regelgevers werken die uit.\nVoordeel: flexibiliteit, snellere aanpassing.\nNadeel: minder directe democratische invloed op de uitwerking.\n‘Bij of krachtens de wet’ en de woorden ‘regels’, ‘regelen’ en ‘regelingen’ in de Grondwet laten ruimte voor delegatie."},
{w:6,q:"Wat is een verdrag?",a:"Een overeenkomst tussen staten, tussen staten en internationale organisaties, of tussen internationale organisaties onderling. Stappen: ondertekening, ratificatie, bekendmaking (bekendmaking en inwerkingtreding zijn aparte stappen)."},
{w:6,q:"Art. 93 Gw",a:"Verdragsbepalingen die naar hun inhoud eenieder kunnen verbinden, hebben verbindende kracht nadat zij zijn bekendgemaakt."},
{w:6,q:"Art. 94 Gw",a:"Nationale wettelijke voorschriften blijven buiten toepassing als toepassing strijdig is met eenieder verbindende bepalingen van verdragen of besluiten van volkenrechtelijke organisaties.\nNiet iedere verdragsbepaling heeft deze werking."},
{w:6,q:"Jurisprudentie als rechtsbron: wat kunnen rechters ermee?",a:"Open normen invullen, geschreven regels beoordelen en waar toegestaan buiten toepassing laten, nieuwe rechtsregels ontwikkelen.\nEen uitspraak bindt in beginsel alleen de partijen, maar gelijke gevallen moeten gelijk worden behandeld: dat geeft verwachtingen, rechtszekerheid en richting."},
{w:6,q:"Gewoonterecht: twee voorwaarden",a:"Usus: een bestendige gedragspraktijk binnen een gemeenschap.\nOpinio iuris: de overtuiging dat die handelwijze juridisch behoort te worden gevolgd.\nGrond voor erkenning: gerechtvaardigde verwachtingen."},
{w:6,q:"Kan gewoonterecht alleen door de Hoge Raad worden erkend?",a:"Nee. Gewoonterecht ontstaat in de samenleving (usus + opinio iuris) en kan op meerdere manieren erkend worden, bijv. ook doordat de wetgever ernaar verwijst. Stelling ‘alleen de HR’ is dus onjuist."},
{w:6,q:"Catoochi en gewoonterecht: aanvullende of derogerende werking?",a:"Niet aanvullend. In Catoochi ging de maatschappelijke aanvaarding juist in tegen het wettelijk verbod: de regel dat strijd met de wet tot nietigheid leidt, werd opzij gezet. Dat heet derogerende werking."},
{w:6,q:"Wat zijn rechtsbeginselen? Geef voorbeelden.",a:"Waarden en uitgangspunten die aan het recht ten grondslag liggen. Geschreven of ongeschreven.\nVb: gelijke gevallen gelijk behandelen; niemand mag profiteren van eigen onrechtmatig handelen; geen straf zonder schuld; beginselen van behoorlijk bestuur."},
{w:6,q:"Rechtsregels vs. rechtsbeginselen",a:"Rechtsregels: alles-of-niets-karakter.\nRechtsbeginselen: geven richting en hebben gewicht. Bij botsing worden ze afgewogen; het minder zwaar wegende beginsel blijft wel bestaan."},
{w:6,q:"Vier functies van rechtsbeginselen",a:"1. Geschreven regels helpen uitleggen\n2. Leemten aanvullen\n3. Argumenten voor of tegen een oplossing bieden\n4. Onder omstandigheden tegen een rechtsregel inwerken: derogerende werking"},
{w:6,q:"Door wie kan een rechtsbeginsel worden erkend?",a:"Zowel door de wetgever (codificatie: vastleggen in wet of verdrag) als in de jurisprudentie."},
{w:6,q:"Witteveen: erkende rechtsbeginselen vs. achtergrondbeginselen",a:"Erkende rechtsbeginselen: gecodificeerd (vastgelegd).\nAchtergrondbeginselen: meer fundamentele normen van rechtvaardigheid die niet letterlijk in de wet zijn vastgelegd."},
{w:6,q:"Dworkin, Alexy, Scholten, Nieuwenhuis over rechtsbeginselen",a:"Dworkin: beginselen helpen problemen oplossen en worden bij botsing afgewogen.\nAlexy: beginselen zijn optimaliseringsgeboden (zo veel mogelijk realiseren).\nScholten: beginselen zijn de achterliggende gemeenschappelijke gedachten van rechtsregels.\nNieuwenhuis: beginselen kunnen het recht helpen veranderen als de samenleving verandert."},
{w:6,q:"Idealia en realia",a:"Idealia: waarden en idealen.\nRealia: maatschappelijke werkelijkheid en praktische belangen.\nBeide spelen een rol bij rechtsbeginselen."},
{w:6,q:"Art. 120 Gw en het Harmonisatiewet-arrest",a:"Art. 120 Gw: de rechter mag wetten in formele zin niet toetsen aan de Grondwet.\nHarmonisatiewet-arrest: ook niet aan het Statuut en ongeschreven rechtsbeginselen.\nWel mogelijk: toetsing aan eenieder verbindende verdragsbepalingen (art. 94 Gw)."},
{w:6,q:"Rechtsbronnen per stroming",a:"Rechtspositivisme: herkomst en erkenning (ook beginselen kunnen juridisch erkend worden).\nNatuurrecht: inhoudelijke rechtvaardigheid.\nRechtsrealisme: maatschappelijke werking.\nDworkin: morele beginselen zijn nodig om het recht vast te stellen.\nInteractionisme: hoe beginselen in de praktijk worden gebruikt, aanvaard en afgewogen."},

// ---------- WEEK 7 ----------
{w:7,q:"Rechtsvinding, rechtsvorming en motivering",a:"Rechtsvinding: vaststellen welke rechtsnorm voor een concreet geval geldt.\nRechtsvorming: het recht ontwikkelen of veranderen door een rechterlijke beslissing.\nMotivering: uitleggen waarom de rechter tot zijn beslissing komt."},
{w:7,q:"Feitenprobleem vs. rechtsvindingsprobleem",a:"Feitenprobleem: wat is er gebeurd?\nRechtsvindingsprobleem: wat betekent het recht en hoe pas je het toe?"},
{w:7,q:"Wiarda: heteronome rechtsvinding",a:"De rechter past een duidelijke rechtsregel toe op de vastgestelde feiten. Weinig eigen afweging: de rechter als ‘spreekbuis van de wet’ (Montesquieu)."},
{w:7,q:"Wiarda: gematigd heteronome rechtsvinding (LET OP)",a:"Het bestaande recht biedt voldoende houvast, maar de rechter moet de regel nog uitleggen of invullen. De rechter is de vertolker van de wet.\nDoorslaggevend is hoeveel houvast het bestaande recht biedt. Volgens het antwoordmodel is het invullen van goed werkgeverschap (art. 7:611 BW) of het interpreteren van een rechtsregel gematigd heteronoom: de wet geeft daar genoeg houvast."},
{w:7,q:"Wiarda: autonome rechtsvinding",a:"De rechter vult een open norm in of lost een leemte op terwijl het bestaande recht weinig concrete houvast biedt (een zeer vage norm, geen richtinggevende regels of uitspraken). Er is dus veel eigen afweging en ruimte voor rechtsvorming."},
{w:7,q:"Waarom wordt autonome rechtsvinding belangrijker?",a:"Door het gebruik van open normen door de wetgever, een veranderde opvatting over de rechterlijke taak en de invloed van Europees en internationaal recht (mensenrechten).\nHet onderscheid is een glijdende schaal."},
{w:7,q:"Grammaticale interpretatie",a:"Wat betekenen de woorden van de bepaling? Herken aan: bewoordingen, taalgebruik, (algemeen) spraakgebruik, woordenboek."},
{w:7,q:"Wetshistorische interpretatie",a:"Wat bedoelde de wetgever bij het maken van de bepaling? Herken aan: memorie van toelichting, parlementaire geschiedenis."},
{w:7,q:"Systematische interpretatie",a:"Hoe past de bepaling binnen het wettelijk stelsel? Herken aan: samenhang met andere artikelen, wetten of rechtsgebieden (bijv. ‘een ander artikel biedt hier een passender kader’)."},
{w:7,q:"Teleologische interpretatie",a:"Wat is het doel van de bepaling, ook in de huidige omstandigheden? Herken aan: het beschermde belang, functionele uitleg, maatschappelijke en technologische ontwikkelingen."},
{w:7,q:"Restrictieve vs. extensieve uitleg",a:"Restrictief: een bepaling beperkt uitleggen. Extensief: ruim uitleggen.\nDit is de reikwijdte van de uitleg, geen aparte interpretatiemethode."},
{w:7,q:"Extensieve interpretatie vs. analogie",a:"Extensief: ruime uitleg binnen de grenzen van de bepaling (toegestaan).\nAnalogie: de bepaling uitbreiden naar een geval dat erbuiten valt, alleen omdat het erop lijkt (in het strafrecht verboden). Over de grens kan discussie bestaan."},
{w:7,q:"Elektriciteitsarrest (1921)",a:"De HR oordeelde dat elektriciteit een ‘goed’ is dat kan worden weggenomen (art. 310 Sr). Dit is een extensieve uitleg."},
{w:7,q:"Belangenafweging: twee moeilijkheden",a:"1. Vaak spelen meer dan twee belangen.\n2. Belangen zijn niet op één schaal te vergelijken: incommensurabiliteit.\nGezichtspunten kunnen structuur geven (bij schadevergoeding bijv. aard van de schade, verwijtbaarheid, verzekeringsdekking)."},
{w:7,q:"Hart vs. Dworkin over moeilijke gevallen",a:"Hart: in moeilijke gevallen heeft de rechter discretionaire ruimte om nieuw recht te vormen.\nDworkin: ook als duidelijke regels ontbreken, geven rechtsbeginselen richting en binden ze de rechter."},
{w:7,q:"Argumenten voor rechterlijke rechtsvorming",a:"De rechter kan onduidelijkheden en leemten oplossen, het recht laten aansluiten bij maatschappelijke veranderingen, open normen voor concrete gevallen invullen en rechtsbescherming bieden."},
{w:7,q:"Argumenten voor terughoudendheid bij rechtsvorming",a:"Rechters zijn niet gekozen (minder democratische legitimatie); de wetgever kan bredere informatie en belangen betrekken en overgangsproblemen beter regelen; rechtersrecht kan rechtsonzekerheid veroorzaken."},
{w:7,q:"Primaat van de politiek en checks and balances",a:"Primaat van de politiek: de hoofdrol bij algemene politieke keuzes ligt bij de politiek.\nChecks and balances: de machten controleren elkaar en houden elkaar in evenwicht."},
{w:7,q:"Grenzen aan rechterlijke rechtsvorming",a:"Het wettelijk stelsel, rechtszekerheid en voorspelbaarheid, de taakverdeling tussen rechter, wetgever en bestuur, en het legaliteitsbeginsel (vooral in het strafrecht)."},
{w:7,q:"Ultimum remedium; straffen vs. maatregelen",a:"Strafrecht is een laatste middel als andere middelen onvoldoende zijn.\nStraffen: gericht op bewuste leedtoevoeging.\nMaatregelen: gericht op bescherming van de samenleving."},
{w:7,q:"Materieel legaliteitsbeginsel: waar staat het?",a:"Art. 1 lid 1 Sr en art. 16 Gw: geen feit is strafbaar zonder een daaraan voorafgaande wettelijke strafbepaling. Ook art. 7 EVRM."},
{w:7,q:"Vier aspecten van het materieel legaliteitsbeginsel",a:"Lex scripta: strafbaarheid vraagt een geschreven wettelijke basis (gewoonterecht is niet genoeg).\nLex certa: strafbepalingen moeten duidelijk zijn.\nVerbod van terugwerkende kracht.\nAnalogieverbod.\nPlus: bij wetswijziging de gunstigste bepaling voor de verdachte."},
{w:7,q:"Een verordening verbiedt ‘zich hinderlijk gedragen’ op straffe van een boete. Welk aspect van het legaliteitsbeginsel is in gevaar?",a:"Lex certa: de norm is zo vaag dat burgers niet goed kunnen voorzien welk gedrag strafbaar is. (Lex scripta is wel in orde: de regel is geschreven.)"},
{w:7,q:"Formeel legaliteitsbeginsel",a:"Art. 1 Sv: strafvordering vindt alleen plaats op de wijze die de wet voorziet. Gaat over opsporing, vervolging en berechting. (Materieel gaat over strafbaarheid en bestraffing.)"},
{w:7,q:"Mensenroof (art. 278 Sr)",a:"Rechtsvraag: omvat ‘over de grenzen’ ook iemand naar Nederland brengen?\nHof: beperkte uitleg (alleen vanuit NL), beroep op de wetsgeschiedenis.\nHR: ook naar NL, met grammaticale, wetshistorische en teleologische argumenten.\nBetekenis: ruime uitleg van strafbepalingen roept vragen op over het legaliteitsbeginsel."},
{w:7,q:"Rozemonds kritiek op RuneScape",a:"De verruiming van ‘goed’ is onvoldoende onderbouwd; de vergelijking met elektriciteit gaat niet vanzelf op; de verhouding tot computervredebreuk had beter onderzocht moeten worden (systematische interpretatie).\nOver computervredebreuk (art. 138ab Sr) bepleit hij een functionele, teleologische uitleg in plaats van een wetshistorische."},
{w:7,q:"Tongzoen II: welke interpretatiemethoden gebruikte de HR?",a:"Grammaticaal: een gedwongen tongzoen als verkrachting aanmerken is in strijd met het algemene spraakgebruik.\nSystematisch: een ander wettelijk kader (feitelijke aanranding, art. 246 Sr in de nummering van toen) is meer geëigend."},
{w:7,q:"Jip de kip: welke methode gebruikte de advocaat?",a:"Systematische interpretatie: hij koppelde ‘wederrechtelijk’ bij diefstal (art. 310 Sr) aan de rechtvaardigingsgrond van art. 42 Sr en de zorgplicht uit de Wet dieren. Andere wetten en artikelen in samenhang lezen = systematisch."},
{w:7,q:"Boogaard & Uzman: tussen Montesquieu en Judge Dredd",a:"Montesquieu: rechter als spreekbuis van de wet (heteronoom).\nJudge Dredd: rechter spreekt recht op eigen gezag.\nZij zitten daartussen: gematigd heteronoom, de rechter is meer dan een mechanische toepasser van de wet."},

// ---------- WEEK 8 ----------
{w:8,q:"Negatieve vs. positieve vrijheid",a:"Negatief: vrij zijn van inmenging en obstakels door anderen (met rust gelaten worden). Overheid: terughoudend.\nPositief: daadwerkelijk de mogelijkheden hebben om jezelf te ontplooien (iets kunnen). Overheid: voorwaarden scheppen, ondersteunen."},
{w:8,q:"Negatieve vrijheid: welke rechten en welke overheid?",a:"Vooral burgerlijke en politieke rechten (vrijheid van meningsuiting, kiesrecht) en een terughoudende overheid. Sociale grondrechten (werk, volksgezondheid) horen bij positieve vrijheid."},
{w:8,q:"Individuele, collectieve, keuze- en ware vrijheid",a:"Individueel: vrijheid van één persoon.\nCollectief: vrijheid van een groep (zelfbeschikkingsrecht van een volk).\nKeuzevrijheid: zelf bepalen welke doelen je nastreeft.\nWare vrijheid: handelen volgens wat als je werkelijke belang of het goede wordt gezien."},
{w:8,q:"Locke: natuurtoestand en staat",a:"In de natuurtoestand zijn mensen vrij en gelijk, maar niet onbeperkt: de natuurwet verbiedt schade aan leven, gezondheid en eigendom. Omdat de natuurtoestand onzeker is, richten mensen een staat op die leven, vrijheid en eigendom beschermt. De staat beperkt vrijheid, maar maakt beschermde burgerlijke vrijheid mogelijk. De overheid mag geen geloof afdwingen."},
{w:8,q:"Locke: hoe voorkom je machtsmisbruik?",a:"Legaliteitsbeginsel, scheiding van wetgevende en uitvoerende macht, en volksvertegenwoordiging."},
{w:8,q:"Formele vs. materiële gelijkheid",a:"Formeel: gelijke rechten, gelijke gevallen gelijk behandelen. Overheid: gelijke juridische behandeling waarborgen.\nMaterieel: rekening houden met feitelijke verschillen en achterstanden (kijkt naar het resultaat). Overheid: waar nodig extra ondersteuning of compensatie."},
{w:8,q:"Welke combinaties horen bij elkaar (vrijheid, gelijkheid, overheid)?",a:"Negatieve vrijheid + formele gelijkheid → terughoudende overheid.\nPositieve vrijheid + materiële gelijkheid → actieve overheid (voorzieningen, herverdeling, verzorgingsstaat).\nSpanning: herverdeling bevordert gelijkheid maar kan vrijheid beperken."},
{w:8,q:"Formele vs. materiële democratie",a:"Formeel: draait om procedures, gelijke stemmen en meerderheidsbesluitvorming.\nMaterieel: vereist ook gelijkwaardigheid, grondrechten en bescherming van minderheden; meerderheidsbesluiten kunnen daarvoor worden begrensd (tegen tirannie van de meerderheid)."},
{w:8,q:"Hoe wordt gelijkheid uitgelegd in formele en materiële democratie?",a:"Formele democratie: gelijkheid = gelijkheid van stemmen, iedere stem telt even zwaar.\nMateriële democratie: gelijkheid = gelijkwaardigheid, iedereen verdient gelijke zorg en respect; minderheden mogen niet zomaar achtergesteld worden, ook als de meerderheid dat wil."},
{w:8,q:"Past een grotere rol van de rechter in een democratie?",a:"Formele democratie: nee. De rechter is niet gekozen en heeft geen democratische legitimatie.\nMateriële democratie: ja. Een controlerende rechter waarborgt democratische waarden en beschermt minderheden tegen onderdrukking door de meerderheid."},
{w:8,q:"Klassieke, politieke en sociale grondrechten",a:"Klassiek: beschermen vrijheid tegen overheidsinmenging (sluit aan bij negatieve vrijheid).\nPolitiek: deelname aan besluitvorming, zoals kiesrecht.\nSociaal: basisvoorwaarden voor bestaan en ontplooiing (sluit aan bij positieve vrijheid)."},
{w:8,q:"Trias politica: machtenscheiding vs. machtenspreiding",a:"Machtenscheiding: de wetgevende, uitvoerende en rechterlijke macht hebben strikt gescheiden taken en bemoeien zich niet met elkaar.\nMachtenspreiding: eigen taken, maar ze controleren en begrenzen elkaar (checks and balances)."},
{w:8,q:"Waarom is onafhankelijkheid van de rechter essentieel?",a:"Hij moet zonder ongeoorloofde beïnvloeding door andere machten kunnen oordelen. Spanning: hij moet burgers beschermen, maar ook de bevoegdheden van politiek en bestuur respecteren."},
{w:8,q:"Staatsneutraliteit: drie vormen",a:"Exclusief: religieuze uitingen zo veel mogelijk buiten de publieke sfeer houden. Dezelfde beperking voor iedereen → formele gelijkheid.\nInclusief: alle overtuigingen mogen zichtbaar zijn en worden gelijkwaardig behandeld. Gelijke ruimte voor iedereen → formele gelijkheid.\nCompenserend: minderheden krijgen extra steun om achterstanden te verminderen → materiële gelijkheid."},
{w:8,q:"Waarom ligt religieuze neutraliteit bij rechters gevoeliger?",a:"Naast onafhankelijkheid is ook de schijn van onpartijdigheid belangrijk. Daarom zijn zichtbare religieuze uitingen bij rechters onderwerp van discussie."},
{w:8,q:"Vrijheid van meningsuiting: Amerikaanse benadering",a:"Ruime bescherming van politieke meningen, ook schokkende en beledigende, zolang het geen directe oproep tot geweld is. Gedachte: vrije markt van ideeën, slechte ideeën bestrijd je met betere argumenten. De overheid bepaalt zo weinig mogelijk welke ideeën aanvaardbaar zijn."},
{w:8,q:"Vrijheid van meningsuiting: Europese benadering",a:"Beschermd, maar ook begrensd ter bescherming van andere rechten, democratische waarden en kwetsbare groepen.\nArt. 10 lid 2 EVRM: ruimte voor gerechtvaardigde beperkingen.\nArt. 17 EVRM: verdragsrechten mogen niet worden gebruikt om de rechten van het EVRM te vernietigen.\nSluit aan bij materiële democratie."},
{w:8,q:"Art. 137c en 137d Sr",a:"137c: groepsbelediging.\n137d: aanzetten tot haat, discriminatie of geweld.\nDe context van een uitlating is belangrijk: kritiek op een geloof is niet hetzelfde als belediging van gelovigen."},
{w:8,q:"Aanwijzingsbevoegdheid van de minister aan het OM afschaffen: welke opvatting van de trias?",a:"In lijn met machtenscheiding: de machten moeten strikt gescheiden zijn. De minister hoort bij de uitvoerende macht, het OM bij de rechterlijke macht. Zonder aanwijzingsbevoegdheid ontstaat een grotere scheiding."},
{w:8,q:"Aanwijzingsbevoegdheid vs. Keen: overeenkomst en verschil",a:"Overeenkomst: beide gaan uit van een scheiding tussen recht en beleid, dus tussen de rechtsprekende en de uitvoerende macht.\nVerschil: de richting. Keen zegt dat de rechter zich niet met de uitvoerende macht (gratie) mag bemoeien. Afschaffen van de aanwijzingsbevoegdheid zorgt juist dat de uitvoerende macht zich minder met de rechtsprekende macht bemoeit.\n(Recht vs. moraal levert hier geen punten op: niet gevraagd!)"},

// ---------- EXTRA (oefentoets) ----------
{w:9,q:"Wet Algemene Bepalingen: welke artikelen laten zien dat de wet als enige rechtsbron werd gezien?",a:"Art. 5: een wet verliest alleen haar kracht door een latere wet (niet door gewoonte of jurisprudentie).\nArt. 11: de rechter moet volgens de wet rechtspreken en mag de innerlijke waarde of billijkheid van de wet niet beoordelen.\nArt. 12: de rechter mag geen uitspraak doen bij wege van algemene verordening; een uitspraak bindt alleen de partijen.\nNiet goed: art. 4, 13 en 13a."},
{w:9,q:"Open textuur van de taal (antwoordmodel)",a:"Rechtsregels bestaan uit taal en het is eigen aan taal dat er randgevallen zijn waarbij onduidelijk is of iets binnen een begrip valt. In zulke moeilijke gevallen moet de rechter beslissen over de reikwijdte van een bepaling, waardoor de betekenis door de tijd verandert."},
{w:9,q:"Evolutionair karakter van het recht (Holmes, Ratnapala)",a:"Recht ontstaat niet alleen via de wetgever, maar ook vanuit de samenleving (van onderop), bijv. via gewoonterecht. Het recht ontwikkelt zich mee met de samenleving, ook buiten de wil van de wetgever om."},
{w:9,q:"Taverne (1921): ‘De wetgever is als een moeder die haar kind te vondeling legt...’ Hoe koppel je dit aan open textuur en het evolutionaire karakter?",a:"Open textuur: wat ‘goed’ bij diefstal betekent ligt niet vast; de betekenis verandert door uitspraken over randgevallen (elektriciteit).\nEvolutionair: de betekenis van de wet wordt mede door de maatschappij bepaald, los van wat de wetgever bedoelde; de wet leidt een zelfstandig bestaan."},
{w:9,q:"Toeslagenaffaire en de trias politica",a:"Lang toetste de ABRvS terughoudend en liet zij de uitvoerende macht ongemoeid. Vanaf oktober 2019 paste zij het evenredigheidsbeginsel toe om burgers te beschermen tegen starre uitvoering: meer checks and balances (machtenspreiding)."},
{w:9,q:"A.J. Nieuwenhuis: ‘Democratie, groepsbelediging en haatzaaien’",a:"Let op: een andere Nieuwenhuis dan bij de rechtsbeginselen.\nAmerikaans: ook beledigende of haatdragende uitingen beschermd zolang geen directe oproep tot geweld.\nEuropees: meer ruimte om uitingsvrijheid te beperken ter bescherming van democratische waarden en kwetsbare groepen."}
];

// Meerkeuzevragen in de stijl van de oefentoets (nieuwe vragen, zelfde soort).
// Gewone vraag: {w, t, q, o:[4 opties], a: index juiste optie, e: uitleg}
// Stellingenvraag: {w, t, st:true, q (inleiding), s1, s2, a:'JJ'|'JO'|'OJ'|'OO', e}
window.MC = [
// ---------- WEEK 1 ----------
{w:1,t:"Publiek of privaat",q:"De gemeente Bunnik huurt een kantoorpand van een vastgoedbedrijf. Na een verbouwing weigert de gemeente de laatste drie maanden huur te betalen. Het vastgoedbedrijf stapt naar de rechter. Het geschil valt onder het:",o:["Privaatrecht","Bestuursrecht","Staatsrecht","Strafrecht"],a:0,e:"De gemeente treedt hier op als gewone private partij (huurder in een huurovereenkomst). Ook de overheid kan als private partij optreden; dan geldt het privaatrecht."},
{w:1,t:"Soorten normen",q:"Art. 310 Sr luidt: ‘Hij die enig goed dat geheel of ten dele aan een ander toebehoort wegneemt, met het oogmerk om het zich wederrechtelijk toe te eigenen, wordt, als schuldig aan diefstal, gestraft met gevangenisstraf van ten hoogste vier jaren of geldboete van de vierde categorie.’ In dit artikel is sprake van:",o:["Zowel een gedragsnorm als een sanctienorm","Alleen een sanctienorm","Alleen een gedragsnorm","Een bevoegdheidverlenende norm"],a:0,e:"In een strafbepaling zit impliciet een gedragsnorm (neem geen goed van een ander weg) én een sanctienorm (de straf die op overtreding staat)."},
{w:1,t:"Soorten normen",q:"Art. 149 Gemeentewet luidt: ‘De raad maakt de verordeningen die hij in het belang der gemeente nodig oordeelt.’ Dit is vooral een:",o:["Bevoegdheidverlenende norm","Gedragsnorm in de vorm van een gebod","Definitiebepaling","Schakelbepaling"],a:0,e:"De bepaling geeft de gemeenteraad de juridische bevoegdheid om verordeningen vast te stellen. Dat is het schoolvoorbeeld van een bevoegdheidverlenende norm."},
{w:1,t:"Soorten normen",q:"Een bepaling luidt: ‘Onder bestuursorgaan wordt verstaan: een orgaan van een rechtspersoon die krachtens publiekrecht is ingesteld.’ Wat voor bepaling is dit?",o:["Een definitiebepaling","Een schakelbepaling","Een bevoegdheidverlenende norm","Een sanctienorm"],a:0,e:"De bepaling legt uit wat een begrip in de wet betekent: een definitiebepaling."},
{w:1,t:"Soorten normen",st:true,q:"Lees de volgende stellingen.",s1:"Een sanctie is altijd een straf.",s2:"Gedragsnormen en sanctienormen hangen vaak samen.",a:"OJ",e:"Stelling 1 is onjuist: ook een plicht tot schadevergoeding kan een sanctie zijn. Stelling 2 is juist: een sanctienorm verbindt een gevolg aan het overtreden van een gedragsnorm."},
{w:1,t:"Kernbegrippen",q:"Een werkgever en een werknemer spreken in een contract af dat de werknemer minder krijgt dan het wettelijk minimumloon. Welk onderscheid is hier het meest relevant?",o:["Dwingend recht: hiervan mogen partijen niet afwijken","Aanvullend recht: dit geldt alleen als partijen niets afspreken","Formeel recht: dit regelt de procedure","Wenselijk recht: dit is het recht zoals het zou moeten zijn"],a:0,e:"De regels over het minimumloon zijn dwingend recht: partijen mogen er niet van afwijken, ook niet als ze dat allebei willen."},
{w:1,t:"Kernbegrippen",q:"Welke bepaling bevat een regel van formeel recht?",o:["Een bepaling die regelt binnen welke termijn hoger beroep moet worden ingesteld","Een bepaling die diefstal verbiedt","Een bepaling die zegt dat de koper de koopprijs moet betalen","Een bepaling die het minimumloon vaststelt"],a:0,e:"Formeel recht (procesrecht) regelt de procedures waarmee het materiële recht wordt toegepast of afgedwongen. Een termijn voor hoger beroep is een procesregel; de andere opties regelen rechten en plichten zelf (materieel recht)."},
{w:1,t:"Kernbegrippen",q:"Een vakbond voert campagne om het wettelijk minimumloon met 10% te verhogen. Het minimumloon waar de vakbond voor pleit, is een voorbeeld van:",o:["Wenselijk recht","Positief recht","Objectief recht","Subjectief recht"],a:0,e:"Wenselijk recht is het recht zoals iemand of een groep vindt dat het zou moeten zijn. Het huidige minimumloon is positief recht."},
{w:1,t:"Kernbegrippen",q:"Lotte is eigenaar van een laptop. Haar eigendomsrecht op die laptop is een voorbeeld van:",o:["Subjectief recht, dat zij ontleent aan het objectieve recht","Objectief recht, omdat het om eigendom gaat","Wenselijk recht, omdat zij de laptop wil houden","Formeel recht, omdat eigendom moet worden bewezen"],a:0,e:"Een subjectief recht is een concrete aanspraak of bevoegdheid van iemand. Die ontleent zij aan het objectieve recht: de algemene regels over eigendom."},
{w:1,t:"Kernbegrippen",st:true,q:"Lees de volgende stellingen.",s1:"Uit het objectieve recht kunnen subjectieve rechten voortvloeien.",s2:"Objectief recht is een ideaalbeeld van het recht, positief recht is het feitelijke recht.",a:"JO",e:"Stelling 1 klopt: de algemene regels (objectief recht) geven concrete rechten (subjectief recht). Stelling 2 is onjuist: objectief recht is de verzameling van alle rechtsregels binnen een rechtsorde, inclusief het geldende (positieve) recht. Een ideaalbeeld is wenselijk recht."},
{w:1,t:"Publiek of privaat",q:"Welke uitspraak over publiekrecht en privaatrecht is juist?",o:["Ook de overheid kan als private partij optreden, en dan geldt het privaatrecht","Publiekrecht regelt alle rechtsverhoudingen waarbij de overheid partij is","Strafrecht hoort bij het privaatrecht, omdat het slachtoffer een burger is","Privaatrecht regelt de organisatie en bevoegdheden van de overheid"],a:0,e:"Publiekrecht gaat over de overheid wanneer zij als overheid optreedt (straf-, staats- en bestuursrecht). Koopt of huurt de overheid iets zoals iedere burger, dan geldt het privaatrecht."},

// ---------- WEEK 2 ----------
{w:2,t:"Grotverkenners",q:"Een rechter zegt: ‘Als mens begrijp ik dat dit vonnis hard voelt. Maar de wet is duidelijk, en het is niet aan mij om haar opzij te zetten. Ik ga het bestuur ook niet vragen om gratie: dat is een beslissing van de uitvoerende macht, niet van de rechter.’ Bij welke rechter uit de grotverkenners past dit het best?",o:["Keen","Truepenny","Foster","Tatting"],a:0,e:"Keen scheidt zijn persoonlijke mening strikt van zijn taak als rechter en vindt dat gratie aan het bestuur is; hij bekritiseert juist Truepenny, die zelf om strafvermindering vraagt."},
{w:2,t:"Grotverkenners",q:"Welke rechter in de grotverkennerszaak beroept zich op een peiling waaruit blijkt dat 90% van de bevolking vrijspraak wil?",o:["Handy, vanuit het rechtsrealisme","Foster, vanuit het natuurrecht","Keen, vanuit het rechtspositivisme","Truepenny, vanuit het rechtspositivisme"],a:0,e:"Handy ziet de zaak als een praktisch en menselijk probleem; goed bestuur houdt rekening met de opvattingen van de bevolking. Dat past bij het rechtsrealisme en de kernwaarde doelmatigheid."},
{w:2,t:"Grotverkenners",q:"Welke rechter gebruikt de uitzondering voor zelfverdediging om te laten zien dat je de letter van de wet kunt schenden zonder het recht te schenden?",o:["Foster","Tatting","Keen","Handy"],a:0,e:"Foster: een verbod op doden wordt ook niet zonder uitzonderingen toegepast (zelfverdediging). Dat is zijn tweede argument voor vrijspraak, naast de natuurtoestand."},
{w:2,t:"Grotverkenners",q:"Welke rechter komt niet tot een oordeel en onthoudt zich van een uitspraak?",o:["Tatting","Truepenny","Handy","Foster"],a:0,e:"Tatting ziet te veel onopgeloste tegenstrijdigheden (wanneer begon de natuurtoestand, waarom is de afspraak bindend, de tien omgekomen reddingswerkers) en onthoudt zich."},
{w:2,t:"Stromingen",q:"Welke combinatie van stroming en kernwaarde is juist?",o:["Rechtsrealisme: doelmatigheid","Natuurrecht: rechtszekerheid","Rechtspositivisme: rechtvaardigheid","Rechtsrealisme: rechtszekerheid"],a:0,e:"Rechtspositivisme hoort bij rechtszekerheid, natuurrecht bij rechtvaardigheid en rechtsrealisme bij doelmatigheid."},
{w:2,t:"Van Hese/De Schelde",q:"Welke spanning tussen kernwaarden illustreert het arrest Van Hese/De Schelde het best?",o:["Rechtszekerheid tegenover rechtvaardigheid","Doelmatigheid tegenover rechtszekerheid","Rechtvaardigheid tegenover gelijkheid","Doelmatigheid tegenover rechtvaardigheid"],a:0,e:"Verjaring dient de rechtszekerheid (oude claims moeten eindigen), maar het slachtoffer kon zijn schade niet eerder ontdekken. Daar botst rechtszekerheid met rechtvaardigheid."},
{w:2,t:"Van Hese/De Schelde",st:true,q:"Lees de volgende stellingen over Van Hese/De Schelde.",s1:"De Hoge Raad oordeelde dat asbestclaims niet meer kunnen verjaren.",s2:"Een beroep op de verjaringstermijn kan onder bijzondere omstandigheden naar maatstaven van redelijkheid en billijkheid onaanvaardbaar zijn.",a:"OJ",e:"Er is geen algemene uitzondering voor asbestclaims: de rechter moet per geval de omstandigheden en belangen afwegen. Stelling 2 geeft het oordeel van de HR juist weer."},
{w:2,t:"Antinomieën",q:"Wat wordt bedoeld met ‘antinomieën’ tussen de kernwaarden?",o:["De kernwaarden kunnen met elkaar botsen, en geen van de drie heeft altijd voorrang","Rechtszekerheid heeft altijd voorrang op de andere twee","De kernwaarden staan los van elkaar en raken elkaar nooit","Alleen rechtvaardigheid en doelmatigheid kunnen botsen"],a:0,e:"Rechtszekerheid, rechtvaardigheid en doelmatigheid kunnen elkaar ondersteunen, maar ook botsen. Er is geen eenvoudige keuze waarbij één waarde altijd wint."},

// ---------- WEEK 3 ----------
{w:3,t:"Positivisme vs. natuurrecht",st:true,q:"Lees de volgende stellingen over het rechtspositivisme.",s1:"Volgens het rechtspositivisme is een onrechtvaardige wet geen recht.",s2:"Volgens het rechtspositivisme is vooral de herkomst van een regel bepalend voor haar geldigheid.",a:"OJ",e:"‘Onrechtvaardig recht is geen recht’ hoort bij het natuurrecht. Het rechtspositivisme scheidt de vraag wat geldend recht is van de vraag of het moreel juist is; de herkomst (erkende procedure) telt."},
{w:3,t:"Hart",q:"Een ambtenaar weigert een geldig tot stand gekomen wet uit te voeren, omdat hij die immoreel vindt. Hoe zou H.L.A. Hart dit het best duiden?",o:["De wet is geldig recht; of je haar moreel moet gehoorzamen is een andere vraag","De wet is ongeldig, omdat een immorele wet geen recht is","De wet is geldig en daarom ook automatisch moreel juist","De wet is pas geldig als een rechter haar moreel heeft getoetst"],a:0,e:"Voor Hart is geldigheid onafhankelijk van moraliteit. Iets kan illegaal zijn en toch moreel juist worden geacht. Geldigheid en morele beoordeling zijn twee aparte vragen."},
{w:3,t:"Hart",q:"Welke van de volgende regels is een primaire regel in de zin van Hart?",o:["Een verbod op mishandeling","Een regel die bepaalt wie wetten mag wijzigen en hoe","Een regel die de rechter bevoegd maakt om geschillen te beslechten","Een regel die aangeeft aan welke criteria je geldend recht herkent"],a:0,e:"Primaire regels regelen rechtstreeks het gedrag van mensen. De andere drie zijn secundaire regels: veranderingsregel, handhavingsregel en herkenningsregel."},
{w:3,t:"Hart",q:"In een groeiende gemeenschap ontstaat steeds vaker ruzie over de vraag welke regels nu eigenlijk gelden. Welke secundaire regel biedt volgens Hart een oplossing?",o:["De herkenningsregel","De veranderingsregel","De handhavingsregel","Geen: dit is een probleem van primaire regels"],a:0,e:"Onzekerheid over welke regels gelden wordt opgelost door een herkenningsregel: criteria om geldend recht te herkennen (vooral op basis van de herkomst)."},
{w:3,t:"Hart",q:"Welke bepaling is in de zin van Hart géén veranderingsregel?",o:["Een bepaling die iemand die onrechtmatig handelt verplicht de schade te vergoeden","Een bepaling dat wetten door regering en Staten-Generaal gezamenlijk worden vastgesteld","Een bepaling dat de gemeenteraad verordeningen maakt","Een bepaling die regelt dat partijen door een overeenkomst verbintenissen in het leven roepen"],a:0,e:"Een plicht tot schadevergoeding bij onrechtmatige daad regelt rechtstreeks gedrag en gevolgen: een primaire regel. De andere drie geven bevoegdheid om rechtsposities of regels te veranderen."},
{w:3,t:"Hart",q:"Een gemeentelijke regel verbiedt ‘voertuigen in het park’. Er ontstaat discussie of een elektrische kinderstep daaronder valt. Welk begrip van Hart past hier het best bij?",o:["Open textuur: de regel laat randgevallen open, waardoor de rechter beoordelingsruimte heeft","Juridisch formalisme: uit de regel volgt logisch één juiste uitkomst","De herkenningsregel: het is onduidelijk of de regel geldend recht is","Primaire regels: die zijn hier niet van toepassing"],a:0,e:"Door de open textuur van taal liggen niet alle gevallen vast. In zo'n moeilijk geval heeft de rechter volgens Hart beoordelingsruimte en kan hij recht vormen."},
{w:3,t:"Formalisme",st:true,q:"Lees de volgende stellingen.",s1:"Volgens het juridisch formalisme volgt uit het logisch toepassen van regels op feiten steeds één juiste uitkomst.",s2:"Moderne rechtspositivisten zoals Hart erkennen dat de rechter in moeilijke gevallen beoordelingsruimte heeft.",a:"JJ",e:"Beide kloppen. Juist daarom betekent rechtspositivisme niet automatisch dat een rechter mechanisch de letter van de wet toepast."},
{w:3,t:"Radbruch",q:"Welke uitspraak past het best bij Radbruch?",o:["Positief recht heeft in beginsel voorrang, ook als het onrechtvaardig is, maar moet wijken bij een onverdraaglijk grote tegenstelling met de rechtvaardigheid","Iedere onrechtvaardige wet moet door de rechter buiten toepassing worden gelaten","Rechtvaardigheid zit altijd in het recht zelf besloten, via de rechtsbeginselen","Het recht is niets anders dan een voorspelling van wat rechters zullen beslissen"],a:0,e:"Dat is de Radbruch-formule. Optie 2 is te absoluut (gewone onrechtvaardigheid is niet genoeg), optie 3 past bij Dworkin en optie 4 bij Holmes."},
